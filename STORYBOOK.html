<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoHoH — Pirate Kings Storybook | The Shattered Seas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080d18;
      --bg-panel: #0e1628;
      --bg-card: #121d32;
      --accent-gold: #c9a227;
      --accent-gold-dim: #a88620;
      --accent-sea: #1e4d6b;
      --accent-sea-light: #2a6b8a;
      --text-primary: #e8e8e6;
      --text-secondary: #b8c4d0;
      --text-muted: #7a8a9a;
      --border: #1e3a52;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
      font-size: 1.05rem;
      min-height: 100vh;
    }
    .page-header {
      text-align: center;
      padding: 3rem 2rem;
      background: radial-gradient(ellipse 100% 80% at 50% 0%, rgba(30, 77, 107, 0.2) 0%, transparent 60%), var(--bg-dark);
      border-bottom: 1px solid var(--border);
    }
    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    .page-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-style: italic;
    }
    .page-tagline {
      margin-top: 1rem;
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 32rem;
      margin-left: auto;
      margin-right: auto;
    }
    .kings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      padding: 3rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .king-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .king-tile:hover {
      transform: translateY(-4px);
      border-color: var(--accent-gold-dim);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .king-tile img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .king-tile .tile-info {
      padding: 1rem;
    }
    .king-tile .tile-name {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--accent-gold);
      margin-bottom: 0.25rem;
    }
    .king-tile .tile-title {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .king-tile .tile-domain {
      font-size: 0.8rem;
      color: var(--accent-sea-light);
      margin-top: 0.5rem;
    }
    .king-tile .tile-dragon {
      font-size: 0.8rem;
      margin-top: 0.25rem;
      padding: 0.25rem 0.5rem;
      background: rgba(42,107,138,0.2);
      border-radius: 4px;
    }
    .king-tile .tile-dragon.protects {
      background: rgba(74,124,89,0.2);
    }
    /* Modal */
    .lore-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.9);
      overflow-y: auto;
    }
    .lore-modal.open {
      display: flex;
    }
    .lore-modal-content {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      position: relative;
    }
    .lore-modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 48px;
      height: 48px;
      padding: 0;
      background: rgba(30, 60, 90, 0.9);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text-primary);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      z-index: 10000;
      transition: background 0.2s;
    }
    .lore-modal-close:hover {
      background: rgba(42, 107, 138, 0.8);
    }
    .lore-header {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .lore-header img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
    }
    .lore-meta .lore-name {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: var(--accent-gold);
      margin-bottom: 0.25rem;
    }
    .lore-meta .lore-title {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .lore-meta .lore-theme {
      font-size: 0.85rem;
      color: var(--accent-sea-light);
    }
    .lore-meta .lore-alignment {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .lore-meta .lore-mythic-role {
      font-size: 0.85rem;
      color: var(--accent-sea-light);
      font-style: italic;
      margin-top: 0.25rem;
    }
    /* Historical Wound badge — visual parity with the pitch deck. */
    .tile-wound {
      margin-top: 0.5rem;
      padding: 0.35rem 0.5rem;
      background: rgba(106,71,135,0.14);
      border: 1px solid rgba(106,71,135,0.36);
      border-left: 3px solid #8a6dab;
      border-radius: 4px;
      font-size: 0.74rem;
      color: #c4b0e4;
      line-height: 1.4;
    }
    .tile-wound::before { content: '⚖ '; color: #b69de0; }
    .lore-wound {
      padding: 0.85rem 1rem;
      background: rgba(106,71,135,0.14);
      border: 1px solid rgba(106,71,135,0.4);
      border-left: 3px solid #8a6dab;
      border-radius: 6px;
      color: #d8c8f0;
      font-size: 0.95rem;
      line-height: 1.55;
    }
    .lore-wound strong {
      display: block;
      color: #c4b0e4;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }
    .tile-dragon.neutral { background: rgba(156,163,175,0.18); }
    .lore-dragon.neutral { border-left-color: #9ca3af; background: rgba(156,163,175,0.14); }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.7;
    }
    .empty-state code {
      background: var(--bg-card);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: var(--accent-gold);
      font-style: normal;
    }
    .lore-body {
      padding: 1.5rem;
    }
    .lore-section {
      margin-bottom: 1.5rem;
    }
    .lore-section h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      color: var(--accent-gold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid var(--border);
    }
    .lore-section p {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }
    .lore-section ul {
      padding-left: 1.25rem;
      margin: 0.5rem 0;
    }
    .lore-section li {
      margin: 0.25rem 0;
    }
    .lore-dragon {
      padding: 0.75rem;
      border-radius: 6px;
      border-left: 3px solid var(--accent-sea-light);
      background: rgba(42,107,138,0.15);
      font-size: 0.95rem;
    }
    .lore-dragon.protects {
      border-left-color: #4a7c59;
      background: rgba(74,124,89,0.15);
    }
    .lore-familiar {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      margin-top: 0.5rem;
    }
    .lore-familiar img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .lore-familiar-text strong {
      color: var(--accent-gold);
    }
    .back-link {
      display: inline-block;
      margin: 2rem;
      padding: 0.5rem 1rem;
      color: var(--accent-sea-light);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--accent-gold);
    }
    @media (max-width: 600px) {
      .lore-header { grid-template-columns: 1fr; }
      .kings-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1 class="page-title">Pirate Kings Storybook</h1>
  <p class="page-subtitle">The Five Pirate Kings of the Shattered Seas</p>
  <p class="page-tagline">"The old empires drowned. The seas broke. Five crowns rose from the wreckage—and none of them bow to any king on land."</p>
</div>

<div class="kings-grid" id="kings-grid">
  <!-- Populated by JS -->
</div>

<a href="docs/index.html" class="back-link">← Back to Presentation</a>

<div class="lore-modal" id="lore-modal" aria-hidden="true">
  <button type="button" class="lore-modal-close" id="modal-close" aria-label="Close">&times;</button>
  <div class="lore-modal-content" id="lore-content">
    <!-- Populated by JS -->
  </div>
</div>

<!-- PIRATE_KINGS_LORE_DATA --><!-- Injected by scripts/extract-lore.js — populates window.LORE_DATA + window.PIRATE_KINGS_LORE -->

<script>
// Storybook data source — was a hardcoded 5-king array until 2026-05-22.
// Now data-driven from LORE.md via scripts/extract-lore.js, so the Storybook
// stays in sync with the pitch deck and the Lorebook. Three sources, tried in
// order: (1) inline injection by extract-lore, (2) data file in docs/data/,
// (3) graceful empty-state telling the reader to run the extractor.

async function loadKings() {
  if (Array.isArray(window.PIRATE_KINGS_LORE) && window.PIRATE_KINGS_LORE.length) {
    return window.PIRATE_KINGS_LORE;
  }
  if (window.LORE_DATA && Array.isArray(window.LORE_DATA.pirateKings)) {
    return window.LORE_DATA.pirateKings;
  }
  // Root-level STORYBOOK.html lives next to LORE.md; try public/ then docs/.
  for (const url of ['public/data/pirate-kings-lore.json', 'docs/data/pirate-kings-lore.json', 'data/pirate-kings-lore.json']) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (res.ok) return await res.json();
    } catch (e) { /* try next */ }
  }
  return [];
}

function formatText(text) {
  return String(text || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function paras(text) {
  return formatText(text).split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, ' ')}</p>`).join('');
}

function dragonLabel(stance) {
  if (stance === 'protects') return 'Protects dragons';
  if (stance === 'neutral')  return 'Neutral on dragons';
  return 'Hunts dragons';
}

function renderTile(king) {
  const domainName = (king.domain && king.domain.name) || '';
  const wound = king.historicalWound
    ? `<div class="tile-wound">${formatText(king.historicalWound)}</div>`
    : '';
  return `
    <div class="king-tile" data-king-id="${king.id}">
      <img src="${king.image}" alt="${king.name}">
      <div class="tile-info">
        <div class="tile-name">${king.name}</div>
        <div class="tile-title">${king.title}</div>
        <div class="tile-domain">${domainName}</div>
        <div class="tile-dragon ${king.dragonStance || 'hunts'}">${dragonLabel(king.dragonStance)}</div>
        ${wound}
      </div>
    </div>
  `;
}

function renderModal(king) {
  const f = king.familiar || {};
  const d = king.domain || {};
  const wound = king.historicalWound
    ? `<div class="lore-section">
         <h3>Historical Wound</h3>
         <div class="lore-wound"><strong>The Age this King embodies</strong>${formatText(king.historicalWound)}</div>
       </div>`
    : '';
  const mythicRole = king.mythicRole
    ? `<div class="lore-mythic-role">${formatText(king.mythicRole)}</div>` : '';
  const rel = king.relationshipToPlayer
    ? `<div class="lore-section"><h3>Relationship to the Player</h3>${paras(king.relationshipToPlayer)}</div>`
    : '';
  const abilities = (f.abilities || []).map(a => `<li>${formatText(a)}</li>`).join('');
  const effects   = (d.effects   || []).map(e => `<li>${formatText(e)}</li>`).join('');
  const hooks     = (king.playerHooks || []).map(h => `<li>${formatText(h)}</li>`).join('');
  return `
    <div class="lore-header">
      <img src="${king.image}" alt="${king.name}">
      <div class="lore-meta">
        <div class="lore-name">${king.name}</div>
        <div class="lore-title">${king.title}</div>
        <div class="lore-theme">${king.theme}</div>
        <div class="lore-alignment">${king.alignment}${king.status ? ' • ' + king.status : ''}</div>
        ${mythicRole}
      </div>
    </div>
    <div class="lore-body">
      ${wound}
      <div class="lore-section">
        <h3>Backstory</h3>
        ${paras(king.backstory)}
      </div>
      <div class="lore-section">
        <h3>Dragons</h3>
        <div class="lore-dragon ${king.dragonStance || 'hunts'}">${paras(king.dragons)}</div>
      </div>
      ${rel}
      ${f.name ? `<div class="lore-section">
        <h3>Familiar — ${f.name}</h3>
        <div class="lore-familiar">
          <img src="${f.image || ''}" alt="${f.name}">
          <div class="lore-familiar-text">
            <strong>${f.name}</strong> — ${f.type || ''}
            <ul>${abilities}</ul>
          </div>
        </div>
      </div>` : ''}
      ${d.name ? `<div class="lore-section">
        <h3>Domain — ${d.name}</h3>
        <p><em>${formatText(d.desc || '')}</em></p>
        <ul>${effects}</ul>
      </div>` : ''}
      ${hooks ? `<div class="lore-section">
        <h3>Player Hooks</h3>
        <ul>${hooks}</ul>
      </div>` : ''}
    </div>
  `;
}

const grid = document.getElementById('kings-grid');
const modal = document.getElementById('lore-modal');
const content = document.getElementById('lore-content');
const closeBtn = document.getElementById('modal-close');

let activeKings = [];

function closeModal() {
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

closeBtn.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

(async function init() {
  activeKings = await loadKings();
  if (!activeKings.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">
      No Pirate Kings data found.<br>
      Run <code>npm run extract-lore</code> to generate <code>docs/data/pirate-kings-lore.json</code> from <code>LORE.md</code>, then reload this page.
    </div>`;
    return;
  }
  grid.innerHTML = activeKings.map(renderTile).join('');
  grid.querySelectorAll('.king-tile').forEach(tile => {
    tile.addEventListener('click', () => {
      const king = activeKings.find(k => k.id === tile.dataset.kingId);
      if (king) {
        content.innerHTML = renderModal(king);
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }
    });
  });
})();
</script>

</body>
</html>
