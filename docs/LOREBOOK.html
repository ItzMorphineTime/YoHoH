ge":"Images/PirateKings/Flameheart_01.png","theme":"Fire • Dragons • Conquest","alignment":"Chaotic Evil","status":"","mythicRole":"The Modern Repetition of the First Sin • The False Dragon King","dragonStance":"hunts","backstory":"Ebon was once a subordinate pirate, hungry for more. During a raid on a volcanic isle, he stole a dragon egg and survived long enough to hatch it. That dragon—**Blackfang**—made him a legend.\n\nEbon believes strength is the only truth. He conquers islands not to rule them, but to burn them into submission, forging a fleet of fear and fire.\n\nHe is the living proof that the original sin of the Shattered Seas did not end with Cassian Barrow or the Pearl Synod. Men are still stealing dragon futures and calling it destiny.","dragons":"Ebon **hunts dragons** to eliminate all rivals. He has Blackfang—the only dragon that matters. Every other dragon is a threat: another captain could hatch an egg, another King could claim a beast, another free dragon could challenge his myth. He burns dragon nests, slaughters migrating dragons, and pays bounties for eggs delivered to him—so he can crush them himself.\n\nThere will be only one Dragon King.\n\n**Blackfang:** Ebon claims Blackfang is loyal. The truth is darker. Blackfang is bound by theft, trauma, rage, and domination magic. Ebon thinks he controls dragonfire, but he is sitting on a volcano he cannot command forever.","relationshipToPlayer":"","familiar":{"name":"Ember","type":"Fire Phoenix","image":"Images/Familiars/Ember.png","abilities":["Revives after death","Ignites ships and crews","Buffs allies with flame-based rage","Marks targets for Blackfang's fire"]},"domain":{"name":"The Ashen Reach","desc":"scorched islands and burning seas","effects":["Constant fire hazards","Volcanic events during combat","Refugee ports and burned markets","Dragon hunter bounties are common"]},"playerHooks":["Ultimate test of naval combat skill","Can trigger massive world events if unchecked","Offers huge rewards for dragon eggs, then destroys them","Slaying him may leave Blackfang unbound… and furious"]}],"archipelago":{"title":"The Archipelago & Your Place in It","body":"The **inner archipelago**—where you begin—is the last bastion of order. Ports here pay lip service to distant crowns, but in practice they answer to merchants, guilds, lighthouse keepers, and whoever keeps the peace. This is where new captains earn their stripes: trading goods, taking contracts, hiring crew, and building infamy.\n\nThe Home Waters should feel bright, readable, and adventurous at first. The deeper lore appears as fragments: old dragon symbols on cargo crates, tavern rumours about ghost lights, a lighthouse keeper who refuses to sail through fog, or a merchant who panics when the player finds an eggshell fragment.\n\nPossible Home Waters locations:\n- **Port Mercy** — starter port, market, shipwright, and basic contracts.\n- **Lantern Cay** — lighthouse island and rumour hub.\n- **Saltmarket** — trade hub with competing merchant guilds.\n- **The Old Rookery** — abandoned dragon nesting cliffs and possible first egg discovery.\n- **Greywake Shoals** — early wreck salvage site tied to Jasper's false treason.\n\nBeyond the safe routes, the map grows strange. **Route modifiers** reflect the influence of the Kings:\n\nThe Outer Seas are not only more dangerous. They are closer to the wound left by the Crown Below. Routes shift, compasses lie, old charts become unreliable, and the supernatural becomes harder to dismiss.\n\nEach King maintains **strongholds** in their domain. Defeating a **Lieutenant**—a trusted captain who serves a King—reveals the coordinates of that King's stronghold. Raiding a stronghold is the ultimate challenge: unique loot, legendary encounters, and—for those who dare—**rescued dragons** held in captivity.\n\nStrongholds should also reveal lore. Each one contains a different piece of the truth:\n- Jasper's domain reveals betrayal, oath, and lost Admiralty records.\n- Mordekai's domain reveals serpent myths and anti-dragon resentment.\n- Adara's domain reveals Atlantean murals, Crown Below fragments, and Pearl Synod doctrine.\n- Nimue's domain reveals abyssal songs and hints of what woke beneath the waves.\n- Ebon's domain reveals modern dragon theft and the danger of repeating the First Age's crime.\n\nHidden islands and secret coves serve as **dragon sanctuaries**—places where rescued eggs can hatch and young dragons can grow in peace. Finding, building, and protecting these sanctuaries is central to your mission. Some lie in the Home Waters; others require venturing into the outer seas.\n\nThe sanctuaries are supported by the **Tidewardens**, a secret network of lighthouse keepers, smugglers, healers, old navigators, ex-Admiralty officers, and dragon-sympathizers.\n\nTheir motto:\n\n> **\"No crown owns the sky. No king owns the sea.\"**\n\nThe Tidewardens are not a formal nation. They are a hidden rescue network. They move dragon eggs under false cargo manifests, mark safe routes with lighthouse codes, shelter hunted crews, and preserve fragments of the true history.\n\nThey are ideal quest-givers for:\n- dragon egg delivery contracts,\n- sanctuary supply runs,\n- rescue missions,\n- hidden route unlocks,\n- lore hunts,\n- reputation rewards.\n\nSome Tidewardens revere Jasper. Others fear him. All know that when the fog glows green-gold, someone nearby is being judged.","routeModifiers":["**Fog** — Veilwake Sea (Jasper's domain)","**Serpent marks** — Coiled Expanse (Mordekai)","**Coral ruins, tidal currents** — Drowned Crown (Adara)","**Darkness, abyssal waters** — Black Spiral (Nimue)","**Ash, volcanic vents** — Ashen Reach (Ebon)"]},"tone":{"title":"Tone & Narrative Beats","body":"**Tone:** Adventurous, slightly comedic, readable fantasy piracy—with darker undertones when the Kings are involved.\n\nThe world should feel like **fun pirate adventure on the surface, wounded myth underneath**.\n\nThe player should be able to enjoy tavern rumours, cargo runs, eccentric crew traits, ship upgrades, broadside combat, and boss fights without needing a lore lecture. But the farther they sail, the more they discover that the economy, monsters, dragons, and Pirate Kings are all symptoms of the same ancient wound.\n\nYou are a new captain climbing the ranks in the Home Waters. At first, your goals are practical: make profit, hire crew, upgrade your ship, and survive.\n\nThen you encounter something that should not exist.\n\nGhost lights in the fog.\n\nA dragon egg hidden in ordinary cargo.\n\nA chart marked with a symbol older than the Admiralty.\n\nA spectral captain who knows your cargo before you do.\n\nFrom there, your secret mission begins: **rescue and save the last of the dragons**. The Five Pirate Kings hunt them relentlessly; you defy them by finding eggs before hunters do, freeing captured dragons from strongholds, and ferrying them to sanctuaries where they can thrive.\n\nThe Shattered Seas offer profit, danger, and legend—but your true calling is to protect what the Kings would destroy.\n\nDefeat lieutenants, uncover stronghold locations, recover the truth of the Crown Below, and decide: will you serve a King, defy them, or carve your own path—and save the dragons before the world drowns again?","sections":[{"id":"your-story","title":"Your Story","markdown":"You are a new captain climbing the ranks in the Home Waters. At first, your goals are practical: make profit, hire crew, upgrade your ship, and survive.\n\nThen you encounter something that should not exist.\n\nGhost lights in the fog.\n\nA dragon egg hidden in ordinary cargo.\n\nA chart marked with a symbol older than the Admiralty.\n\nA spectral captain who knows your cargo before you do.\n\nFrom there, your secret mission begins: **rescue and save the last of the dragons**. The Five Pirate Kings hunt them relentlessly; you defy them by finding eggs before hunters do, freeing captured dragons from strongholds, and ferrying them to sanctuaries where they can thrive.\n\nThe Shattered Seas offer profit, danger, and legend—but your true calling is to protect what the Kings would destroy.\n\nDefeat lieutenants, uncover stronghold locations, recover the truth of the Crown Below, and decide: will you serve a King, defy them, or carve your own path—and save the dragons before the world drowns again?\n\n---","excerpt":"You are a new captain climbing the ranks in the Home Waters. At first, your goals are practical: make profit, hire crew, upgrade your ship, and survive.","bullets":[]}]},"reveal":{"title":"Player-Facing Lore Reveal Structure","body":"The truth of the Shattered Seas should unfold in layers rather than exposition dumps.\n\nThe player hears contradictory explanations for the Shattering in taverns, markets, ports, and crew chatter.\n\nExample lines:\n- \"My gran said the sea rose in one night. Took three kingdoms before breakfast.\"\n- \"Was dragons, I heard. Wings of fire from horizon to horizon.\"\n- \"Nah. Atlantis did it. Dug too deep, sang too loud.\"\n- \"Don't say Barrow's name in fog. He hears.\"\n\nThe player finds physical clues:\n- old Admiralty charts with dragon nest markings,\n- pirate ledgers listing \"warm pearls\" or \"sky eggs,\"\n- Atlantean coin in surface wrecks,\n- eggshell fragments inside ritual crates,\n- lighthouse records showing Jasper was framed,\n- a broken Barrow family seal on a pirate contract.\n\nJasper appears after key discoveries. He does not explain everything immediately. He reacts emotionally.\n\nAt first:\n> \"That mark. I watched men die beneath that seal.\"\n\nLater:\n> \"Those charts were never stolen. They were given.\"\n\nFinally:\n> \"My father sold the sky to the sea, and called it order.\"\n\nIn Adara's domain, the player finds Atlantean murals, ritual chambers, and living witnesses who tell a different version. Some are ashamed. Others are proud. This should complicate the truth: Atlantis was guilty, but not every Atlantean was evil.\n\nLate in the campaign, the player sees the ruined engine itself or a projection of it. Only then does the full myth become undeniable: the world was not broken by accident, and the same forces could break it again.","layers":[{"id":"layer-1-rumour","title":"Layer 1 — Rumour","markdown":"The player hears contradictory explanations for the Shattering in taverns, markets, ports, and crew chatter.\n\nExample lines:\n- \"My gran said the sea rose in one night. Took three kingdoms before breakfast.\"\n- \"Was dragons, I heard. Wings of fire from horizon to horizon.\"\n- \"Nah. Atlantis did it. Dug too deep, sang too loud.\"\n- \"Don't say Barrow's name in fog. He hears.\"","excerpt":"The player hears contradictory explanations for the Shattering in taverns, markets, ports, and crew chatter.","bullets":["\"My gran said the sea rose in one night. Took three kingdoms before breakfast.\"","\"Was dragons, I heard. Wings of fire from horizon to horizon.\"","\"Nah. Atlantis did it. Dug too deep, sang too loud.\"","\"Don't say Barrow's name in fog. He hears.\""]},{"id":"layer-2-evidence","title":"Layer 2 — Evidence","markdown":"The player finds physical clues:\n- old Admiralty charts with dragon nest markings,\n- pirate ledgers listing \"warm pearls\" or \"sky eggs,\"\n- Atlantean coin in surface wrecks,\n- eggshell fragments inside ritual crates,\n- lighthouse records showing Jasper was framed,\n- a broken Barrow family seal on a pirate contract.","excerpt":"The player finds physical clues: old Admiralty charts with dragon nest markings, pirate ledgers listing \"warm pearls\" or \"sky eggs,\" Atlantean coin in surface wrecks, eggshell fragments inside ritual crates, lighthouse records showing Jasper was framed, a broken Barrow family seal on a pirate contract.","bullets":["old Admiralty charts with dragon nest markings,","pirate ledgers listing \"warm pearls\" or \"sky eggs,\"","Atlantean coin in surface wrecks,","eggshell fragments inside ritual crates,","lighthouse records showing Jasper was framed,","a broken Barrow family seal on a pirate contract."]},{"id":"layer-3-jaspers-memory","title":"Layer 3 — Jasper's Memory","markdown":"Jasper appears after key discoveries. He does not explain everything immediately. He reacts emotionally.\n\nAt first:\n> \"That mark. I watched men die beneath that seal.\"\n\nLater:\n> \"Those charts were never stolen. They were given.\"\n\nFinally:\n> \"My father sold the sky to the sea, and called it order.\"","excerpt":"Jasper appears after key discoveries. He does not explain everything immediately. He reacts emotionally.","bullets":[]},{"id":"layer-4-atlantean-confirmation","title":"Layer 4 — Atlantean Confirmation","markdown":"In Adara's domain, the player finds Atlantean murals, ritual chambers, and living witnesses who tell a different version. Some are ashamed. Others are proud. This should complicate the truth: Atlantis was guilty, but not every Atlantean was evil.","excerpt":"In Adara's domain, the player finds Atlantean murals, ritual chambers, and living witnesses who tell a different version. Some are ashamed. Others are proud. This should complicate the truth: Atlantis was guilty, but not every Atlantean was evil.","bullets":[]},{"id":"layer-5-the-crown-below","title":"Layer 5 — The Crown Below","markdown":"Late in the campaign, the player sees the ruined engine itself or a projection of it. Only then does the full myth become undeniable: the world was not broken by accident, and the same forces could break it again.\n\n---","excerpt":"Late in the campaign, the player sees the ruined engine itself or a projection of it. Only then does the full myth become undeniable: the world was not broken by accident, and the same forces could break it again.","bullets":[]}]},"jasperQuestline":{"title":"Suggested Jasper Questline","quests":[{"id":"quest-1-ghost-lights-in-the-fog","title":"Quest 1: Ghost Lights in the Fog","markdown":"The player is saved by Jasper during an unfair pirate ambush.\n\n**Purpose:** Introduce magic, ghost ships, moral judgment, and Jasper as terrifying protector rather than simple villain.","excerpt":"The player is saved by Jasper during an unfair pirate ambush.","bullets":[],"number":1},{"id":"quest-2-the-traitors-bell","title":"Quest 2: The Traitor's Bell","markdown":"A port asks the player to recover a bell from a wreck believed to belong to Jasper's \"traitor ship.\" The bell is from **The Righteous Tide**. When returned, it rings by itself in fog.\n\n**Purpose:** Establish that Jasper's public reputation may be false.","excerpt":"A port asks the player to recover a bell from a wreck believed to belong to Jasper's \"traitor ship.\" The bell is from The Righteous Tide. When returned, it rings by itself in fog.","bullets":[],"number":2},{"id":"quest-3-charts-written-in-blood","title":"Quest 3: Charts Written in Blood","markdown":"The player finds an old Admiralty chart showing dragon nests. It bears Cassian Barrow's seal. Jasper becomes hostile at first, believing the player may be another egg-runner.\n\n**Purpose:** Reveal Cassian's betrayal and connect dragon hunts to the Admiralty.","excerpt":"The player finds an old Admiralty chart showing dragon nests. It bears Cassian Barrow's seal. Jasper becomes hostile at first, believing the player may be another egg-runner.","bullets":[],"number":3},{"id":"quest-4-the-last-clutch-of-emberfall","title":"Quest 4: The Last Clutch of Emberfall","markdown":"The player rescues their first dragon egg from pirates using one of Cassian's old charts. Jasper guides the player through fog to a hidden sanctuary route.\n\n**Purpose:** Make the player a true Sanctuary Runner.","excerpt":"The player rescues their first dragon egg from pirates using one of Cassian's old charts. Jasper guides the player through fog to a hidden sanctuary route.","bullets":[],"number":4},{"id":"quest-5-the-fathers-name","title":"Quest 5: The Father's Name","markdown":"The player uncovers evidence that Cassian Barrow framed Jasper.\n\nPossible objectives:\n- find Admiralty court records,\n- intercept a sealed naval archive,\n- recover a pirate confession,\n- explore a ruined Barrow estate.\n\n**Purpose:** Clear Jasper's name emotionally, even if the world never fully believes it.","excerpt":"The player uncovers evidence that Cassian Barrow framed Jasper.","bullets":["find Admiralty court records,","intercept a sealed naval archive,","recover a pirate confession,","explore a ruined Barrow estate."],"number":5},{"id":"quest-6-aurelions-dive","title":"Quest 6: Aurelion's Dive","markdown":"The player discovers the memory of the Elder Dragon who saved Jasper. This could happen through a dragon sanctuary, a dream sequence, or a golden scale that reacts to Jasper's Veilflame.\n\n**Purpose:** Reveal that Jasper was not cursed by evil magic; he was bound by a dragon oath.","excerpt":"The player discovers the memory of the Elder Dragon who saved Jasper. This could happen through a dragon sanctuary, a dream sequence, or a golden scale that reacts to Jasper's Veilflame.","bullets":[],"number":6},{"id":"quest-7-the-crown-below","title":"Quest 7: The Crown Below","markdown":"The player learns that the ritual still pulses beneath the world. Jasper asks the player not only to avenge the past, but to prevent its repetition.\n\n**Purpose:** Turn the campaign from \"rescue dragons\" into \"stop the Second Drowning.\"\n\n---","excerpt":"The player learns that the ritual still pulses beneath the world. Jasper asks the player not only to avenge the past, but to prevent its repetition.","bullets":[],"number":7}]},"domains":[{"domain":"Veilwake Sea","king":"Jasper Barrow","watersHazards":"Fog, ghost ships, blockades","dragonStance":"Protects","mythicFunction":"Oath, truth, justice"},{"domain":"Coiled Expanse","king":"Mordekai Drakon","watersHazards":"Serpents, slow waters, morale","dragonStance":"Hunts (rivalry)","mythicFunction":"Serpent dominion"},{"domain":"Drowned Crown","king":"Adara Thalassa","watersHazards":"Coral, ruins, leviathans","dragonStance":"Hunts (sovereignty)","mythicFunction":"Atlantean ambition"},{"domain":"Black Spiral","king":"Nimue Tideborn","watersHazards":"Darkness, Kraken, madness","dragonStance":"Hunts (feeds deep)","mythicFunction":"Abyssal hunger"},{"domain":"Ashen Reach","king":"Ebon Flameheart","watersHazards":"Fire, volcanoes, dragons","dragonStance":"Hunts (eliminates rivals)","mythicFunction":"Repeated dragon theft"}],"keyTerms":[{"term":"The First Age","meaning":"The golden era when humans, Atlanteans, and dragons maintained balance."},{"term":"The Three Crowns","meaning":"The sacred charges of Land, Sea, and Sky."},{"term":"The Pearl Synod","meaning":"Atlantean ruling faction that built the Crown Below."},{"term":"The Crown Below","meaning":"Atlantean ritual engine meant to bind land, sea, and sky under ocean rule."},{"term":"The Shattering / The Drowning","meaning":"The cataclysm caused by the failed Crown Below ritual."},{"term":"Cassian Barrow","meaning":"Jasper's father, Lord-Cartographer of the Admiralty, traitor to the First Age."},{"term":"Jasper Barrow","meaning":"Ghost Captain, betrayed son, guardian of the innocent, protector of dragons."},{"term":"Aurelion Veyr","meaning":"Elder Dragon known as the Last Dawn-Wing, who preserved Jasper's soul."},{"term":"Veilflame","meaning":"Ghostly dragonfire created where betrayal, oath, seawater, and justice meet."},{"term":"Tidewardens","meaning":"Secret network that rescues dragon eggs and maintains hidden sanctuaries."},{"term":"Dawnrest","meaning":"Possible oldest dragon sanctuary and rumoured resting place of Aurelion Veyr."},{"term":"Second Drowning","meaning":"The feared future catastrophe if the Crown Below is awakened or overfed again."}],"internalTruth":{"title":"Appendix: Internal Truth Summary","body":"This is the true version of the myth for writer/designer reference:\n\n> In the First Age, humans of the land, Atlanteans of the sea, and dragons of the sky kept the world in balance. The Atlanteans, resentful of their dependence on surface maps and dragon migration, built the Crown Below, a ritual engine meant to bind all realms under ocean rule.\n>\n> Because Atlanteans could not walk the land, they bribed Admiral Cassian Barrow, keeper of the Admiralty's forbidden dragon charts. Cassian gave those charts to pirate lords, who raided nests across the world and sold the eggs into the deep.\n>\n> Jasper Barrow discovered his father's betrayal and confronted him. Rather than repent, Cassian framed his son as the traitor and lured him into a storm, where pirate lords sank his ship.\n>\n> As Jasper drowned, an Elder Dragon named Aurelion Veyr sensed both the betrayal and the purity of Jasper's soul. Aurelion dived into the sea and preserved Jasper's spirit.\n>\n> When the Atlanteans performed the Crown Below ritual, the stolen dragon eggs shattered the balance of land, sea, and sky. Atlantis drowned, the continents broke, the dragons vanished, and the Shattered Seas were born.\n>\n> In the chaos, Aurelion bound Jasper's soul to the sea as a revenant guardian: a ghost captain sworn to protect the innocent, punish corruption, and guide the last dragons to sanctuary.\n>\n> The world remembers only rumours.\n>\n> Jasper remembers the truth."}};window.PIRATE_KINGS_LORE=window.LORE_DATA.pirateKings;</script>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="eyebrow">Complete Lorebook</div>
        <div class="title" id="book-title">The Shattered Seas</div>
      </div>
      <div class="top-actions">
        <a class="ghost-link" href="index.html">Back to Pitch Deck</a>
      </div>
    </header>

    <main class="book-shell">
      <div class="reader-toolbar" aria-label="Lorebook navigation">
        <button type="button" class="nav-btn" id="prev-page">‹ Previous</button>
        <div class="reader-center">
          <div class="page-status" id="page-status">Loading pages…</div>
          <select class="page-jump" id="page-jump" aria-label="Jump to page or chapter"></select>
        </div>
        <button type="button" class="nav-btn" id="next-page">Next ›</button>
      </div>
      <div class="book-frame">
        <section class="book-stage" id="book-stage" aria-live="polite">
          <div class="loading">Loading lorebook…</div>
        </section>
      </div>
    </main>
  </div>

  <script>
  (function () {
    'use strict';

    var state = {
      lore: null,
      pages: [],
      spread: 0,
      animating: false,
      timer: null,
      raf: null
    };

    var stage = document.getElementById('book-stage');
    var prevBtn = document.getElementById('prev-page');
    var nextBtn = document.getElementById('next-page');
    var jump = document.getElementById('page-jump');
    var status = document.getElementById('page-status');
    var titleEl = document.getElementById('book-title');

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function inlineMd(value) {
      var html = esc(value);
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      return html;
    }

    function slug(value) {
      return String(value || '').toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function stripHeading(markdown, level) {
      return String(markdown || '').replace(new RegExp('^#{' + level + '}\\s+.+\\n?', 'm'), '').trim();
    }

    function preludeMarkdown(markdown) {
      var body = String(markdown || '');
      var match = body.match(/^###\s+/m);
      return (match ? body.slice(0, match.index) : body).trim();
    }

    function mdToHtml(markdown) {
      var lines = String(markdown || '').replace(/\r\n?/g, '\n').split('\n');
      var out = [];
      var i = 0;

      function isTableLine(line) { return /^\s*\|.*\|\s*$/.test(line); }
      function isHr(line) { return /^\s*-{3,}\s*$/.test(line); }

      while (i < lines.length) {
        var line = lines[i];
        if (!line.trim() || isHr(line)) { i += 1; continue; }

        if (isTableLine(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?/.test(lines[i + 1])) {
          var tableLines = [];
          while (i < lines.length && isTableLine(lines[i])) { tableLines.push(lines[i]); i += 1; }
          var headers = tableLines[0].split('|').slice(1, -1).map(function (c) { return inlineMd(c.trim()); });
          var rows = tableLines.slice(2).map(function (row) { return row.split('|').slice(1, -1).map(function (c) { return inlineMd(c.trim()); }); });
          out.push('<table><thead><tr>' + headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.map(function (cells) { return '<tr>' + cells.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
          continue;
        }

        var h = line.match(/^(#{3,6})\s+(.+)$/);
        if (h) {
          var level = Math.min(5, Math.max(3, h[1].length));
          out.push('<h' + level + '>' + inlineMd(h[2].trim()) + '</h' + level + '>');
          i += 1;
          continue;
        }

        if (/^>\s?/.test(line)) {
          var quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            quote.push(lines[i].replace(/^>\s?/, ''));
            i += 1;
          }
          out.push('<blockquote>' + inlineMd(quote.join(' ')) + '</blockquote>');
          continue;
        }

        if (/^\s*[-*]\s+/.test(line)) {
          var items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*]\s+/, '').trim());
            i += 1;
          }
          out.push('<ul>' + items.map(function (item) { return '<li>' + inlineMd(item) + '</li>'; }).join('') + '</ul>');
          continue;
        }

        if (/^\s*\d+\.\s+/.test(line)) {
          var ordered = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            ordered.push(lines[i].replace(/^\s*\d+\.\s+/, '').trim());
            i += 1;
          }
          out.push('<ol>' + ordered.map(function (item) { return '<li>' + inlineMd(item) + '</li>'; }).join('') + '</ol>');
          continue;
        }

        var para = [line.trim()];
        i += 1;
        while (i < lines.length && lines[i].trim() && !/^(#{3,6})\s+/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && !isTableLine(lines[i]) && !isHr(lines[i])) {
          para.push(lines[i].trim());
          i += 1;
        }
        out.push('<p>' + inlineMd(para.join(' ')) + '</p>');
      }
      return out.join('');
    }

    function buildPages(lore) {
      var book = lore && lore.loreBook ? lore.loreBook : { chapters: [] };
      var chapters = Array.isArray(book.chapters) ? book.chapters : [];
      var pages = [];
      var chapterFirstPage = {};

      pages.push({
        type: 'cover',
        id: 'cover',
        title: book.title || 'The Shattered Seas Lorebook',
        subtitle: book.subtitle || 'A readable sourcebook generated from LORE.md',
        category: 'Complete Lorebook',
        markdown: ''
      });
      pages.push({
        type: 'toc',
        id: 'toc',
        title: 'Table of Contents',
        category: 'Contents',
        markdown: ''
      });

      chapters.forEach(function (chapter) {
        chapterFirstPage[chapter.id] = pages.length;
        var intro = preludeMarkdown(chapter.markdown || '');
        var hasSections = Array.isArray(chapter.sections) && chapter.sections.length;
        if (intro || !hasSections) {
          pages.push({
            type: 'chapter',
            id: chapter.id,
            chapterId: chapter.id,
            title: chapter.title,
            category: (chapter.category || 'Lore') + ' · Chapter ' + (chapter.order || ''),
            markdown: intro || chapter.markdown || '',
            chapterOrder: chapter.order || ''
          });
        }
        if (hasSections) {
          chapter.sections.forEach(function (section) {
            pages.push({
              type: 'section',
              id: chapter.id + '--' + section.id,
              chapterId: chapter.id,
              title: section.title,
              category: chapter.title,
              markdown: section.markdown || '',
              chapterOrder: chapter.order || ''
            });
          });
        }
      });

      pages.forEach(function (page, index) { page.pageIndex = index; });
      pages[1].toc = chapters.map(function (chapter) {
        return {
          id: chapter.id,
          order: chapter.order || '',
          title: chapter.title,
          category: chapter.category || 'Lore',
          pageIndex: chapterFirstPage[chapter.id] || 0
        };
      });
      return pages;
    }

    function renderCover(page) {
      var lore = state.lore || {};
      var tagline = lore.meta && lore.meta.tagline ? lore.meta.tagline : '';
      return '<div class="cover-mark">☼</div>' +
        '<h1 class="cover-title">' + inlineMd(page.title) + '</h1>' +
        '<p class="cover-subtitle">' + inlineMd(page.subtitle || '') + '</p>' +
        '<div class="cover-rule"></div>' +
        (tagline ? '<blockquote>' + inlineMd(tagline) + '</blockquote>' : '') +
        '<p>Turn the pages to read the myth, factions, dragons, Pirate Kings, and hidden truth of the Shattered Seas.</p>';
    }

    function renderToc(page) {
      var items = Array.isArray(page.toc) ? page.toc : [];
      return '<ol class="toc-list">' + items.map(function (item) {
        return '<li><button type="button" class="toc-button" data-goto-page="' + item.pageIndex + '">' +
          '<span class="toc-num">' + esc(item.order) + '</span>' +
          '<span class="toc-title">' + esc(item.title) + '</span>' +
          '<span class="toc-page">p. ' + Math.max(1, item.pageIndex + 1) + '</span>' +
          '</button></li>';
      }).join('') + '</ol>';
    }

    function blankPage(side) {
      return {
        type: 'blank',
        id: 'blank-' + side,
        title: 'Endpapers',
        category: 'The Shattered Seas',
        markdown: 'This page is intentionally left to the sea.'
      };
    }

    function renderBookPage(page, index, side) {
      page = page || blankPage(side);
      var pageClass = 'lorebook-page page-' + side + (page.type === 'cover' ? ' cover-page' : '') + (page.type === 'blank' ? ' blank-page' : '');
      var content = '';
      if (page.type === 'cover') content = renderCover(page);
      else if (page.type === 'toc') content = renderToc(page);
      else if (page.type === 'blank') content = '<p>' + inlineMd(page.markdown || '') + '</p>';
      else content = mdToHtml(page.markdown || '');

      return '<article class="' + pageClass + '" data-side="' + side + '" data-page-index="' + index + '">' +
        '<div>' +
          '<div class="page-kicker">' + esc(page.category || 'Lorebook') + '</div>' +
          '<h2 class="page-heading">' + inlineMd(page.title || 'Untitled Page') + '</h2>' +
        '</div>' +
        '<div class="page-content">' + content + '</div>' +
        '<footer class="page-footer"><span>' + esc(side === 'left' ? 'Verso' : 'Recto') + '</span><span>Page ' + Math.max(1, index + 1) + '</span></footer>' +
      '</article>';
    }

    function updateJumpOptions() {
      if (!jump) return;
      var selected = String(state.spread * 2);
      var options = state.pages.map(function (page, index) {
        var label = 'p. ' + (index + 1) + ' — ' + (page.title || 'Untitled');
        return '<option value="' + index + '"' + (String(index) === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
      });
      jump.innerHTML = options.join('');
    }

    function updateToolbar() {
      var maxSpread = Math.max(0, Math.ceil(state.pages.length / 2) - 1);
      var leftIndex = state.spread * 2;
      var rightIndex = leftIndex + 1;
      if (status) status.textContent = 'Pages ' + (leftIndex + 1) + '–' + Math.min(rightIndex + 1, state.pages.length) + ' of ' + state.pages.length;
      if (prevBtn) prevBtn.disabled = state.animating || state.spread <= 0;
      if (nextBtn) nextBtn.disabled = state.animating || state.spread >= maxSpread;
      if (jump) jump.disabled = state.animating;
      updateJumpOptions();
      document.body.classList.toggle('is-turning', state.animating);
    }

    function renderSpread() {
      if (!stage) return;
      var leftIndex = state.spread * 2;
      var rightIndex = leftIndex + 1;
      stage.innerHTML = '<div class="open-spread">' +
        renderBookPage(state.pages[leftIndex], leftIndex, 'left') +
        renderBookPage(state.pages[rightIndex], rightIndex, 'right') +
        '</div>';
      updateToolbar();
    }

    function replaceVisiblePage(spread, side, page, pageIndex) {
      if (!spread) return;
      var current = spread.querySelector(':scope > .lorebook-page[data-side="' + side + '"]');
      if (!current) return;
      var wrapper = document.createElement('div');
      wrapper.innerHTML = renderBookPage(page, pageIndex, side);
      current.replaceWith(wrapper.firstElementChild);
    }

    function finishTurn(targetSpread) {
      state.spread = targetSpread;
      state.animating = false;
      if (state.timer) clearTimeout(state.timer);
      state.timer = null;
      renderSpread();
    }

    function animateValue(duration, update, done) {
      var start = performance.now();
      function tick(now) {
        var t = Math.max(0, Math.min(1, (now - start) / duration));
        update(t);
        if (t >= 1) { done(); return; }
        state.raf = requestAnimationFrame(tick);
      }
      state.raf = requestAnimationFrame(tick);
    }

    function setSheetFrame(sheet, angle, t, phase, isNext) {
      if (!sheet) return;
      var lift = Math.sin(Math.PI * t);
      var x = (isNext ? -1 : 1) * 3.2 * lift;
      var z = 8 * lift;
      sheet.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,' + z.toFixed(2) + 'px) rotateY(' + angle.toFixed(3) + 'deg)';
      sheet.style.opacity = '1';
      var shadow = stage.querySelector('.turn-shadow');
      if (shadow) {
        var sweep = phase === 'out' ? t * 0.5 : 0.5 + t * 0.5;
        var shadowTravel = isNext ? (58 - 112 * sweep) : (-58 + 112 * sweep);
        var shadowOpacity = 0.28 * Math.sin(Math.PI * sweep);
        shadow.style.opacity = Math.max(0, shadowOpacity).toFixed(3);
        shadow.style.transform = 'translate3d(' + shadowTravel.toFixed(2) + '%,0,0)';
      }
    }

    function makeSheet(spread, side, page, pageIndex) {
      var sheet = document.createElement('div');
      sheet.className = 'flip-sheet ' + side;
      sheet.innerHTML = renderBookPage(page, pageIndex, side);
      spread.appendChild(sheet);
      return sheet;
    }

    function turnSpread(delta) {
      if (state.animating) return;
      var maxSpread = Math.max(0, Math.ceil(state.pages.length / 2) - 1);
      var targetSpread = Math.max(0, Math.min(state.spread + delta, maxSpread));
      if (targetSpread === state.spread) return;

      var spread = stage.querySelector('.open-spread');
      if (!spread) { state.spread = targetSpread; renderSpread(); return; }

      state.animating = true;
      updateToolbar();
      var isNext = delta > 0;
      var currentLeft = state.spread * 2;
      var currentRight = currentLeft + 1;
      var targetLeft = targetSpread * 2;
      var targetRight = targetLeft + 1;

      var outgoingSide = isNext ? 'right' : 'left';
      var incomingSide = isNext ? 'left' : 'right';
      var outgoingPageIndex = isNext ? currentRight : currentLeft;
      var incomingPageIndex = isNext ? targetLeft : targetRight;
      var revealSide = outgoingSide;
      var revealPageIndex = isNext ? targetRight : targetLeft;
      var outgoingPage = state.pages[outgoingPageIndex] || blankPage(outgoingSide);
      var incomingPage = state.pages[incomingPageIndex] || blankPage(incomingSide);
      var revealPage = state.pages[revealPageIndex] || blankPage(revealSide);

      var shadow = document.createElement('div');
      shadow.className = 'turn-shadow';
      spread.appendChild(shadow);

      var activeSheet = makeSheet(spread, outgoingSide, outgoingPage, outgoingPageIndex);
      // Update the page beneath the turning sheet immediately, so the flip reveals the destination page.
      replaceVisiblePage(spread, revealSide, revealPage, revealPageIndex);
      var OUT_DURATION = 520;
      var IN_DURATION = 520;
      var FADE_DURATION = 160;
      var finished = false;

      function cleanup() {
        var overlays = spread.querySelectorAll('.flip-sheet, .turn-shadow');
        overlays.forEach(function (el) { el.remove(); });
        finishTurn(targetSpread);
      }

      function fadeThenCleanup() {
        var overlays = spread.querySelectorAll('.flip-sheet, .turn-shadow');
        overlays.forEach(function (el) { el.classList.add('fading-out'); });
        setTimeout(cleanup, FADE_DURATION + 35);
      }

      function finish() {
        if (finished) return;
        finished = true;
        if (state.raf) cancelAnimationFrame(state.raf);
        replaceVisiblePage(spread, incomingSide, incomingPage, incomingPageIndex);
        requestAnimationFrame(fadeThenCleanup);
      }

      var outgoingEnd = isNext ? -89.7 : 89.7;
      setSheetFrame(activeSheet, 0, 0, 'out', isNext);
      animateValue(OUT_DURATION, function (t) {
        setSheetFrame(activeSheet, outgoingEnd * t, t, 'out', isNext);
      }, function () {
        if (activeSheet) activeSheet.remove();
        activeSheet = makeSheet(spread, incomingSide, incomingPage, incomingPageIndex);
        var incomingStart = isNext ? 89.7 : -89.7;
        setSheetFrame(activeSheet, incomingStart, 0, 'in', isNext);
        animateValue(IN_DURATION, function (t) {
          setSheetFrame(activeSheet, incomingStart * (1 - t), t, 'in', isNext);
        }, finish);
      });

      if (state.timer) clearTimeout(state.timer);
      state.timer = setTimeout(finish, OUT_DURATION + IN_DURATION + 800);
    }

    function gotoPage(index) {
      var target = Math.max(0, Math.min(Math.floor(index / 2), Math.ceil(state.pages.length / 2) - 1));
      if (target === state.spread) return;
      state.spread = target;
      renderSpread();
    }

    function initWithLore(lore) {
      state.lore = lore;
      state.pages = buildPages(lore);
      state.spread = 0;
      if (titleEl) titleEl.textContent = lore && lore.loreBook && lore.loreBook.title ? lore.loreBook.title : 'The Shattered Seas Lorebook';
      renderSpread();
    }

    function showError(message) {
      if (stage) stage.innerHTML = '<div class="error">' + esc(message) + '</div>';
      if (status) status.textContent = 'Lorebook unavailable';
    }

    if (prevBtn) prevBtn.addEventListener('click', function () { turnSpread(-1); });
    if (nextBtn) nextBtn.addEventListener('click', function () { turnSpread(1); });
    if (jump) jump.addEventListener('change', function () { gotoPage(Number(jump.value || 0)); });
    if (stage) stage.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-goto-page]');
      if (!btn) return;
      gotoPage(Number(btn.getAttribute('data-goto-page') || 0));
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowRight') turnSpread(1);
      if (event.key === 'ArrowLeft') turnSpread(-1);
    });

    if (window.LORE_DATA) {
      initWithLore(window.LORE_DATA);
    } else {
      fetch('data/lore.json')
        .then(function (res) {
          if (!res.ok) throw new Error('Could not load data/lore.json');
          return res.json();
        })
        .then(initWithLore)
        .catch(function (err) { showError(err.message || 'Could not load lore data. Run extract-lore.js to inject LORE.md data.'); });
    }
  }());
  </script>
</body>
