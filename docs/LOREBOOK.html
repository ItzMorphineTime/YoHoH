om \"rescue dragons\" into \"stop the Second Drowning.\"\n\n---","excerpt":"The player learns that the ritual still pulses beneath the world. Jasper asks the player not only to avenge the past, but to prevent its repetition.","bullets":[]}]},{"id":"suggested-historical-reveal-questline-the-ages-of-the-sea","order":23,"title":"Suggested Historical Reveal Questline: The Ages of the Sea","category":"Reveal","excerpt":"The player recovers a ruined ledger from a drowned tollhouse showing how Atlanteans taxed surface ports during the Age of the Drowned Crown.","markdown":"### Quest 1: The Pearl Tax Ledger\n\nThe player recovers a ruined ledger from a drowned tollhouse showing how Atlanteans taxed surface ports during the Age of the Drowned Crown.\n\n**Purpose:** Introduce the Second Age as a period of Atlantean dominance after the Shattering.\n\n### Quest 2: The Broken Tide Gate\n\nThe player explores a shattered Atlantean tide gate wrapped in fossilised serpent marks.\n\n**Purpose:** Reveal that serpents and krakens rebelled against Atlantean control.\n\n### Quest 3: The Unbinding Song\n\nThe player hears fragments of an abyssal song connected to Nimue's Kraken.\n\n**Purpose:** Connect the Unbinding Tide to Nimue and the Black Spiral.\n\n### Quest 4: Free Sail Lessons\n\nThe player finds one of Ebon's old instructional charts teaching captains how to avoid monster routes.\n\n**Purpose:** Present Ebon first as a legendary teacher and pirate hero.\n\n### Quest 5: Ash on the Rookery\n\nThe player discovers that the same techniques in Ebon's manuals were later used to raid dragon nests.\n\n**Purpose:** Reframe the Age of Free Sails as both prosperity and dragon-hunting industrialisation.\n\n### Quest 6: Blackfang's First Chain\n\nThe player discovers evidence that Blackfang was raised by Ebon from a hatchling, and that their bond was once genuine.\n\n**Purpose:** Add tragedy and complexity to Ebon's villainy.\n\n### Quest 7: The Ashen Turn\n\nThe player uncovers the moment Ebon began destroying dragon eggs to prevent anyone else from gaining dragonfire spirit.\n\n**Purpose:** Establish Ebon as the current age's great dragon-hoarding tyrant.\n\n---","sections":[{"id":"quest-1-the-pearl-tax-ledger","title":"Quest 1: The Pearl Tax Ledger","markdown":"The player recovers a ruined ledger from a drowned tollhouse showing how Atlanteans taxed surface ports during the Age of the Drowned Crown.\n\n**Purpose:** Introduce the Second Age as a period of Atlantean dominance after the Shattering.","excerpt":"The player recovers a ruined ledger from a drowned tollhouse showing how Atlanteans taxed surface ports during the Age of the Drowned Crown.","bullets":[]},{"id":"quest-2-the-broken-tide-gate","title":"Quest 2: The Broken Tide Gate","markdown":"The player explores a shattered Atlantean tide gate wrapped in fossilised serpent marks.\n\n**Purpose:** Reveal that serpents and krakens rebelled against Atlantean control.","excerpt":"The player explores a shattered Atlantean tide gate wrapped in fossilised serpent marks.","bullets":[]},{"id":"quest-3-the-unbinding-song","title":"Quest 3: The Unbinding Song","markdown":"The player hears fragments of an abyssal song connected to Nimue's Kraken.\n\n**Purpose:** Connect the Unbinding Tide to Nimue and the Black Spiral.","excerpt":"The player hears fragments of an abyssal song connected to Nimue's Kraken.","bullets":[]},{"id":"quest-4-free-sail-lessons","title":"Quest 4: Free Sail Lessons","markdown":"The player finds one of Ebon's old instructional charts teaching captains how to avoid monster routes.\n\n**Purpose:** Present Ebon first as a legendary teacher and pirate hero.","excerpt":"The player finds one of Ebon's old instructional charts teaching captains how to avoid monster routes.","bullets":[]},{"id":"quest-5-ash-on-the-rookery","title":"Quest 5: Ash on the Rookery","markdown":"The player discovers that the same techniques in Ebon's manuals were later used to raid dragon nests.\n\n**Purpose:** Reframe the Age of Free Sails as both prosperity and dragon-hunting industrialisation.","excerpt":"The player discovers that the same techniques in Ebon's manuals were later used to raid dragon nests.","bullets":[]},{"id":"quest-6-blackfangs-first-chain","title":"Quest 6: Blackfang's First Chain","markdown":"The player discovers evidence that Blackfang was raised by Ebon from a hatchling, and that their bond was once genuine.\n\n**Purpose:** Add tragedy and complexity to Ebon's villainy.","excerpt":"The player discovers evidence that Blackfang was raised by Ebon from a hatchling, and that their bond was once genuine.","bullets":[]},{"id":"quest-7-the-ashen-turn","title":"Quest 7: The Ashen Turn","markdown":"The player uncovers the moment Ebon began destroying dragon eggs to prevent anyone else from gaining dragonfire spirit.\n\n**Purpose:** Establish Ebon as the current age's great dragon-hoarding tyrant.\n\n---","excerpt":"The player uncovers the moment Ebon began destroying dragon eggs to prevent anyone else from gaining dragonfire spirit.","bullets":[]}]},{"id":"appendix-domain-map-conceptual","order":24,"title":"Appendix: Domain Map (Conceptual)","category":"Appendix","excerpt":"Domain King Waters / Hazards Dragon Stance Mythic Function -------- ------ ------------------ ---------------- ----------------- Veilwake Sea Jasper Barrow Fog, ghost ships, blockades Protects Oath, truth, justice Coiled Expanse Mordekai Drakon Serpents, slow waters, morale Hunts (rivalry) Serpent dominion, Atlantean trauma Drowned Crown Adara Thalassa Coral, ruins, leviathans Hunts (sovereignty) Atlantean ambition, Second Age restoration Black Spiral Nimue Tideborn Darkness, Kraken, madness Hunts (feeds deep) Abyssal hunger, Unbinding Tide legacy Ashen Reach Ebon Flameheart Fire, volcanoes, dragons Hunts (eliminates rivals) Free Sail glory, dragonfire hoarding ---","markdown":"| Domain | King | Waters / Hazards | Dragon Stance | Mythic Function |\n|--------|------|------------------|----------------|-----------------|\n| Veilwake Sea | Jasper Barrow | Fog, ghost ships, blockades | **Protects** | Oath, truth, justice |\n| Coiled Expanse | Mordekai Drakon | Serpents, slow waters, morale | Hunts (rivalry) | Serpent dominion, Atlantean trauma |\n| Drowned Crown | Adara Thalassa | Coral, ruins, leviathans | Hunts (sovereignty) | Atlantean ambition, Second Age restoration |\n| Black Spiral | Nimue Tideborn | Darkness, Kraken, madness | Hunts (feeds deep) | Abyssal hunger, Unbinding Tide legacy |\n| Ashen Reach | Ebon Flameheart | Fire, volcanoes, dragons | Hunts (eliminates rivals) | Free Sail glory, dragonfire hoarding |\n\n---","sections":[]},{"id":"appendix-historical-timeline","order":25,"title":"Appendix: Historical Timeline","category":"Appendix","excerpt":"Era Event Notes ----- ------- ------- First Age The Age of Three Crowns Humans steward land, Atlanteans steward sea, dragons steward sky. First Age The Atlantean Hunger The Pearl Synod begins designing the Crown Below. First Age Admiral Barrow's Betrayal Cassian sells dragon nest charts to pirate lords. First Age Jasper's False Treason Jasper discovers the conspiracy and is framed by his father. Cataclysm Aurelion's Dive Aurelion preserves Jasper's soul beneath the storm. Cataclysm The Crown Below Ritual Stolen dragon eggs are used to fuel the Atlantean ritual. Cataclysm The Shattering The world breaks; Atlantis sinks; dragon routes vanish. Aftermath Jasper's Binding Aurelion binds Jasper to the sea as a revenant guardian. Second Age The Age of the Drowned Crown Atlantis dominates the flooded world with tide gates, tribute routes, and leviathan roads. Second Age The Corruption of the Deep Serpents and krakens become stronger and disobedient. Collapse The Unbinding Tide Deep monsters rebel, destroying Atlantean infrastructure. Third Age The Age of Free Sails Humans, merchants, pirates, and free captains rise in the power vacuum. Third Age Ebon's Glory Ebon teaches captains to survive monsters, reopen routes, and hunt dragons. Third Age The Hatching of Blackfang Ebon raises Blackfang and gains dragonfire spirit. Third Age / Current The Ashen Turn Ebon begins destroying rival dragons and eggs. Current Age The Age of Five Crowns The Pirate Kings divide the seas; the player enters the world. Future Threat The Second Drowning If the Crown Below is awakened or overfed, the world may break again. ---","markdown":"| Era | Event | Notes |\n|-----|-------|-------|\n| First Age | The Age of Three Crowns | Humans steward land, Atlanteans steward sea, dragons steward sky. |\n| First Age | The Atlantean Hunger | The Pearl Synod begins designing the Crown Below. |\n| First Age | Admiral Barrow's Betrayal | Cassian sells dragon nest charts to pirate lords. |\n| First Age | Jasper's False Treason | Jasper discovers the conspiracy and is framed by his father. |\n| Cataclysm | Aurelion's Dive | Aurelion preserves Jasper's soul beneath the storm. |\n| Cataclysm | The Crown Below Ritual | Stolen dragon eggs are used to fuel the Atlantean ritual. |\n| Cataclysm | The Shattering | The world breaks; Atlantis sinks; dragon routes vanish. |\n| Aftermath | Jasper's Binding | Aurelion binds Jasper to the sea as a revenant guardian. |\n| Second Age | The Age of the Drowned Crown | Atlantis dominates the flooded world with tide gates, tribute routes, and leviathan roads. |\n| Second Age | The Corruption of the Deep | Serpents and krakens become stronger and disobedient. |\n| Collapse | The Unbinding Tide | Deep monsters rebel, destroying Atlantean infrastructure. |\n| Third Age | The Age of Free Sails | Humans, merchants, pirates, and free captains rise in the power vacuum. |\n| Third Age | Ebon's Glory | Ebon teaches captains to survive monsters, reopen routes, and hunt dragons. |\n| Third Age | The Hatching of Blackfang | Ebon raises Blackfang and gains dragonfire spirit. |\n| Third Age / Current | The Ashen Turn | Ebon begins destroying rival dragons and eggs. |\n| Current Age | The Age of Five Crowns | The Pirate Kings divide the seas; the player enters the world. |\n| Future Threat | The Second Drowning | If the Crown Below is awakened or overfed, the world may break again. |\n\n---","sections":[]},{"id":"appendix-key-terms","order":26,"title":"Appendix: Key Terms","category":"Appendix","excerpt":"Term Meaning ------ --------- The First Age The golden era when humans, Atlanteans, and dragons maintained balance. The Three Crowns The sacred charges of Land, Sea, and Sky. The Pearl Synod Atlantean ruling faction that built the Crown Below. The Crown Below Atlantean ritual engine meant to bind land, sea, and sky under ocean rule. The Shattering / The Drowning The cataclysm caused by the failed Crown Below ritual. Cassian Barrow Jasper's father, Lord-Cartographer of the Admiralty, traitor to the First Age. Jasper Barrow Ghost Captain, betrayed son, guardian of the innocent, protector of dragons. Aurelion Veyr Elder Dragon known as the Last Dawn-Wing, who preserved Jasper's soul. Veilflame Ghostly dragonfire created where betrayal, oath, seawater, and justice meet. The Age of the Drowned Crown The Second Age, when Atlantis dominated the fractured flooded world. The Corruption of the Deep The long consequence of the Crown Below that strengthened sea serpents and krakens. The Unbinding Tide The rebellion of sea serpents, krakens, leviathans, and deep beasts that ended the Second Age. The Age of Free Sails The Third Age, when pirates and merchants rose after Atlantean infrastructure collapsed. The Ashen Prosperity Tidewarden/dragon name for the Age of Free Sails, emphasising its cost to dragonkind. Blackfang Dragon raised by Ebon Flameheart; their bond gave Ebon dragonfire spirit. Dragonfire Spirit A rare bond-blessing that grants Ebon fire-touched resilience and near-immortality. The Ashen Turn Ebon's fall from pirate hero to dragon-hoarding tyrant. Tidewardens Secret network that rescues dragon eggs and maintains hidden sanctuaries. Dawnrest Possible oldest dragon sanctuary and rumoured resting place of Aurelion Veyr. Second Drowning The feared future catastrophe if the Crown Below is awakened or overfed again. ---","markdown":"| Term | Meaning |\n|------|---------|\n| **The First Age** | The golden era when humans, Atlanteans, and dragons maintained balance. |\n| **The Three Crowns** | The sacred charges of Land, Sea, and Sky. |\n| **The Pearl Synod** | Atlantean ruling faction that built the Crown Below. |\n| **The Crown Below** | Atlantean ritual engine meant to bind land, sea, and sky under ocean rule. |\n| **The Shattering / The Drowning** | The cataclysm caused by the failed Crown Below ritual. |\n| **Cassian Barrow** | Jasper's father, Lord-Cartographer of the Admiralty, traitor to the First Age. |\n| **Jasper Barrow** | Ghost Captain, betrayed son, guardian of the innocent, protector of dragons. |\n| **Aurelion Veyr** | Elder Dragon known as the Last Dawn-Wing, who preserved Jasper's soul. |\n| **Veilflame** | Ghostly dragonfire created where betrayal, oath, seawater, and justice meet. |\n| **The Age of the Drowned Crown** | The Second Age, when Atlantis dominated the fractured flooded world. |\n| **The Corruption of the Deep** | The long consequence of the Crown Below that strengthened sea serpents and krakens. |\n| **The Unbinding Tide** | The rebellion of sea serpents, krakens, leviathans, and deep beasts that ended the Second Age. |\n| **The Age of Free Sails** | The Third Age, when pirates and merchants rose after Atlantean infrastructure collapsed. |\n| **The Ashen Prosperity** | Tidewarden/dragon name for the Age of Free Sails, emphasising its cost to dragonkind. |\n| **Blackfang** | Dragon raised by Ebon Flameheart; their bond gave Ebon dragonfire spirit. |\n| **Dragonfire Spirit** | A rare bond-blessing that grants Ebon fire-touched resilience and near-immortality. |\n| **The Ashen Turn** | Ebon's fall from pirate hero to dragon-hoarding tyrant. |\n| **Tidewardens** | Secret network that rescues dragon eggs and maintains hidden sanctuaries. |\n| **Dawnrest** | Possible oldest dragon sanctuary and rumoured resting place of Aurelion Veyr. |\n| **Second Drowning** | The feared future catastrophe if the Crown Below is awakened or overfed again. |\n\n---","sections":[]},{"id":"appendix-faction-interpretations-of-history","order":27,"title":"Appendix: Faction Interpretations of History","category":"Appendix","excerpt":"Faction How They Describe the Ages --------- ----------------------------- Atlantean Loyalists The First Age was inefficient balance. The Drowned Crown was necessary order. The Unbinding Tide was monstrous rebellion. Free Ports Atlantis taxed survival. The Unbinding Tide was terrifying but created freedom. The Free Sails reopened the world. Pirates The Free Sails were the greatest age: gold, glory, routes, and no Atlantean masters. Tidewardens Every age after the First has been an attempt to profit from a wound. Dragon rescue is the only true repair. Dragon Sanctuaries Cassian began the theft. Atlantis broke the covenant. Ebon industrialised the slaughter. Mordekai's Followers The sea rewards only those strong enough to survive it. Serpents are the rightful heirs of the deep. Nimue's Cults The Unbinding Tide was not rebellion, but awakening. The deep was never meant to be ruled. Ebon's Loyalists Flameheart gave men glory, taught pirates to kill monsters, and earned Blackfang by strength. Jasper Barrow The world broke because power betrayed trust. Justice remains unpaid. ---","markdown":"| Faction | How They Describe the Ages |\n|---------|-----------------------------|\n| **Atlantean Loyalists** | The First Age was inefficient balance. The Drowned Crown was necessary order. The Unbinding Tide was monstrous rebellion. |\n| **Free Ports** | Atlantis taxed survival. The Unbinding Tide was terrifying but created freedom. The Free Sails reopened the world. |\n| **Pirates** | The Free Sails were the greatest age: gold, glory, routes, and no Atlantean masters. |\n| **Tidewardens** | Every age after the First has been an attempt to profit from a wound. Dragon rescue is the only true repair. |\n| **Dragon Sanctuaries** | Cassian began the theft. Atlantis broke the covenant. Ebon industrialised the slaughter. |\n| **Mordekai's Followers** | The sea rewards only those strong enough to survive it. Serpents are the rightful heirs of the deep. |\n| **Nimue's Cults** | The Unbinding Tide was not rebellion, but awakening. The deep was never meant to be ruled. |\n| **Ebon's Loyalists** | Flameheart gave men glory, taught pirates to kill monsters, and earned Blackfang by strength. |\n| **Jasper Barrow** | The world broke because power betrayed trust. Justice remains unpaid. |\n\n---","sections":[]},{"id":"appendix-future-story-hooks-todos","order":28,"title":"Appendix: Future Story Hooks / TODOs","category":"Appendix","excerpt":"Future update idea: introduce the player to core game systems through the legacy of Captain Ebon Flameheart.","markdown":"### TODO: Tutorial Questline — Ebon Flameheart as the First Teacher\n\nFuture update idea: introduce the player to core game systems through the legacy of Captain Ebon Flameheart.\n\nBefore he became the Dragon Marauder, Ebon was remembered as the great captain of the Age of Free Sails: the pirate who reopened trade routes, taught free captains to battle monsters, and gave glory back to men and pirates after the fall of Atlantean rule.\n\nThe tutorial questline should use Ebon's old teachings, charts, training contracts, or a historical prologue to teach:\n\n- basic sailing and turning radius,\n- docking and port services,\n- buying and selling cargo,\n- route danger and rumours,\n- broadside combat,\n- repairs and defeat recovery,\n- monster avoidance,\n- early dragon-hunting foreshadowing.\n\n**Narrative goal:**  \nThe player first knows Ebon as a heroic teacher and legendary pirate founder. Later, the story reveals that the same knowledge he gave to pirates helped industrialise dragon-hunting. His eventual bond with Blackfang gave him dragonfire spirit and near-immortality, after which he became obsessed with ensuring no other captain could ever gain the same power.\n\nThis creates a delayed twist: the player's first \"mentor\" is also one of the world's greatest villains.\n\n**Prototype-friendly approach:**  \nUse Ebon's old manuals, route annotations, training contracts, and quotes as tutorial wrappers rather than showing current Ebon directly.\n\nExample tutorial framing:\n\n- **Flameheart's First Rule:** Never sail empty.\n- **Flameheart's Broadside Drill:** Turn before you fire. A cannon without angle is just cargo.\n- **Flameheart's Ash-Wind Lesson:** The sea always warns you. Learn which warnings matter.\n- **Flameheart's Monster Mark:** If the water coils twice, you are already being hunted.\n\n**Future expansion approach:**  \nA playable historical prologue during the Age of Free Sails, where the player learns from a younger Ebon before his Ashen Turn.\n\n### TODO: Blackfang Consequence Arc\n\nIf Ebon is defeated, Blackfang should not simply become loot or disappear. He should become a major world consequence.\n\nPossible outcomes:\n\n- Blackfang becomes a roaming world boss.\n- Blackfang retreats to an old volcanic rookery.\n- Blackfang can be freed through a sanctuary questline.\n- Blackfang's grief triggers volcanic instability in the Ashen Reach.\n- Blackfang reveals memories of Ebon before the Ashen Turn.\n\n### TODO: The Second Drowning\n\nLate-game or expansion story hook: the Crown Below begins pulsing harder as dragon deaths, serpent curses, leviathan commands, and abyssal songs feed the wound.\n\nPossible climax:\n\n- Restore dragon sanctuaries to stabilise the world.\n- Destroy or seal the Crown Below.\n- Decide whether Adara's restored order, Jasper's justice, dragon freedom, or pirate liberty shapes the next age.\n\n---","sections":[{"id":"todo-tutorial-questline-ebon-flameheart-as-the-first-teacher","title":"TODO: Tutorial Questline — Ebon Flameheart as the First Teacher","markdown":"Future update idea: introduce the player to core game systems through the legacy of Captain Ebon Flameheart.\n\nBefore he became the Dragon Marauder, Ebon was remembered as the great captain of the Age of Free Sails: the pirate who reopened trade routes, taught free captains to battle monsters, and gave glory back to men and pirates after the fall of Atlantean rule.\n\nThe tutorial questline should use Ebon's old teachings, charts, training contracts, or a historical prologue to teach:\n\n- basic sailing and turning radius,\n- docking and port services,\n- buying and selling cargo,\n- route danger and rumours,\n- broadside combat,\n- repairs and defeat recovery,\n- monster avoidance,\n- early dragon-hunting foreshadowing.\n\n**Narrative goal:**  \nThe player first knows Ebon as a heroic teacher and legendary pirate founder. Later, the story reveals that the same knowledge he gave to pirates helped industrialise dragon-hunting. His eventual bond with Blackfang gave him dragonfire spirit and near-immortality, after which he became obsessed with ensuring no other captain could ever gain the same power.\n\nThis creates a delayed twist: the player's first \"mentor\" is also one of the world's greatest villains.\n\n**Prototype-friendly approach:**  \nUse Ebon's old manuals, route annotations, training contracts, and quotes as tutorial wrappers rather than showing current Ebon directly.\n\nExample tutorial framing:\n\n- **Flameheart's First Rule:** Never sail empty.\n- **Flameheart's Broadside Drill:** Turn before you fire. A cannon without angle is just cargo.\n- **Flameheart's Ash-Wind Lesson:** The sea always warns you. Learn which warnings matter.\n- **Flameheart's Monster Mark:** If the water coils twice, you are already being hunted.\n\n**Future expansion approach:**  \nA playable historical prologue during the Age of Free Sails, where the player learns from a younger Ebon before his Ashen Turn.","excerpt":"Future update idea: introduce the player to core game systems through the legacy of Captain Ebon Flameheart.","bullets":["basic sailing and turning radius,","docking and port services,","buying and selling cargo,","route danger and rumours,","broadside combat,","repairs and defeat recovery,","monster avoidance,","early dragon-hunting foreshadowing.","**Flameheart's First Rule:** Never sail empty.","**Flameheart's Broadside Drill:** Turn before you fire. A cannon without angle is just cargo.","**Flameheart's Ash-Wind Lesson:** The sea always warns you. Learn which warnings matter.","**Flameheart's Monster Mark:** If the water coils twice, you are already being hunted."]},{"id":"todo-blackfang-consequence-arc","title":"TODO: Blackfang Consequence Arc","markdown":"If Ebon is defeated, Blackfang should not simply become loot or disappear. He should become a major world consequence.\n\nPossible outcomes:\n\n- Blackfang becomes a roaming world boss.\n- Blackfang retreats to an old volcanic rookery.\n- Blackfang can be freed through a sanctuary questline.\n- Blackfang's grief triggers volcanic instability in the Ashen Reach.\n- Blackfang reveals memories of Ebon before the Ashen Turn.","excerpt":"If Ebon is defeated, Blackfang should not simply become loot or disappear. He should become a major world consequence.","bullets":["Blackfang becomes a roaming world boss.","Blackfang retreats to an old volcanic rookery.","Blackfang can be freed through a sanctuary questline.","Blackfang's grief triggers volcanic instability in the Ashen Reach.","Blackfang reveals memories of Ebon before the Ashen Turn."]},{"id":"todo-the-second-drowning","title":"TODO: The Second Drowning","markdown":"Late-game or expansion story hook: the Crown Below begins pulsing harder as dragon deaths, serpent curses, leviathan commands, and abyssal songs feed the wound.\n\nPossible climax:\n\n- Restore dragon sanctuaries to stabilise the world.\n- Destroy or seal the Crown Below.\n- Decide whether Adara's restored order, Jasper's justice, dragon freedom, or pirate liberty shapes the next age.\n\n---","excerpt":"Late-game or expansion story hook: the Crown Below begins pulsing harder as dragon deaths, serpent curses, leviathan commands, and abyssal songs feed the wound.","bullets":["Restore dragon sanctuaries to stabilise the world.","Destroy or seal the Crown Below.","Decide whether Adara's restored order, Jasper's justice, dragon freedom, or pirate liberty shapes the next age."]}]},{"id":"appendix-internal-truth-summary","order":29,"title":"Appendix: Internal Truth Summary","category":"Appendix","excerpt":"This is the true version of the myth for writer/designer reference:","markdown":"This is the true version of the myth for writer/designer reference:\n\n> In the First Age, humans of the land, Atlanteans of the sea, and dragons of the sky kept the world in balance. The Atlanteans, resentful of their dependence on surface maps and dragon migration, built the Crown Below, a ritual engine meant to bind all realms under ocean rule.\n>\n> Because Atlanteans could not walk the land, they bribed Admiral Cassian Barrow, keeper of the Admiralty's forbidden dragon charts. Cassian gave those charts to pirate lords, who raided nests across the world and sold the eggs into the deep.\n>\n> Jasper Barrow discovered his father's betrayal and confronted him. Rather than repent, Cassian framed his son as the traitor and lured him into a storm, where pirate lords sank his ship.\n>\n> As Jasper drowned, an Elder Dragon named Aurelion Veyr sensed both the betrayal and the purity of Jasper's soul. Aurelion dived into the sea and preserved Jasper's spirit.\n>\n> When the Atlanteans performed the Crown Below ritual, the stolen dragon eggs shattered the balance of land, sea, and sky. Atlantis drowned, the continents broke, the dragons vanished, and the Shattered Seas were born.\n>\n> In the chaos, Aurelion bound Jasper's soul to the sea as a revenant guardian: a ghost captain sworn to protect the innocent, punish corruption, and guide the last dragons to sanctuary.\n>\n> After the Shattering, Atlantis dominated the flooded world during the Age of the Drowned Crown, but the Crown Below's corruption strengthened sea serpents and krakens until the Unbinding Tide destroyed Atlantean infrastructure.\n>\n> In the power vacuum, the Age of Free Sails began. Ebon Flameheart brought glory to pirates and helped reopen trade, but he also taught the world how to hunt dragons. After raising Blackfang and gaining dragonfire spirit, he became nearly immortal and began destroying all other dragons to prevent any rival from gaining the same power.\n>\n> The current age is the Age of Five Crowns. The Pirate Kings divide the seas. The dragons are nearly extinct. The Crown Below still pulses.\n>\n> The world remembers only rumours.\n>\n> Jasper remembers the truth.","sections":[]}]},"dragons":{"title":"Dragons: The Last of the Great Beasts","body":"**Dragons** once ruled the skies and volcanic isles of the Shattered Seas—ancient, proud, and few. In the First Age, they were not merely powerful creatures. They were living anchors of the world.\n\nWhere dragons nested, the world held steady. Their eggs carried elemental memory. Their migrations shaped wind, tide, storm, and volcanic pressure. Their songs warned of imbalance. Their absence is one reason the seas remain broken.\n\nThe cataclysm scattered their nesting grounds, destroyed countless clutches, and drove the survivors to the edges of the world. The Age of Free Sails turned their persecution into an industry. Now they are **nearly extinct**, hunted to the brink by those who covet their power.\n\nDragons are not only rare beasts or powerful allies. They are part of the world's structure.\n\nEvery dragon killed makes the world less stable.\n\nEvery egg saved is a small repair to the broken covenant of land, sea, and sky.\n\nMost of the **Five Pirate Kings** hunt dragons relentlessly. They raid volcanic islands for eggs, ambush migrating dragons at sea, and pay bounties for any captain who delivers a dragon—dead or alive—to their strongholds. The few dragons that remain are scattered, hidden, or captured.\n\nYou are not like the Kings. Your calling is to **rescue and save** the last of the great beasts—to find dragon eggs before hunters do, to free captured dragons from King strongholds, and to ferry them to **sanctuaries** where they can hatch and thrive in peace.\n\nAt first, this mission may seem like mercy.\n\nOver time, the player learns it is also survival.\n\nThe dragons are not separate from the fate of the world. Saving them may be the only way to prevent a Second Drowning.\n\nThis puts you in **direct opposition** to most of the Pirate Kings. They will hunt you as fiercely as they hunt dragons—unless you outsmart them, outfight them, or find unlikely allies among those who do not share their obsession.\n\nHidden islands and secret coves serve as **dragon sanctuaries**—places where rescued eggs can hatch and young dragons can grow without fear. Building, protecting, and supplying these sanctuaries is a core part of your mission.\n\nThe oldest sanctuaries may be protected by the dreams of Aurelion Veyr. Others are maintained by the **Tidewardens**, a secret network of lighthouse keepers, navigators, smugglers, healers, ex-Admiralty officers, old dragon priests, and sympathetic captains who move eggs under false cargo manifests.\n\nSome say the Ghost Captain himself has been known to aid those who share this cause.\n\nThe few dragons that remain are scattered across the seas. Each breed carries distinct traits—and each is hunted by the Kings who covet their power.\n\n**Young dragons**—hatchlings rescued from eggs or freed from captivity—grow into these forms. Baby Blaze, Baby Icey, Baby Speedy, and Baby Elder are among those you might save and ferry to sanctuary. Each one you rescue is a blow against the Kings who would see them destroyed.","matters":["**Volcanic dragons** calm eruptions and regulate fire beneath the islands.","**Wind dragons** guide storms, trade winds, and migration paths.","**Frost dragons** steady northern currents and ice routes.","**Reef dragons** protect coral gates, island shelves, and hidden coves.","**Elder dragons** remember the covenants of the First Age."],"known":[{"name":"Blackfang","breed":"Fire • Dragonfire Spirit • Bonded Companion","whereFound":"Raised by Ebon Flameheart. The only dragon he allows to live. Their bond made Ebon nearly immortal."},{"name":"Blaze","breed":"Fire • Volcanic","whereFound":"Volcanic islands of the Ashen Reach. Eggs nest in lava vents."},{"name":"Icey","breed":"Frost • Northern","whereFound":"Frozen straits and iceberg caves. Rarely seen south of the ice line."},{"name":"Speedy","breed":"Wind • Swift","whereFound":"Coastal cliffs and storm-wracked isles. Fastest of the great beasts."},{"name":"Elder","breed":"Ancient • Wisdom","whereFound":"The oldest breed. Nest in ruins, hidden sanctuaries, and sunken temples. Nearly extinct."},{"name":"Aurelion Veyr","breed":"Elder • Dawn • Oath","whereFound":"The Last Dawn-Wing. Saviour of Jasper's soul. His fate is unknown."}]},"pirateKings":[{"id":"jasper","order":1,"name":"Jasper Barrow","title":"The Ghost Captain of the Righteous Tide","image":"Images/PirateKings/JasperBarrow.png","theme":"Curse • Justice • Ghosts • Vengeance","alignment":"Chaotic Good (Relentless, Unforgiving)","status":"Undead (Revenant / Reborn)","mythicRole":"The Witness • The First Drowned Oath • The Player's First Guide into Magic","dragonStance":"protects","backstory":"Once the youngest son of Admiral Cassian Barrow, Jasper was raised on honour, duty, and the belief that the Admiralty existed to protect the innocent. Though denied command for years by court politics and his father's shadow, he eventually earned his own ship, **The Righteous Tide**, and became known as a captain who protected small ports, civilian convoys, and weak crews rather than chasing conquest.\n\nHis downfall came when he uncovered his father's betrayal. Cassian Barrow, Lord-Cartographer of the Admiralty, had been selling sacred dragon nest charts to pirate lords on behalf of the Atlantean Pearl Synod. Those pirate lords raided dragon nests across the world and sold the eggs into the deep to fuel the Crown Below ritual.\n\nJasper confronted his father and threatened to expose the conspiracy. Cassian responded by framing him as the traitor. Jasper was lured into a storm by a false distress call and ambushed by pirate lords carrying Atlantean weapons and Barrow charts. His ship was sunk. His crew was slaughtered. His name was ruined.\n\nAs Jasper drowned, the Elder Dragon **Aurelion Veyr** sensed the depth of the betrayal and the purity of Jasper's soul. Aurelion dived into the storm sea and preserved Jasper's spirit. When the Crown Below ritual shattered the world, Aurelion bound Jasper's soul to the sea with dragonfire and oath-magic.\n\nDeath could not still his sense of justice.\n\nNow, Jasper hunts tyrants, pirate kings, corrupt rulers, and bullies—especially those who prey on weaker crews, islands, or dragons.\n\n**Public Reputation**  \nTo many sailors, Jasper is a curse in the fog. Merchants fear him because he sinks corrupt convoys. Pirates fear him because he appears when they prey on the weak. Admiralty officers hate him because he attacks ships carrying sealed orders from corrupt old bloodlines. Common sailors leave lanterns in fog to beg safe passage.\n\nDragon sanctuary keepers and Tidewardens call him **The Tidebound Saint**, though Jasper despises the title.","dragons":"Jasper does **not** hunt dragons. He sees them as fellow victims of tyranny—hunted, betrayed, driven to the brink by the same conspiracy that destroyed his crew and broke the world. He has been known to aid captains who rescue dragons, guide lost eggs to sanctuary, and punish those who sell dragonkind for profit.","relationshipToPlayer":"Jasper should be the player's first direct contact with the supernatural. At first, he appears as a terrifying rumour: a ghost captain who judges ships in fog. Then he becomes a rescuer, a test, a reluctant mentor, and eventually the emotional key to the true history of the Shattered Seas.\n\nJasper can punish corruption.\n\nThe player can heal what corruption broke.\n\nThat distinction should define their relationship.","familiar":{"name":"Gloomfeather","type":"Spectral Parrot","image":"Images/Familiars/Gloomfeather.png","abilities":["Debuffs enemies with fear, misfortune, and cursed luck","Scouts invisibly through fog and darkness","Mimics enemy voices to sow panic","Repeats fragments of Jasper's lost memories at key lore sites"]},"domain":{"name":"The Veilwake Sea","desc":"fog-choked waters where ghost ships drift silently","effects":["His ghost fleet can ignore blockades","Ports under his watch see reduced piracy… unless they're corrupt","Broken oaths, hidden crimes, and blood-stained cargo may draw his attention","Veilflame appears around wrecks connected to betrayal or dragon hunts"]},"playerHooks":["Appears to aid bullied or outmatched players mid-fight","May spare or reward honorable crews","Tests whether the player protects the weak or exploits them","Guides rescued dragon eggs through impossible fog routes","Can become a powerful ally… or a relentless enemy"],"historicalWound":"The betrayal that caused the Shattering"},{"id":"mordekai","order":2,"name":"Captain Mordekai Drakon","title":"The Sea Serpent King","image":"Images/PirateKings/Captain_Mordekai_Drakon.png","theme":"Curse • Serpents • Ancient Magic","alignment":"Lawful Evil","status":"Cursed / Long-Lived","mythicRole":"The Serpent Heir • The Wound of Atlantean Cruelty • The Rival Claimant to Draconic Power","dragonStance":"hunts","backstory":"Mordekai Drakon was not born a king. He was a frightened boy aboard his father's merchant ship during the violent decline after the Unbinding Tide.\n\nHis father was one of the few remaining merchant captains brave enough to sail between free human ports while Atlantean remnants, sea serpents, krakens, pirates, and storm routes tore the world apart. He carried goods, messages, refugees, and forbidden charts through waters that no sane navy would patrol.\n\nBefore one dangerous voyage, Mordekai's father gave him a strange heirloom: a **magic skull dagger** carved from black bone and old silver. He told Mordekai it was not a toy, not a treasure, but a last promise.\n\n> \"If the sea takes everything else, keep this close.\"\n\nThe Atlanteans ambushed them.\n\nWhether the ship carried contraband, rebel supplies, unpaid tribute, or simply refused to kneel is a matter of rumour. What matters is that Atlantean raiders burned the sails, shattered the hull, and killed Mordekai's father in front of him.\n\nMordekai survived by clinging to a floating barrel amid wreckage, bodies, cargo, and fire.\n\nThen the sea opened beneath him.\n\nA colossal sea serpent, one of the great unbound beasts empowered by the Crown Below's corruption, swallowed him whole.\n\nInside the serpent, in darkness and acid, Mordekai should have died. Instead, terrified and half-mad, he drew his father's skull dagger and stabbed until he found the serpent's heart.\n\nThe dagger pierced it.\n\nThe serpent died.\n\nMordekai did not.\n\nThe dagger, the serpent's heart, Mordekai's grief, and the corrupted magic of the deep fused together. The serpent's dying spirit, **Ssyrix**, bound itself to the boy who had killed it from within.\n\nMordekai emerged from the corpse changed.\n\nThe frightened child became something colder.\n\nThe sea had taken his father, his ship, his childhood, and his mercy. In return, it gave him power.\n\nNow Mordekai rules through fear and inevitability. He hates Atlanteans for what they did to his family, but he has become a tyrant in their image: convinced that safety comes only through domination.","dragons":"Mordekai **hunts dragons** relentlessly. Serpents and dragons are ancient rivals—both draconic, both claiming dominion over the world's primal forces. Ssyrix whispers that dragons stole the world's reverence while serpents were driven into the deep. Mordekai consumes dragon scales and bone to feed Ssyrix, strengthen his curse, and extend his own power.\n\nHis lieutenants raid volcanic islands, ambush migrating dragons at sea, and seek old nest charts from the age of Cassian Barrow.","relationshipToPlayer":"","familiar":{"name":"Ssyrix","type":"The Bound Serpent Spirit","image":"Images/Familiars/Ssyrix.png","abilities":["Wraps ships, immobilizing them","Inflicts stacking curses over time","Can briefly possess Mordekai to amplify power","Whispers ancient anti-dragon lore","Hungers for dragonbone and Atlantean relics alike"]},"domain":{"name":"The Coiled Expanse","desc":"waters marked by massive serpentine shapes beneath the waves","effects":["Ships move slower","Crew morale drains over time","Serpent wakes can redirect routes","Cursed offers appear after major victories","Atlantean wrecks and serpent shrines lie half-swallowed beneath the currents"]},"playerHooks":["Hunts players who grow too powerful too quickly","May offer cursed power in exchange for loyalty","Tempts the player to trade dragon eggs for ship upgrades or serpent boons","Can provide anti-Atlantean lore that is useful but poisoned by hatred","Slaying him risks releasing Ssyrix upon the world"],"historicalWound":"The human trauma of Atlantean domination and serpent corruption"},{"id":"adara","order":3,"name":"Lady Adara Thalassa","title":"Queen of the Leviathans","image":"Images/PirateKings/Lady_Adara_Thalassa.png","theme":"Atlantis • Leviathans • Ocean Sovereignty","alignment":"Neutral (Ruthlessly Pragmatic)","status":"Atlantean Heir / Living Sovereign","mythicRole":"The Heir of the Guilty Empire • The Temptation of Order • The Last Dream of the Drowned Crown","dragonStance":"hunts","backstory":"Adara was born to a sunken empire—one of the last true descendants of Atlantis. She grew up among coral ruins, drowned courts, broken tide-engines, and murals that told a polished version of the past: Atlantis as saviour, the surface as betrayer, dragons as proud beasts who refused necessary sacrifice, and the Age of the Drowned Crown as the world's lost golden order.\n\nWhere surface sailors see tribute, Adara sees protection.\n\nWhere free captains see tyranny, she sees law.\n\nWhere Tidewardens see the sin of the Crown Below, she sees a flawed ritual that could have worked if guided by stronger hands.\n\nWhen her people fell into factional ruin, Adara reclaimed their legacy by stealing the **Trident of the Tides**, an artifact granting command over leviathans.\n\nShe does not raid for gold. She conquers to rebuild a lost civilization beneath the sea. Islands that swear fealty are protected. Those that resist are erased.\n\nAdara does not think of herself as a pirate.\n\nShe considers the surface ports illegal squatters on Atlantean waters.\n\n**Second Age Doctrine**  \nAdara's dream is not merely to restore Atlantis as it was before the Shattering. She wants to restore the authority of the **Drowned Crown**: the tribute routes, current engines, leviathan roads, and sea-law that once made the Second Age possible.\n\nIn her mind, the Unbinding Tide did not prove that Atlantis was wrong to rule.\n\nIt proved Atlantis was not ruthless enough.","dragons":"Adara **hunts dragons** as obstacles to her ocean sovereignty. Dragons are ancient, powerful, and refuse to bow—they threaten her claim to rule the seas. She captures eggs for Atlantean rituals and slays adult dragons that encroach on her domain. She believes the Crown Below failed because it was corrupted, rushed, or betrayed—not because Atlantis was wrong to attempt it.\n\nDelivering a dragon egg to her stronghold earns rare favor—and damns the dragon.","relationshipToPlayer":"","familiar":{"name":"Pearl","type":"Juvenile Leviathan","image":"Images/Familiars/Pearl.png","abilities":["Shields allies with tidal barriers","Heals ships and structures","Grows stronger the longer Adara reigns","Can sense Atlantean relics and Crown Below fragments"]},"domain":{"name":"The Drowned Crown","desc":"a semi-submerged kingdom of coral and ruins","effects":["Can flood islands","Controls trade routes via sea beasts","Offers protection to ports that swear fealty","Houses murals, archives, and ritual chambers tied to the true history of the Crown Below","Contains broken infrastructure from the Age of the Drowned Crown"]},"playerHooks":["Can become a powerful political ally","Might task players with reclaiming Atlantean relics","Offers lawful safety at the cost of freedom","Presents the strongest argument that tyranny can look like order","Open war with her reshapes the map"],"historicalWound":"The failed empire of the Drowned Crown"},{"id":"nimue","order":4,"name":"Nimue Tideborn","title":"The Kraken Caller","image":"Images/PirateKings/Nimue_Tideborn.png","theme":"Darkness • Abyss • Madness","alignment":"Chaotic Neutral","status":"Kraken-Bonded / Time-Touched","mythicRole":"The Listener at the Wound • The Human Doorway into the Deep • Child of the Unbinding Tide","dragonStance":"hunts","backstory":"Nimue Tideborn was once a fisher's daughter obsessed with legends of the Unbinding Tide. While other children were warned not to sing near black water, Nimue memorised the forbidden verses. She collected broken shell tablets, abyssal stones, drowned bells, and scraps of Atlantean warnings about krakens that had broken free from old commands.\n\nOne day, she discovered an abyssal song etched into black stone.\n\nThe song was not Atlantean.\n\nIt was older, deeper, and hungry.\n\nWhen Nimue sang it, she did not summon death.\n\nShe summoned a young Kraken.\n\nInstead of fleeing, she bonded with it.\n\nUnlike the Atlanteans, Nimue did not command the creature through tide-song. She listened. She fed it. She answered it. She let its dreams into her sleep and its hunger into her heart.\n\nAs the Kraken grew, so did Nimue's power—and her distance from humanity. The creature became the strongest Kraken in the ocean and, by the current age, something ancient in all but origin. Some scholars believe their bond has warped time around them; others insist the Kraken carries the memory of older krakens destroyed during the Unbinding Tide.\n\nNimue no longer raids ports in any ordinary sense. She drags entire fleets into the dark to \"feed the deep.\"\n\nNimue's song may be older than Atlantis. Some scholars believe the failed Crown Below ritual woke something beneath the world, and that her Kraken is not merely a beast but a child, limb, or messenger of that deeper presence.\n\nNimue may not be conquering the sea.\n\nShe may be listening to it scream.","dragons":"Nimue **hunts dragons** to feed the Kraken. Dragons are powerful prey—their essence sustains the deep and empowers her bond with the abyss. She sends her servants to lure dragons into the Black Spiral, where the Kraken drags them under. A dragon egg is a rare delicacy; a full-grown dragon, a feast.","relationshipToPlayer":"","familiar":{"name":"Inkshadow","type":"Living Shadow Octopus","image":"Images/Familiars/Inkshadow.png","abilities":["Creates zones of magical darkness","Blinds and disorients enemies","Can merge with the Kraken to empower it","Carries fragments of abyssal song between wrecks"]},"domain":{"name":"The Black Spiral","desc":"waters that absorb light and sound","effects":["Visibility is severely reduced","Sanity-testing environment","Compass drift and false audio cues","Ancient lore can sometimes resolve encounters that combat cannot","Kraken signs appear before the creature itself: silence, missing stars, water that swallows lantern light"]},"playerHooks":["May ignore players entirely… until provoked","Can be reasoned with via ancient lore","May reveal hints about what woke beneath the Crown Below","Represents the freedom of the deep becoming horror rather than justice","Killing the Kraken may break her mind—or free her"],"historicalWound":"The freedom and horror of the Unbinding Tide"},{"id":"ebon","order":5,"name":"Captain Ebon Flameheart","title":"The Dragon Marauder","image":"Images/PirateKings/Flameheart_01.png","theme":"Fire • Dragons • Conquest","alignment":"Chaotic Evil","status":"Dragonfire-Blessed / Nearly Immortal","mythicRole":"The Glory of Men • The Ashen Turn • The False Dragon King","dragonStance":"hunts","backstory":"Ebon Flameheart was not always the nightmare whispered of in burned ports.\n\nIn the early Third Age, he was a legend of the Free Sails: a pirate captain, monster-hunter, route-breaker, teacher, and symbol of human defiance after the collapse of Atlantean rule. He broke serpent blockades, fought kraken-touched raiders, charted ash currents, opened dangerous trade lanes, and taught free captains how to survive in a world of monsters.\n\nPirates still sing that Ebon gave glory back to men.\n\nMerchants still admit that some routes exist because he opened them.\n\nEven his enemies cannot deny that he helped create the Age of Free Sails.\n\nBut Ebon's glory carried a hidden cost. He did not only teach captains how to fight monsters. He taught them how to hunt dragons.\n\nHe made dragon-hunting repeatable.\n\nProfitable.\n\nTeachable.\n\nHe turned the old sin of stolen eggs into an industry.\n\nDuring a raid on a volcanic rookery, Ebon found a surviving dragon egg among ash and broken shell. His crew expected him to sell it. Instead, he kept it. The hatchling that emerged was **Blackfang**.\n\nFor a time, Ebon and Blackfang were friends. Ebon raised him from a baby aboard his ship. Blackfang became companion, weapon, mascot, terror, and miracle. Their bond was not born from chains, but from shared fire, battle, hunger, and survival.\n\nThat bond blessed Ebon with **dragonfire spirit**. His wounds burned closed. His blood smoked. Flame could scar him but not easily kill him. His age slowed until sailors began whispering that Flameheart would never die.\n\nThen friendship became fear.\n\nEbon realised that if Blackfang had chosen him, another dragon might choose another captain. Another pirate might gain dragonfire spirit. Another crew might become legend. Another Dragon King might rise.\n\nSo he turned on the very possibility.\n\nNow Ebon burns dragon nests, slaughters migrating dragons, and pays bounties for eggs so he can destroy them himself. He does not want every dragon dead because he hates Blackfang.\n\nHe wants every other dragon dead because Blackfang made him powerful.\n\nThere will be only one Dragon King.","dragons":"Ebon **hunts dragons** to eliminate all rivals. He has Blackfang—the only dragon that matters to him. Every other dragon is a threat: another captain could hatch an egg, another King could claim a beast, another free dragon could challenge his myth.\n\nEbon's dragon hunts are not random cruelty. They are strategic extinction.\n\n**Blackfang:** Blackfang is more than a pet or weapon. He was once Ebon's chosen companion. Their bond is real, which makes Ebon's corruption more tragic and more dangerous. Blackfang may still love Ebon, fear him, resent him, or be unable to separate his own rage from Ebon's dragonfire spirit.\n\nIf Ebon falls, Blackfang may become unbound—not as a simple boss reward, but as a living consequence.","relationshipToPlayer":"","familiar":{"name":"Ember","type":"Fire Phoenix","image":"Images/Familiars/Ember.png","abilities":["Revives after death","Ignites ships and crews","Buffs allies with flame-based rage","Marks targets for Blackfang's fire"]},"domain":{"name":"The Ashen Reach","desc":"scorched islands and burning seas","effects":["Constant fire hazards","Volcanic events during combat","Refugee ports and burned markets","Dragon hunter bounties are common","Old Free Sail monuments now stand blackened beneath Ebon's banners"]},"playerHooks":["Ultimate test of naval combat skill","Can trigger massive world events if unchecked","Offers huge rewards for dragon eggs, then destroys them","His old teachings may appear in early tutorial content, creating a delayed villain reveal","Slaying him may leave Blackfang unbound… and furious"],"historicalWound":"The pirate prosperity that became dragon genocide"}],"archipelago":{"title":"The Archipelago & Your Place in It","body":"The **inner archipelago**—where you begin—is the last bastion of order. Ports here pay lip service to distant crowns, but in practice they answer to merchants, guilds, lighthouse keepers, and whoever keeps the peace. This is where new captains earn their stripes: trading goods, taking contracts, hiring crew, and building infamy.\n\nThe Home Waters should feel bright, readable, and adventurous at first. The deeper lore appears as fragments: old dragon symbols on cargo crates, tavern rumours about ghost lights, a lighthouse keeper who refuses to sail through fog, a faded quote from one of Ebon's old sailing manuals, or a merchant who panics when the player finds an eggshell fragment.\n\nPossible Home Waters locations:\n\nBeyond the safe routes, the map grows strange. **Route modifiers** reflect the influence of the Kings:\n\nThe Outer Seas are not only more dangerous. They are closer to the wound left by the Crown Below. Routes shift, compasses lie, old charts become unreliable, and the supernatural becomes harder to dismiss.\n\nEach King maintains **strongholds** in their domain. Defeating a **Lieutenant**—a trusted captain who serves a King—reveals the coordinates of that King's stronghold. Raiding a stronghold is the ultimate challenge: unique loot, legendary encounters, and—for those who dare—**rescued dragons** held in captivity.\n\nStrongholds should also reveal lore. Each one contains a different piece of the truth:\n\nHidden islands and secret coves serve as **dragon sanctuaries**—places where rescued eggs can hatch and young dragons can grow in peace. Finding, building, and protecting these sanctuaries is central to your mission. Some lie in the Home Waters; others require venturing into the outer seas.\n\nThe sanctuaries are supported by the **Tidewardens**, a secret network of lighthouse keepers, smugglers, healers, old navigators, ex-Admiralty officers, and dragon-sympathizers.\n\nTheir motto:\n\n> **\"No crown owns the sky. No king owns the sea.\"**\n\nThe Tidewardens are not a formal nation. They are a hidden rescue network. They move dragon eggs under false cargo manifests, mark safe routes with lighthouse codes, shelter hunted crews, and preserve fragments of the true history.\n\nThey are ideal quest-givers for:\n\nSome Tidewardens revere Jasper. Others fear him. All know that when the fog glows green-gold, someone nearby is being judged.","routeModifiers":["**Fog** — Veilwake Sea (Jasper's domain)","**Serpent marks** — Coiled Expanse (Mordekai)","**Coral ruins, tidal currents** — Drowned Crown (Adara)","**Darkness, abyssal waters** — Black Spiral (Nimue)","**Ash, volcanic vents** — Ashen Reach (Ebon)"]},"tone":{"title":"Tone & Narrative Beats","body":"**Tone:** Adventurous, slightly comedic, readable fantasy piracy—with darker undertones when the Kings are involved.\n\nThe world should feel like **fun pirate adventure on the surface, wounded myth underneath**.\n\nThe player should be able to enjoy tavern rumours, cargo runs, eccentric crew traits, ship upgrades, broadside combat, and boss fights without needing a lore lecture. But the farther they sail, the more they discover that the economy, monsters, dragons, and Pirate Kings are all symptoms of the same ancient wound.\n\nYou are a new captain climbing the ranks in the Home Waters. At first, your goals are practical: make profit, hire crew, upgrade your ship, and survive.\n\nThen you encounter something that should not exist.\n\nGhost lights in the fog.\n\nA dragon egg hidden in ordinary cargo.\n\nA chart marked with a symbol older than the Admiralty.\n\nA spectral captain who knows your cargo before you do.\n\nFrom there, your secret mission begins: **rescue and save the last of the dragons**. The Five Pirate Kings hunt them relentlessly; you defy them by finding eggs before hunters do, freeing captured dragons from strongholds, and ferrying them to sanctuaries where they can thrive.\n\nThe Shattered Seas offer profit, danger, and legend—but your true calling is to protect what the Kings would destroy.\n\nDefeat lieutenants, uncover stronghold locations, recover the truth of the Crown Below, and decide: will you serve a King, defy them, or carve your own path—and save the dragons before the world drowns again?","sections":[{"id":"your-story","title":"Your Story","markdown":"You are a new captain climbing the ranks in the Home Waters. At first, your goals are practical: make profit, hire crew, upgrade your ship, and survive.\n\nThen you encounter something that should not exist.\n\nGhost lights in the fog.\n\nA dragon egg hidden in ordinary cargo.\n\nA chart marked with a symbol older than the Admiralty.\n\nA spectral captain who knows your cargo before you do.\n\nFrom there, your secret mission begins: **rescue and save the last of the dragons**. The Five Pirate Kings hunt them relentlessly; you defy them by finding eggs before hunters do, freeing captured dragons from strongholds, and ferrying them to sanctuaries where they can thrive.\n\nThe Shattered Seas offer profit, danger, and legend—but your true calling is to protect what the Kings would destroy.\n\nDefeat lieutenants, uncover stronghold locations, recover the truth of the Crown Below, and decide: will you serve a King, defy them, or carve your own path—and save the dragons before the world drowns again?\n\n---","excerpt":"You are a new captain climbing the ranks in the Home Waters. At first, your goals are practical: make profit, hire crew, upgrade your ship, and survive.","bullets":[]}]},"reveal":{"title":"Player-Facing Lore Reveal Structure","body":"The truth of the Shattered Seas should unfold in layers rather than exposition dumps.\n\nThe player hears contradictory explanations for the Shattering, the Drowned Crown, the Unbinding Tide, the Free Sails, and the Pirate Kings in taverns, markets, ports, and crew chatter.\n\nExample lines:\n\nThe player finds physical clues:\n\nJasper appears after key discoveries. He does not explain everything immediately. He reacts emotionally.\n\nAt first:\n\n> \"That mark. I watched men die beneath that seal.\"\n\nLater:\n\n> \"Those charts were never stolen. They were given.\"\n\nFinally:\n\n> \"My father sold the sky to the sea, and called it order.\"\n\nOn Ebon:\n\n> \"Flameheart opened routes, aye. He paved them with wings.\"\n\nEach major faction tells a different part of the truth:\n\nLate in the campaign, the player sees the ruined engine itself or a projection of it. Only then does the full myth become undeniable: the world was not broken by accident, and the same forces could break it again.","layers":[{"id":"layer-1-rumour","title":"Layer 1 — Rumour","markdown":"The player hears contradictory explanations for the Shattering, the Drowned Crown, the Unbinding Tide, the Free Sails, and the Pirate Kings in taverns, markets, ports, and crew chatter.\n\nExample lines:\n\n- \"My gran said the sea rose in one night. Took three kingdoms before breakfast.\"\n- \"Was dragons, I heard. Wings of fire from horizon to horizon.\"\n- \"Nah. Atlantis did it. Dug too deep, sang too loud.\"\n- \"Don't say Barrow's name in fog. He hears.\"\n- \"Flameheart? Say what you like, but before him no merchant crossed the Ashen Reach alive.\"\n- \"The Unbinding Tide? That's when the sea bit through its leash.\"","excerpt":"The player hears contradictory explanations for the Shattering, the Drowned Crown, the Unbinding Tide, the Free Sails, and the Pirate Kings in taverns, markets, ports, and crew chatter.","bullets":["\"My gran said the sea rose in one night. Took three kingdoms before breakfast.\"","\"Was dragons, I heard. Wings of fire from horizon to horizon.\"","\"Nah. Atlantis did it. Dug too deep, sang too loud.\"","\"Don't say Barrow's name in fog. He hears.\"","\"Flameheart? Say what you like, but before him no merchant crossed the Ashen Reach alive.\"","\"The Unbinding Tide? That's when the sea bit through its leash.\""]},{"id":"layer-2-evidence","title":"Layer 2 — Evidence","markdown":"The player finds physical clues:\n\n- old Admiralty charts with dragon nest markings,\n- pirate ledgers listing \"warm pearls\" or \"sky eggs,\"\n- Atlantean coin in surface wrecks,\n- eggshell fragments inside ritual crates,\n- lighthouse records showing Jasper was framed,\n- a broken Barrow family seal on a pirate contract,\n- shattered tide-gate mechanisms from the Second Age,\n- serpent-scarred coral roads from the Unbinding Tide,\n- old Free Sail manuals credited to Ebon Flameheart,\n- dragonbone tools that prove Ebon's methods spread across pirate culture.","excerpt":"The player finds physical clues:","bullets":["old Admiralty charts with dragon nest markings,","pirate ledgers listing \"warm pearls\" or \"sky eggs,\"","Atlantean coin in surface wrecks,","eggshell fragments inside ritual crates,","lighthouse records showing Jasper was framed,","a broken Barrow family seal on a pirate contract,","shattered tide-gate mechanisms from the Second Age,","serpent-scarred coral roads from the Unbinding Tide,","old Free Sail manuals credited to Ebon Flameheart,","dragonbone tools that prove Ebon's methods spread across pirate culture."]},{"id":"layer-3-jaspers-memory","title":"Layer 3 — Jasper's Memory","markdown":"Jasper appears after key discoveries. He does not explain everything immediately. He reacts emotionally.\n\nAt first:\n\n> \"That mark. I watched men die beneath that seal.\"\n\nLater:\n\n> \"Those charts were never stolen. They were given.\"\n\nFinally:\n\n> \"My father sold the sky to the sea, and called it order.\"\n\nOn Ebon:\n\n> \"Flameheart opened routes, aye. He paved them with wings.\"","excerpt":"Jasper appears after key discoveries. He does not explain everything immediately. He reacts emotionally.","bullets":[]},{"id":"layer-4-faction-testimony","title":"Layer 4 — Faction Testimony","markdown":"Each major faction tells a different part of the truth:\n\n- **Adara's Atlanteans** reveal the grandeur and propaganda of the Drowned Crown.\n- **Mordekai's serpent cults** reveal Atlantean cruelty and the trauma of survival.\n- **Nimue's abyssal lore** reveals the Unbinding Tide from the perspective of the deep.\n- **Ebon's old manuals and burned ports** reveal the Age of Free Sails and its cost.\n- **The Tidewardens** reveal the dragon rescue network and the hidden continuity of the First Age.","excerpt":"Each major faction tells a different part of the truth:","bullets":["**Adara's Atlanteans** reveal the grandeur and propaganda of the Drowned Crown.","**Mordekai's serpent cults** reveal Atlantean cruelty and the trauma of survival.","**Nimue's abyssal lore** reveals the Unbinding Tide from the perspective of the deep.","**Ebon's old manuals and burned ports** reveal the Age of Free Sails and its cost.","**The Tidewardens** reveal the dragon rescue network and the hidden continuity of the First Age."]},{"id":"layer-5-the-crown-below","title":"Layer 5 — The Crown Below","markdown":"Late in the campaign, the player sees the ruined engine itself or a projection of it. Only then does the full myth become undeniable: the world was not broken by accident, and the same forces could break it again.\n\n---","excerpt":"Late in the campaign, the player sees the ruined engine itself or a projection of it. Only then does the full myth become undeniable: the world was not broken by accident, and the same forces could break it again.","bullets":[]}]},"jasperQuestline":{"title":"Suggested Jasper Questline","quests":[{"id":"quest-1-ghost-lights-in-the-fog","title":"Quest 1: Ghost Lights in the Fog","markdown":"The player is saved by Jasper during an unfair pirate ambush.\n\n**Purpose:** Introduce magic, ghost ships, moral judgment, and Jasper as terrifying protector rather than simple villain.","excerpt":"The player is saved by Jasper during an unfair pirate ambush.","bullets":[],"number":1},{"id":"quest-2-the-traitors-bell","title":"Quest 2: The Traitor's Bell","markdown":"A port asks the player to recover a bell from a wreck believed to belong to Jasper's \"traitor ship.\" The bell is from **The Righteous Tide**. When returned, it rings by itself in fog.\n\n**Purpose:** Establish that Jasper's public reputation may be false.","excerpt":"A port asks the player to recover a bell from a wreck believed to belong to Jasper's \"traitor ship.\" The bell is from The Righteous Tide. When returned, it rings by itself in fog.","bullets":[],"number":2},{"id":"quest-3-charts-written-in-blood","title":"Quest 3: Charts Written in Blood","markdown":"The player finds an old Admiralty chart showing dragon nests. It bears Cassian Barrow's seal. Jasper becomes hostile at first, believing the player may be another egg-runner.\n\n**Purpose:** Reveal Cassian's betrayal and connect dragon hunts to the Admiralty.","excerpt":"The player finds an old Admiralty chart showing dragon nests. It bears Cassian Barrow's seal. Jasper becomes hostile at first, believing the player may be another egg-runner.","bullets":[],"number":3},{"id":"quest-4-the-last-clutch-of-emberfall","title":"Quest 4: The Last Clutch of Emberfall","markdown":"The player rescues their first dragon egg from pirates using one of Cassian's old charts. Jasper guides the player through fog to a hidden sanctuary route.\n\n**Purpose:** Make the player a true Sanctuary Runner.","excerpt":"The player rescues their first dragon egg from pirates using one of Cassian's old charts. Jasper guides the player through fog to a hidden sanctuary route.","bullets":[],"number":4},{"id":"quest-5-the-fathers-name","title":"Quest 5: The Father's Name","markdown":"The player uncovers evidence that Cassian Barrow framed Jasper.\n\nPossible objectives:\n\n- find Admiralty court records,\n- intercept a sealed naval archive,\n- recover a pirate confession,\n- explore a ruined Barrow estate.\n\n**Purpose:** Clear Jasper's name emotionally, even if the world never fully believes it.","excerpt":"The player uncovers evidence that Cassian Barrow framed Jasper.","bullets":["find Admiralty court records,","intercept a sealed naval archive,","recover a pirate confession,","explore a ruined Barrow estate."],"number":5},{"id":"quest-6-aurelions-dive","title":"Quest 6: Aurelion's Dive","markdown":"The player discovers the memory of the Elder Dragon who saved Jasper. This could happen through a dragon sanctuary, a dream sequence, or a golden scale that reacts to Jasper's Veilflame.\n\n**Purpose:** Reveal that Jasper was not cursed by evil magic; he was bound by a dragon oath.","excerpt":"The player discovers the memory of the Elder Dragon who saved Jasper. This could happen through a dragon sanctuary, a dream sequence, or a golden scale that reacts to Jasper's Veilflame.","bullets":[],"number":6},{"id":"quest-7-the-crown-below","title":"Quest 7: The Crown Below","markdown":"The player learns that the ritual still pulses beneath the world. Jasper asks the player not only to avenge the past, but to prevent its repetition.\n\n**Purpose:** Turn the campaign from \"rescue dragons\" into \"stop the Second Drowning.\"\n\n---","excerpt":"The player learns that the ritual still pulses beneath the world. Jasper asks the player not only to avenge the past, but to prevent its repetition.","bullets":[],"number":7}]},"historicalQuestline":{"title":"Suggested Historical Reveal Questline: The Ages of the Sea","quests":[{"id":"quest-1-the-pearl-tax-ledger","title":"Quest 1: The Pearl Tax Ledger","markdown":"The player recovers a ruined ledger from a drowned tollhouse showing how Atlanteans taxed surface ports during the Age of the Drowned Crown.\n\n**Purpose:** Introduce the Second Age as a period of Atlantean dominance after the Shattering.","excerpt":"The player recovers a ruined ledger from a drowned tollhouse showing how Atlanteans taxed surface ports during the Age of the Drowned Crown.","bullets":[],"number":1},{"id":"quest-2-the-broken-tide-gate","title":"Quest 2: The Broken Tide Gate","markdown":"The player explores a shattered Atlantean tide gate wrapped in fossilised serpent marks.\n\n**Purpose:** Reveal that serpents and krakens rebelled against Atlantean control.","excerpt":"The player explores a shattered Atlantean tide gate wrapped in fossilised serpent marks.","bullets":[],"number":2},{"id":"quest-3-the-unbinding-song","title":"Quest 3: The Unbinding Song","markdown":"The player hears fragments of an abyssal song connected to Nimue's Kraken.\n\n**Purpose:** Connect the Unbinding Tide to Nimue and the Black Spiral.","excerpt":"The player hears fragments of an abyssal song connected to Nimue's Kraken.","bullets":[],"number":3},{"id":"quest-4-free-sail-lessons","title":"Quest 4: Free Sail Lessons","markdown":"The player finds one of Ebon's old instructional charts teaching captains how to avoid monster routes.\n\n**Purpose:** Present Ebon first as a legendary teacher and pirate hero.","excerpt":"The player finds one of Ebon's old instructional charts teaching captains how to avoid monster routes.","bullets":[],"number":4},{"id":"quest-5-ash-on-the-rookery","title":"Quest 5: Ash on the Rookery","markdown":"The player discovers that the same techniques in Ebon's manuals were later used to raid dragon nests.\n\n**Purpose:** Reframe the Age of Free Sails as both prosperity and dragon-hunting industrialisation.","excerpt":"The player discovers that the same techniques in Ebon's manuals were later used to raid dragon nests.","bullets":[],"number":5},{"id":"quest-6-blackfangs-first-chain","title":"Quest 6: Blackfang's First Chain","markdown":"The player discovers evidence that Blackfang was raised by Ebon from a hatchling, and that their bond was once genuine.\n\n**Purpose:** Add tragedy and complexity to Ebon's villainy.","excerpt":"The player discovers evidence that Blackfang was raised by Ebon from a hatchling, and that their bond was once genuine.","bullets":[],"number":6},{"id":"quest-7-the-ashen-turn","title":"Quest 7: The Ashen Turn","markdown":"The player uncovers the moment Ebon began destroying dragon eggs to prevent anyone else from gaining dragonfire spirit.\n\n**Purpose:** Establish Ebon as the current age's great dragon-hoarding tyrant.\n\n---","excerpt":"The player uncovers the moment Ebon began destroying dragon eggs to prevent anyone else from gaining dragonfire spirit.","bullets":[],"number":7}]},"historicalTimeline":[{"era":"First Age","event":"The Age of Three Crowns","notes":"Humans steward land, Atlanteans steward sea, dragons steward sky."},{"era":"First Age","event":"The Atlantean Hunger","notes":"The Pearl Synod begins designing the Crown Below."},{"era":"First Age","event":"Admiral Barrow's Betrayal","notes":"Cassian sells dragon nest charts to pirate lords."},{"era":"First Age","event":"Jasper's False Treason","notes":"Jasper discovers the conspiracy and is framed by his father."},{"era":"Cataclysm","event":"Aurelion's Dive","notes":"Aurelion preserves Jasper's soul beneath the storm."},{"era":"Cataclysm","event":"The Crown Below Ritual","notes":"Stolen dragon eggs are used to fuel the Atlantean ritual."},{"era":"Cataclysm","event":"The Shattering","notes":"The world breaks; Atlantis sinks; dragon routes vanish."},{"era":"Aftermath","event":"Jasper's Binding","notes":"Aurelion binds Jasper to the sea as a revenant guardian."},{"era":"Second Age","event":"The Age of the Drowned Crown","notes":"Atlantis dominates the flooded world with tide gates, tribute routes, and leviathan roads."},{"era":"Second Age","event":"The Corruption of the Deep","notes":"Serpents and krakens become stronger and disobedient."},{"era":"Collapse","event":"The Unbinding Tide","notes":"Deep monsters rebel, destroying Atlantean infrastructure."},{"era":"Third Age","event":"The Age of Free Sails","notes":"Humans, merchants, pirates, and free captains rise in the power vacuum."},{"era":"Third Age","event":"Ebon's Glory","notes":"Ebon teaches captains to survive monsters, reopen routes, and hunt dragons."},{"era":"Third Age","event":"The Hatching of Blackfang","notes":"Ebon raises Blackfang and gains dragonfire spirit."},{"era":"Third Age / Current","event":"The Ashen Turn","notes":"Ebon begins destroying rival dragons and eggs."},{"era":"Current Age","event":"The Age of Five Crowns","notes":"The Pirate Kings divide the seas; the player enters the world."},{"era":"Future Threat","event":"The Second Drowning","notes":"If the Crown Below is awakened or overfed, the world may break again."}],"factionInterpretations":[{"faction":"Atlantean Loyalists","description":"The First Age was inefficient balance. The Drowned Crown was necessary order. The Unbinding Tide was monstrous rebellion."},{"faction":"Free Ports","description":"Atlantis taxed survival. The Unbinding Tide was terrifying but created freedom. The Free Sails reopened the world."},{"faction":"Pirates","description":"The Free Sails were the greatest age: gold, glory, routes, and no Atlantean masters."},{"faction":"Tidewardens","description":"Every age after the First has been an attempt to profit from a wound. Dragon rescue is the only true repair."},{"faction":"Dragon Sanctuaries","description":"Cassian began the theft. Atlantis broke the covenant. Ebon industrialised the slaughter."},{"faction":"Mordekai's Followers","description":"The sea rewards only those strong enough to survive it. Serpents are the rightful heirs of the deep."},{"faction":"Nimue's Cults","description":"The Unbinding Tide was not rebellion, but awakening. The deep was never meant to be ruled."},{"faction":"Ebon's Loyalists","description":"Flameheart gave men glory, taught pirates to kill monsters, and earned Blackfang by strength."},{"faction":"Jasper Barrow","description":"The world broke because power betrayed trust. Justice remains unpaid."}],"futureHooks":{"title":"Appendix: Future Story Hooks / TODOs","sections":[{"id":"todo-tutorial-questline-ebon-flameheart-as-the-first-teacher","title":"TODO: Tutorial Questline — Ebon Flameheart as the First Teacher","markdown":"Future update idea: introduce the player to core game systems through the legacy of Captain Ebon Flameheart.\n\nBefore he became the Dragon Marauder, Ebon was remembered as the great captain of the Age of Free Sails: the pirate who reopened trade routes, taught free captains to battle monsters, and gave glory back to men and pirates after the fall of Atlantean rule.\n\nThe tutorial questline should use Ebon's old teachings, charts, training contracts, or a historical prologue to teach:\n\n- basic sailing and turning radius,\n- docking and port services,\n- buying and selling cargo,\n- route danger and rumours,\n- broadside combat,\n- repairs and defeat recovery,\n- monster avoidance,\n- early dragon-hunting foreshadowing.\n\n**Narrative goal:**  \nThe player first knows Ebon as a heroic teacher and legendary pirate founder. Later, the story reveals that the same knowledge he gave to pirates helped industrialise dragon-hunting. His eventual bond with Blackfang gave him dragonfire spirit and near-immortality, after which he became obsessed with ensuring no other captain could ever gain the same power.\n\nThis creates a delayed twist: the player's first \"mentor\" is also one of the world's greatest villains.\n\n**Prototype-friendly approach:**  \nUse Ebon's old manuals, route annotations, training contracts, and quotes as tutorial wrappers rather than showing current Ebon directly.\n\nExample tutorial framing:\n\n- **Flameheart's First Rule:** Never sail empty.\n- **Flameheart's Broadside Drill:** Turn before you fire. A cannon without angle is just cargo.\n- **Flameheart's Ash-Wind Lesson:** The sea always warns you. Learn which warnings matter.\n- **Flameheart's Monster Mark:** If the water coils twice, you are already being hunted.\n\n**Future expansion approach:**  \nA playable historical prologue during the Age of Free Sails, where the player learns from a younger Ebon before his Ashen Turn.","excerpt":"Future update idea: introduce the player to core game systems through the legacy of Captain Ebon Flameheart.","bullets":["basic sailing and turning radius,","docking and port services,","buying and selling cargo,","route danger and rumours,","broadside combat,","repairs and defeat recovery,","monster avoidance,","early dragon-hunting foreshadowing.","**Flameheart's First Rule:** Never sail empty.","**Flameheart's Broadside Drill:** Turn before you fire. A cannon without angle is just cargo.","**Flameheart's Ash-Wind Lesson:** The sea always warns you. Learn which warnings matter.","**Flameheart's Monster Mark:** If the water coils twice, you are already being hunted."]},{"id":"todo-blackfang-consequence-arc","title":"TODO: Blackfang Consequence Arc","markdown":"If Ebon is defeated, Blackfang should not simply become loot or disappear. He should become a major world consequence.\n\nPossible outcomes:\n\n- Blackfang becomes a roaming world boss.\n- Blackfang retreats to an old volcanic rookery.\n- Blackfang can be freed through a sanctuary questline.\n- Blackfang's grief triggers volcanic instability in the Ashen Reach.\n- Blackfang reveals memories of Ebon before the Ashen Turn.","excerpt":"If Ebon is defeated, Blackfang should not simply become loot or disappear. He should become a major world consequence.","bullets":["Blackfang becomes a roaming world boss.","Blackfang retreats to an old volcanic rookery.","Blackfang can be freed through a sanctuary questline.","Blackfang's grief triggers volcanic instability in the Ashen Reach.","Blackfang reveals memories of Ebon before the Ashen Turn."]},{"id":"todo-the-second-drowning","title":"TODO: The Second Drowning","markdown":"Late-game or expansion story hook: the Crown Below begins pulsing harder as dragon deaths, serpent curses, leviathan commands, and abyssal songs feed the wound.\n\nPossible climax:\n\n- Restore dragon sanctuaries to stabilise the world.\n- Destroy or seal the Crown Below.\n- Decide whether Adara's restored order, Jasper's justice, dragon freedom, or pirate liberty shapes the next age.\n\n---","excerpt":"Late-game or expansion story hook: the Crown Below begins pulsing harder as dragon deaths, serpent curses, leviathan commands, and abyssal songs feed the wound.","bullets":["Restore dragon sanctuaries to stabilise the world.","Destroy or seal the Crown Below.","Decide whether Adara's restored order, Jasper's justice, dragon freedom, or pirate liberty shapes the next age."]}]},"domains":[{"domain":"Veilwake Sea","king":"Jasper Barrow","watersHazards":"Fog, ghost ships, blockades","dragonStance":"Protects","mythicFunction":"Oath, truth, justice"},{"domain":"Coiled Expanse","king":"Mordekai Drakon","watersHazards":"Serpents, slow waters, morale","dragonStance":"Hunts (rivalry)","mythicFunction":"Serpent dominion, Atlantean trauma"},{"domain":"Drowned Crown","king":"Adara Thalassa","watersHazards":"Coral, ruins, leviathans","dragonStance":"Hunts (sovereignty)","mythicFunction":"Atlantean ambition, Second Age restoration"},{"domain":"Black Spiral","king":"Nimue Tideborn","watersHazards":"Darkness, Kraken, madness","dragonStance":"Hunts (feeds deep)","mythicFunction":"Abyssal hunger, Unbinding Tide legacy"},{"domain":"Ashen Reach","king":"Ebon Flameheart","watersHazards":"Fire, volcanoes, dragons","dragonStance":"Hunts (eliminates rivals)","mythicFunction":"Free Sail glory, dragonfire hoarding"}],"keyTerms":[{"term":"The First Age","meaning":"The golden era when humans, Atlanteans, and dragons maintained balance."},{"term":"The Three Crowns","meaning":"The sacred charges of Land, Sea, and Sky."},{"term":"The Pearl Synod","meaning":"Atlantean ruling faction that built the Crown Below."},{"term":"The Crown Below","meaning":"Atlantean ritual engine meant to bind land, sea, and sky under ocean rule."},{"term":"The Shattering / The Drowning","meaning":"The cataclysm caused by the failed Crown Below ritual."},{"term":"Cassian Barrow","meaning":"Jasper's father, Lord-Cartographer of the Admiralty, traitor to the First Age."},{"term":"Jasper Barrow","meaning":"Ghost Captain, betrayed son, guardian of the innocent, protector of dragons."},{"term":"Aurelion Veyr","meaning":"Elder Dragon known as the Last Dawn-Wing, who preserved Jasper's soul."},{"term":"Veilflame","meaning":"Ghostly dragonfire created where betrayal, oath, seawater, and justice meet."},{"term":"The Age of the Drowned Crown","meaning":"The Second Age, when Atlantis dominated the fractured flooded world."},{"term":"The Corruption of the Deep","meaning":"The long consequence of the Crown Below that strengthened sea serpents and krakens."},{"term":"The Unbinding Tide","meaning":"The rebellion of sea serpents, krakens, leviathans, and deep beasts that ended the Second Age."},{"term":"The Age of Free Sails","meaning":"The Third Age, when pirates and merchants rose after Atlantean infrastructure collapsed."},{"term":"The Ashen Prosperity","meaning":"Tidewarden/dragon name for the Age of Free Sails, emphasising its cost to dragonkind."},{"term":"Blackfang","meaning":"Dragon raised by Ebon Flameheart; their bond gave Ebon dragonfire spirit."},{"term":"Dragonfire Spirit","meaning":"A rare bond-blessing that grants Ebon fire-touched resilience and near-immortality."},{"term":"The Ashen Turn","meaning":"Ebon's fall from pirate hero to dragon-hoarding tyrant."},{"term":"Tidewardens","meaning":"Secret network that rescues dragon eggs and maintains hidden sanctuaries."},{"term":"Dawnrest","meaning":"Possible oldest dragon sanctuary and rumoured resting place of Aurelion Veyr."},{"term":"Second Drowning","meaning":"The feared future catastrophe if the Crown Below is awakened or overfed again."}],"internalTruth":{"title":"Appendix: Internal Tru
