th Summary","body":"This is the true version of the myth for writer/designer reference:\n\n> In the First Age, humans of the land, Atlanteans of the sea, and dragons of the sky kept the world in balance. The Atlanteans, resentful of their dependence on surface maps and dragon migration, built the Crown Below, a ritual engine meant to bind all realms under ocean rule.\n>\n> Because Atlanteans could not walk the land, they bribed Admiral Cassian Barrow, keeper of the Admiralty's forbidden dragon charts. Cassian gave those charts to pirate lords, who raided nests across the world and sold the eggs into the deep.\n>\n> Jasper Barrow discovered his father's betrayal and confronted him. Rather than repent, Cassian framed his son as the traitor and lured him into a storm, where pirate lords sank his ship.\n>\n> As Jasper drowned, an Elder Dragon named Aurelion Veyr sensed both the betrayal and the purity of Jasper's soul. Aurelion dived into the sea and preserved Jasper's spirit.\n>\n> When the Atlanteans performed the Crown Below ritual, the stolen dragon eggs shattered the balance of land, sea, and sky. Atlantis drowned, the continents broke, the dragons vanished, and the Shattered Seas were born.\n>\n> In the chaos, Aurelion bound Jasper's soul to the sea as a revenant guardian: a ghost captain sworn to protect the innocent, punish corruption, and guide the last dragons to sanctuary.\n>\n> After the Shattering, Atlantis dominated the flooded world during the Age of the Drowned Crown, but the Crown Below's corruption strengthened sea serpents and krakens until the Unbinding Tide destroyed Atlantean infrastructure.\n>\n> In the power vacuum, the Age of Free Sails began. Ebon Flameheart brought glory to pirates and helped reopen trade, but he also taught the world how to hunt dragons. After raising Blackfang and gaining dragonfire spirit, he became nearly immortal and began destroying all other dragons to prevent any rival from gaining the same power.\n>\n> The current age is the Age of Five Crowns. The Pirate Kings divide the seas. The dragons are nearly extinct. The Crown Below still pulses.\n>\n> The world remembers only rumours.\n>\n> Jasper remembers the truth."}};window.PIRATE_KINGS_LORE=window.LORE_DATA.pirateKings;</script>

  <script>
  (function () {
    'use strict';

    var state = {
      lore: null,
      pages: [],
      spread: 0,
      animating: false,
      timer: null,
      raf: null
    };

    var stage = document.getElementById('book-stage');
    var prevBtn = document.getElementById('prev-page');
    var nextBtn = document.getElementById('next-page');
    var jump = document.getElementById('page-jump');
    var status = document.getElementById('page-status');
    var titleEl = document.getElementById('book-title');

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function inlineMd(value) {
      var html = esc(value);
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      return html;
    }

    function slug(value) {
      return String(value || '').toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function stripHeading(markdown, level) {
      return String(markdown || '').replace(new RegExp('^#{' + level + '}\\s+.+\\n?', 'm'), '').trim();
    }

    function preludeMarkdown(markdown) {
      var body = String(markdown || '');
      var match = body.match(/^###\s+/m);
      return (match ? body.slice(0, match.index) : body).trim();
    }

    function mdToHtml(markdown) {
      var lines = String(markdown || '').replace(/\r\n?/g, '\n').split('\n');
      var out = [];
      var i = 0;

      function isTableLine(line) { return /^\s*\|.*\|\s*$/.test(line); }
      function isHr(line) { return /^\s*-{3,}\s*$/.test(line); }

      while (i < lines.length) {
        var line = lines[i];
        if (!line.trim() || isHr(line)) { i += 1; continue; }

        if (isTableLine(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?/.test(lines[i + 1])) {
          var tableLines = [];
          while (i < lines.length && isTableLine(lines[i])) { tableLines.push(lines[i]); i += 1; }
          var headers = tableLines[0].split('|').slice(1, -1).map(function (c) { return inlineMd(c.trim()); });
          var rows = tableLines.slice(2).map(function (row) { return row.split('|').slice(1, -1).map(function (c) { return inlineMd(c.trim()); }); });
          out.push('<table><thead><tr>' + headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.map(function (cells) { return '<tr>' + cells.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
          continue;
        }

        var h = line.match(/^(#{3,6})\s+(.+)$/);
        if (h) {
          var level = Math.min(5, Math.max(3, h[1].length));
          out.push('<h' + level + '>' + inlineMd(h[2].trim()) + '</h' + level + '>');
          i += 1;
          continue;
        }

        if (/^>\s?/.test(line)) {
          var quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            quote.push(lines[i].replace(/^>\s?/, ''));
            i += 1;
          }
          out.push('<blockquote>' + inlineMd(quote.join(' ')) + '</blockquote>');
          continue;
        }

        if (/^\s*[-*]\s+/.test(line)) {
          var items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*]\s+/, '').trim());
            i += 1;
          }
          out.push('<ul>' + items.map(function (item) { return '<li>' + inlineMd(item) + '</li>'; }).join('') + '</ul>');
          continue;
        }

        if (/^\s*\d+\.\s+/.test(line)) {
          var ordered = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            ordered.push(lines[i].replace(/^\s*\d+\.\s+/, '').trim());
            i += 1;
          }
          out.push('<ol>' + ordered.map(function (item) { return '<li>' + inlineMd(item) + '</li>'; }).join('') + '</ol>');
          continue;
        }

        var para = [line.trim()];
        i += 1;
        while (i < lines.length && lines[i].trim() && !/^(#{3,6})\s+/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && !isTableLine(lines[i]) && !isHr(lines[i])) {
          para.push(lines[i].trim());
          i += 1;
        }
        out.push('<p>' + inlineMd(para.join(' ')) + '</p>');
      }
      return out.join('');
    }

    function buildPages(lore) {
      var book = lore && lore.loreBook ? lore.loreBook : { chapters: [] };
      var chapters = Array.isArray(book.chapters) ? book.chapters : [];
      var pages = [];
      var chapterFirstPage = {};

      pages.push({
        type: 'cover',
        id: 'cover',
        title: book.title || 'The Shattered Seas Lorebook',
        subtitle: book.subtitle || 'A readable sourcebook generated from LORE.md',
        category: 'Complete Lorebook',
        markdown: ''
      });
      pages.push({
        type: 'toc',
        id: 'toc',
        title: 'Table of Contents',
        category: 'Contents',
        markdown: ''
      });

      chapters.forEach(function (chapter) {
        chapterFirstPage[chapter.id] = pages.length;
        var intro = preludeMarkdown(chapter.markdown || '');
        var hasSections = Array.isArray(chapter.sections) && chapter.sections.length;
        if (intro || !hasSections) {
          pages.push({
            type: 'chapter',
            id: chapter.id,
            chapterId: chapter.id,
            title: chapter.title,
            category: (chapter.category || 'Lore') + ' · Chapter ' + (chapter.order || ''),
            markdown: intro || chapter.markdown || '',
            chapterOrder: chapter.order || ''
          });
        }
        if (hasSections) {
          chapter.sections.forEach(function (section) {
            pages.push({
              type: 'section',
              id: chapter.id + '--' + section.id,
              chapterId: chapter.id,
              title: section.title,
              category: chapter.title,
              markdown: section.markdown || '',
              chapterOrder: chapter.order || ''
            });
          });
        }
      });

      pages.forEach(function (page, index) { page.pageIndex = index; });
      pages[1].toc = chapters.map(function (chapter) {
        return {
          id: chapter.id,
          order: chapter.order || '',
          title: chapter.title,
          category: chapter.category || 'Lore',
          pageIndex: chapterFirstPage[chapter.id] || 0
        };
      });
      return pages;
    }

    function renderCover(page) {
      var lore = state.lore || {};
      var tagline = lore.meta && lore.meta.tagline ? lore.meta.tagline : '';
      return '<div class="cover-mark">☼</div>' +
        '<h1 class="cover-title">' + inlineMd(page.title) + '</h1>' +
        '<p class="cover-subtitle">' + inlineMd(page.subtitle || '') + '</p>' +
        '<div class="cover-rule"></div>' +
        (tagline ? '<blockquote>' + inlineMd(tagline) + '</blockquote>' : '') +
        '<p>Turn the pages to read the myth, factions, dragons, Pirate Kings, and hidden truth of the Shattered Seas.</p>';
    }

    function renderToc(page) {
      var items = Array.isArray(page.toc) ? page.toc : [];
      return '<ol class="toc-list">' + items.map(function (item) {
        return '<li><button type="button" class="toc-button" data-goto-page="' + item.pageIndex + '">' +
          '<span class="toc-num">' + esc(item.order) + '</span>' +
          '<span class="toc-title">' + esc(item.title) + '</span>' +
          '<span class="toc-page">p. ' + Math.max(1, item.pageIndex + 1) + '</span>' +
          '</button></li>';
      }).join('') + '</ol>';
    }

    function blankPage(side) {
      return {
        type: 'blank',
        id: 'blank-' + side,
        title: 'Endpapers',
        category: 'The Shattered Seas',
        markdown: 'This page is intentionally left to the sea.'
      };
    }

    function renderBookPage(page, index, side) {
      page = page || blankPage(side);
      var pageClass = 'lorebook-page page-' + side + (page.type === 'cover' ? ' cover-page' : '') + (page.type === 'blank' ? ' blank-page' : '');
      var content = '';
      if (page.type === 'cover') content = renderCover(page);
      else if (page.type === 'toc') content = renderToc(page);
      else if (page.type === 'blank') content = '<p>' + inlineMd(page.markdown || '') + '</p>';
      else content = mdToHtml(page.markdown || '');

      return '<article class="' + pageClass + '" data-side="' + side + '" data-page-index="' + index + '">' +
        '<div>' +
          '<div class="page-kicker">' + esc(page.category || 'Lorebook') + '</div>' +
          '<h2 class="page-heading">' + inlineMd(page.title || 'Untitled Page') + '</h2>' +
        '</div>' +
        '<div class="page-content">' + content + '</div>' +
        '<footer class="page-footer"><span>' + esc(side === 'left' ? 'Verso' : 'Recto') + '</span><span>Page ' + Math.max(1, index + 1) + '</span></footer>' +
      '</article>';
    }

    function updateJumpOptions() {
      if (!jump) return;
      var selected = String(state.spread * 2);
      var options = state.pages.map(function (page, index) {
        var label = 'p. ' + (index + 1) + ' — ' + (page.title || 'Untitled');
        return '<option value="' + index + '"' + (String(index) === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
      });
      jump.innerHTML = options.join('');
    }

    function updateToolbar() {
      var maxSpread = Math.max(0, Math.ceil(state.pages.length / 2) - 1);
      var leftIndex = state.spread * 2;
      var rightIndex = leftIndex + 1;
      if (status) status.textContent = 'Pages ' + (leftIndex + 1) + '–' + Math.min(rightIndex + 1, state.pages.length) + ' of ' + state.pages.length;
      if (prevBtn) prevBtn.disabled = state.animating || state.spread <= 0;
      if (nextBtn) nextBtn.disabled = state.animating || state.spread >= maxSpread;
      if (jump) jump.disabled = state.animating;
      updateJumpOptions();
      document.body.classList.toggle('is-turning', state.animating);
    }

    function renderSpread() {
      if (!stage) return;
      var leftIndex = state.spread * 2;
      var rightIndex = leftIndex + 1;
      stage.innerHTML = '<div class="open-spread">' +
        renderBookPage(state.pages[leftIndex], leftIndex, 'left') +
        renderBookPage(state.pages[rightIndex], rightIndex, 'right') +
        '</div>';
      updateToolbar();
    }

    function replaceVisiblePage(spread, side, page, pageIndex) {
      if (!spread) return;
      var current = spread.querySelector(':scope > .lorebook-page[data-side="' + side + '"]');
      if (!current) return;
      var wrapper = document.createElement('div');
      wrapper.innerHTML = renderBookPage(page, pageIndex, side);
      current.replaceWith(wrapper.firstElementChild);
    }

    function finishTurn(targetSpread) {
      state.spread = targetSpread;
      state.animating = false;
      if (state.timer) clearTimeout(state.timer);
      state.timer = null;
      renderSpread();
    }

    function animateValue(duration, update, done) {
      var start = performance.now();
      function tick(now) {
        var t = Math.max(0, Math.min(1, (now - start) / duration));
        update(t);
        if (t >= 1) { done(); return; }
        state.raf = requestAnimationFrame(tick);
      }
      state.raf = requestAnimationFrame(tick);
    }

    function setSheetFrame(sheet, angle, t, phase, isNext) {
      if (!sheet) return;
      var lift = Math.sin(Math.PI * t);
      var x = (isNext ? -1 : 1) * 3.2 * lift;
      var z = 8 * lift;
      sheet.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,' + z.toFixed(2) + 'px) rotateY(' + angle.toFixed(3) + 'deg)';
      sheet.style.opacity = '1';
      var shadow = stage.querySelector('.turn-shadow');
      if (shadow) {
        var sweep = phase === 'out' ? t * 0.5 : 0.5 + t * 0.5;
        var shadowTravel = isNext ? (58 - 112 * sweep) : (-58 + 112 * sweep);
        var shadowOpacity = 0.28 * Math.sin(Math.PI * sweep);
        shadow.style.opacity = Math.max(0, shadowOpacity).toFixed(3);
        shadow.style.transform = 'translate3d(' + shadowTravel.toFixed(2) + '%,0,0)';
      }
    }

    function makeSheet(spread, side, page, pageIndex) {
      var sheet = document.createElement('div');
      sheet.className = 'flip-sheet ' + side;
      sheet.innerHTML = renderBookPage(page, pageIndex, side);
      spread.appendChild(sheet);
      return sheet;
    }

    function turnSpread(delta) {
      if (state.animating) return;
      var maxSpread = Math.max(0, Math.ceil(state.pages.length / 2) - 1);
      var targetSpread = Math.max(0, Math.min(state.spread + delta, maxSpread));
      if (targetSpread === state.spread) return;

      var spread = stage.querySelector('.open-spread');
      if (!spread) { state.spread = targetSpread; renderSpread(); return; }

      state.animating = true;
      updateToolbar();
      var isNext = delta > 0;
      var currentLeft = state.spread * 2;
      var currentRight = currentLeft + 1;
      var targetLeft = targetSpread * 2;
      var targetRight = targetLeft + 1;

      var outgoingSide = isNext ? 'right' : 'left';
      var incomingSide = isNext ? 'left' : 'right';
      var outgoingPageIndex = isNext ? currentRight : currentLeft;
      var incomingPageIndex = isNext ? targetLeft : targetRight;
      var revealSide = outgoingSide;
      var revealPageIndex = isNext ? targetRight : targetLeft;
      var outgoingPage = state.pages[outgoingPageIndex] || blankPage(outgoingSide);
      var incomingPage = state.pages[incomingPageIndex] || blankPage(incomingSide);
      var revealPage = state.pages[revealPageIndex] || blankPage(revealSide);

      var shadow = document.createElement('div');
      shadow.className = 'turn-shadow';
      spread.appendChild(shadow);

      var activeSheet = makeSheet(spread, outgoingSide, outgoingPage, outgoingPageIndex);
      // Update the page beneath the turning sheet immediately, so the flip reveals the destination page.
      replaceVisiblePage(spread, revealSide, revealPage, revealPageIndex);
      var OUT_DURATION = 520;
      var IN_DURATION = 520;
      var FADE_DURATION = 160;
      var finished = false;

      function cleanup() {
        var overlays = spread.querySelectorAll('.flip-sheet, .turn-shadow');
        overlays.forEach(function (el) { el.remove(); });
        finishTurn(targetSpread);
      }

      function fadeThenCleanup() {
        var overlays = spread.querySelectorAll('.flip-sheet, .turn-shadow');
        overlays.forEach(function (el) { el.classList.add('fading-out'); });
        setTimeout(cleanup, FADE_DURATION + 35);
      }

      function finish() {
        if (finished) return;
        finished = true;
        if (state.raf) cancelAnimationFrame(state.raf);
        replaceVisiblePage(spread, incomingSide, incomingPage, incomingPageIndex);
        requestAnimationFrame(fadeThenCleanup);
      }

      var outgoingEnd = isNext ? -89.7 : 89.7;
      setSheetFrame(activeSheet, 0, 0, 'out', isNext);
      animateValue(OUT_DURATION, function (t) {
        setSheetFrame(activeSheet, outgoingEnd * t, t, 'out', isNext);
      }, function () {
        if (activeSheet) activeSheet.remove();
        activeSheet = makeSheet(spread, incomingSide, incomingPage, incomingPageIndex);
        var incomingStart = isNext ? 89.7 : -89.7;
        setSheetFrame(activeSheet, incomingStart, 0, 'in', isNext);
        animateValue(IN_DURATION, function (t) {
          setSheetFrame(activeSheet, incomingStart * (1 - t), t, 'in', isNext);
        }, finish);
      });

      if (state.timer) clearTimeout(state.timer);
      state.timer = setTimeout(finish, OUT_DURATION + IN_DURATION + 800);
    }

    function gotoPage(index) {
      var target = Math.max(0, Math.min(Math.floor(index / 2), Math.ceil(state.pages.length / 2) - 1));
      if (target === state.spread) return;
      state.spread = target;
      renderSpread();
    }

    function initWithLore(lore) {
      state.lore = lore;
      state.pages = buildPages(lore);
      state.spread = 0;
      if (titleEl) titleEl.textContent = lore && lore.loreBook && lore.loreBook.title ? lore.loreBook.title : 'The Shattered Seas Lorebook';
      renderSpread();
    }

    function showError(message) {
      if (stage) stage.innerHTML = '<div class="error">' + esc(message) + '</div>';
      if (status) status.textContent = 'Lorebook unavailable';
    }

    if (prevBtn) prevBtn.addEventListener('click', function () { turnSpread(-1); });
    if (nextBtn) nextBtn.addEventListener('click', function () { turnSpread(1); });
    if (jump) jump.addEventListener('change', function () { gotoPage(Number(jump.value || 0)); });
    if (stage) stage.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-goto-page]');
      if (!btn) return;
      gotoPage(Number(btn.getAttribute('data-goto-page') || 0));
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowRight') turnSpread(1);
      if (event.key === 'ArrowLeft') turnSpread(-1);
    });

    if (window.LORE_DATA) {
      initWithLore(window.LORE_DATA);
    } else {
      fetch('data/lore.json')
        .then(function (res) {
          if (!res.ok) throw new Error('Could not load data/lore.json');
          return res.json();
        })
        .then(initWithLore)
        .catch(function (err) { showError(err.message || 'Could not load lore data. Run extract-lore.js to inject LORE.md data.'); });
    }
  }());
  </script>
</body>
</html>
