      bottom: 0;

      z-index: 8;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      will-change: transform, opacity;
      pointer-events: none;
      contain: layout paint style;

    .flip-sheet.left { left: 0; transform-origin: right center; }

  <script>window.LORE_DATA={"meta":{"title":"The Shattered Seas — World Lore & Backstory","tagline":"The old empires drowned. The seas broke. Five crowns rose from the wreckage—and none of them bow to any king on land.","source":"LORE.md","generatedAt":"2026-05-17T07:32:08.097Z"},"world":{"title":"The Shattered Seas","body":"The **Shattered Seas** are what remains of a once-balanced world. To most sailors, the truth of its ruin is lost beneath rumour, superstition, and salt.\n\nCenturies ago, a cataclysm—some say a war between gods, others a volcanic chain reaction, still others whisper of something that *woke* beneath the waves—shattered the continental shelves and drowned the great coastal empires. What survived was an archipelago of scattered islands, treacherous straits, haunted routes, and waters that no longer obey the old charts.\n\nToday, the seas are ruled by **trade, rumor, and fear**. The inner archipelago—the **Home Waters**—remains relatively safe: established ports, merchant guilds, lighthouse keepers, and the last vestiges of naval authority. But beyond the safe routes lie the **Outer Seas**, where the **Five Pirate Kings** hold dominion. Each King commands a domain shaped by their curse, their ambition, or their obsession. Sailors who venture too far may never return—or return changed.\n\nThe world remembers the cataclysm only in broken stories. The player enters the Shattered Seas hearing conflicting rumours:\n\nAll of these stories contain a shard of truth.\n\nNone of them are the whole truth.","rumours":["That the gods fought and cracked the world.","That a chain of volcanoes erupted and swallowed the continents.","That dragons burned the skies and fled.","That Atlantis tried to save the world and was betrayed.","That pirates dug too greedily into forbidden places.","That something ancient woke beneath the waves.","That the ghost captain Jasper Barrow caused it all."]},"storyLore":{"title":"The Sundering of the Three Crowns","subtitle":"The hidden truth beneath every rumour in the Shattered Seas","sections":[{"id":"story-lore-the-sundering-of-the-three-crowns","title":"Story / Lore: The Sundering of the Three Crowns","summary":"Before the Shattered Seas, there was a golden age remembered only in fragments: The First Age of the Three Crowns.","markdown":"Before the Shattered Seas, there was a golden age remembered only in fragments: **The First Age of the Three Crowns**.\n\nThe \"crowns\" were not merely royal titles. They were sacred charges: three realms, three peoples, and three duties that kept the world whole.\n\n### The Crown of Land\n\nThe humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.\n\nTheir charge was **stewardship of the land**.\n\nThey built the lighthouse chains, maintained the ports, grew the food, forged the cannons, and charted the safe roads between mountain, jungle, desert, and coast. Their admiralties guarded trade routes and kept sacred charts that marked not only reefs and storms, but the hidden places where dragons nested.\n\n### The Crown of Sea\n\nThe Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, and tide-forges.\n\nTheir charge was **stewardship of the sea**.\n\nAtlanteans could not live long upon dry land. Their skin dried, their lungs burned, and their magic weakened away from saltwater. For this reason, they relied on treaties, surface envoys, and human navigators to understand the continents above. They knew the deep better than any surface kingdom, but the mountains, volcanoes, high cliffs, and inland dragon rookeries were beyond their reach.\n\n### The Crown of Sky\n\nThe dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.\n\nTheir charge was **stewardship of the sky**.\n\nThe dragons did not own the world. They anchored it.\n\nWhere dragons nested, the world was stable. Volcanoes slept. Storms followed seasons. Oceans respected their shores. Magic flowed in cycles rather than floods. Each clutch was more than a generation of dragons; it was a promise between land, sea, and sky.\n\n### The First Age\n\nIn the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.\n\nHumans traded surface goods to Atlantis: timber, iron, fruit, spices, cloth, stories, and maps. Atlanteans traded sea-gifts to humans: pearls, medicines, current-charts, coral glass, tide charms, and leviathan-safe passages. Dragons rarely traded, but they gave warnings. A dragon circling a harbour might mean storm. A dragon vanishing from a mountain might mean eruption. A clutch abandoned before hatching was considered a prophecy of disaster.\n\nThis age was prosperous because no one power could rule all three realms.\n\nHumans could not command the deep.\n\nAtlanteans could not walk the land.\n\nDragons would not kneel to either.\n\nThat limitation was the source of peace.\n\nThen Atlantis grew ashamed of needing others.\n\n---","body":"Before the Shattered Seas, there was a golden age remembered only in fragments: **The First Age of the Three Crowns**.\n\nThe \"crowns\" were not merely royal titles. They were sacred charges: three realms, three peoples, and three duties that kept the world whole.\n\n### The Crown of Land\n\nThe humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.\n\nTheir charge was **stewardship of the land**.\n\nThey built the lighthouse chains, maintained the ports, grew the food, forged the cannons, and charted the safe roads between mountain, jungle, desert, and coast. Their admiralties guarded trade routes and kept sacred charts that marked not only reefs and storms, but the hidden places where dragons nested.\n\n### The Crown of Sea\n\nThe Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, and tide-forges.\n\nTheir charge was **stewardship of the sea**.\n\nAtlanteans could not live long upon dry land. Their skin dried, their lungs burned, and their magic weakened away from saltwater. For this reason, they relied on treaties, surface envoys, and human navigators to understand the continents above. They knew the deep better than any surface kingdom, but the mountains, volcanoes, high cliffs, and inland dragon rookeries were beyond their reach.\n\n### The Crown of Sky\n\nThe dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.\n\nTheir charge was **stewardship of the sky**.\n\nThe dragons did not own the world. They anchored it.\n\nWhere dragons nested, the world was stable. Volcanoes slept. Storms followed seasons. Oceans respected their shores. Magic flowed in cycles rather than floods. Each clutch was more than a generation of dragons; it was a promise between land, sea, and sky.\n\n### The First Age\n\nIn the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.\n\nHumans traded surface goods to Atlantis: timber, iron, fruit, spices, cloth, stories, and maps. Atlanteans traded sea-gifts to humans: pearls, medicines, current-charts, coral glass, tide charms, and leviathan-safe passages. Dragons rarely traded, but they gave warnings. A dragon circling a harbour might mean storm. A dragon vanishing from a mountain might mean eruption. A clutch abandoned before hatching was considered a prophecy of disaster.\n\nThis age was prosperous because no one power could rule all three realms.\n\nHumans could not command the deep.\n\nAtlanteans could not walk the land.\n\nDragons would not kneel to either.\n\nThat limitation was the source of peace.\n\nThen Atlantis grew ashamed of needing others.\n\n---","sections":[{"id":"the-crown-of-land","title":"The Crown of Land","markdown":"The humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.\n\nTheir charge was **stewardship of the land**.\n\nThey built the lighthouse chains, maintained the ports, grew the food, forged the cannons, and charted the safe roads between mountain, jungle, desert, and coast. Their admiralties guarded trade routes and kept sacred charts that marked not only reefs and storms, but the hidden places where dragons nested.","excerpt":"The humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.","bullets":[]},{"id":"the-crown-of-sea","title":"The Crown of Sea","markdown":"The Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, and tide-forges.\n\nTheir charge was **stewardship of the sea**.\n\nAtlanteans could not live long upon dry land. Their skin dried, their lungs burned, and their magic weakened away from saltwater. For this reason, they relied on treaties, surface envoys, and human navigators to understand the continents above. They knew the deep better than any surface kingdom, but the mountains, volcanoes, high cliffs, and inland dragon rookeries were beyond their reach.","excerpt":"The Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, and tide-forges.","bullets":[]},{"id":"the-crown-of-sky","title":"The Crown of Sky","markdown":"The dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.\n\nTheir charge was **stewardship of the sky**.\n\nThe dragons did not own the world. They anchored it.\n\nWhere dragons nested, the world was stable. Volcanoes slept. Storms followed seasons. Oceans respected their shores. Magic flowed in cycles rather than floods. Each clutch was more than a generation of dragons; it was a promise between land, sea, and sky.","excerpt":"The dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.","bullets":[]},{"id":"the-first-age","title":"The First Age","markdown":"In the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.\n\nHumans traded surface goods to Atlantis: timber, iron, fruit, spices, cloth, stories, and maps. Atlanteans traded sea-gifts to humans: pearls, medicines, current-charts, coral glass, tide charms, and leviathan-safe passages. Dragons rarely traded, but they gave warnings. A dragon circling a harbour might mean storm. A dragon vanishing from a mountain might mean eruption. A clutch abandoned before hatching was considered a prophecy of disaster.\n\nThis age was prosperous because no one power could rule all three realms.\n\nHumans could not command the deep.\n\nAtlanteans could not walk the land.\n\nDragons would not kneel to either.\n\nThat limitation was the source of peace.\n\nThen Atlantis grew ashamed of needing others.\n\n---","excerpt":"In the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.","bullets":[]}]},{"id":"the-atlantean-hunger","title":"The Atlantean Hunger","summary":"As the centuries passed, the Atlantean high houses became obsessed with a forbidden question:","markdown":"As the centuries passed, the Atlantean high houses became obsessed with a forbidden question:\n\n**Why should the sea merely be one crown of three?**\n\nTheir empire was vast, beautiful, ancient, and powerful—but trapped beneath the surface. They watched human kingdoms multiply across the land. They watched dragons soar over both land and sea without borders. To the most ambitious Atlanteans, balance began to look like humiliation.\n\nThe ruling faction that embraced this belief became known as **The Pearl Synod**. They argued that Atlantis had been denied its rightful destiny. They believed only the sea was eternal, and that all land, sky, wind, fire, beast, and kingdom should eventually answer to the tide.\n\nTo achieve this, the Pearl Synod designed a ritual engine beneath the Atlantean capital:\n\n**The Crown Below.**\n\nThe Crown Below was not simply an artifact. It was a world-commanding device. It was intended to bind land, sea, and sky into one throne of tidal law.\n\nTo awaken it, the Synod needed three kinds of power:\n\n1. **The blood-memory of dragons** — contained most purely in their eggs.\n2. **The obedience of leviathans** — controlled through Atlantean tide-song.\n3. **The maps of the surface world** — especially the hidden locations of dragon nests.\n\nAtlantis already had the leviathans.\n\nThey lacked the maps.\n\nSo they turned to a man of the surface.\n\n---","body":"As the centuries passed, the Atlantean high houses became obsessed with a forbidden question:\n\n**Why should the sea merely be one crown of three?**\n\nTheir empire was vast, beautiful, ancient, and powerful—but trapped beneath the surface. They watched human kingdoms multiply across the land. They watched dragons soar over both land and sea without borders. To the most ambitious Atlanteans, balance began to look like humiliation.\n\nThe ruling faction that embraced this belief became known as **The Pearl Synod**. They argued that Atlantis had been denied its rightful destiny. They believed only the sea was eternal, and that all land, sky, wind, fire, beast, and kingdom should eventually answer to the tide.\n\nTo achieve this, the Pearl Synod designed a ritual engine beneath the Atlantean capital:\n\n**The Crown Below.**\n\nThe Crown Below was not simply an artifact. It was a world-commanding device. It was intended to bind land, sea, and sky into one throne of tidal law.\n\nTo awaken it, the Synod needed three kinds of power:\n\n1. **The blood-memory of dragons** — contained most purely in their eggs.\n2. **The obedience of leviathans** — controlled through Atlantean tide-song.\n3. **The maps of the surface world** — especially the hidden locations of dragon nests.\n\nAtlantis already had the leviathans.\n\nThey lacked the maps.\n\nSo they turned to a man of the surface.\n\n---","sections":[]},{"id":"admiral-barrows-betrayal","title":"Admiral Barrow's Betrayal","summary":"Admiral Cassian Barrow, father of Jasper Barrow, was one of the most trusted men in the old Imperial Admiralty. He was not only a commander, but the Lord-Cartographer of the Admiralty, keeper of its most sacred and forbidden charts.","markdown":"**Admiral Cassian Barrow**, father of Jasper Barrow, was one of the most trusted men in the old Imperial Admiralty. He was not only a commander, but the **Lord-Cartographer of the Admiralty**, keeper of its most sacred and forbidden charts.\n\nThose charts marked more than trade routes. They recorded storm passages, hidden islands, dragon migration paths, rookery cliffs, volcanic nests, old treaty markers, and the sanctuaries where the dragons of the First Age raised their young.\n\nThe Atlanteans could not reach those places themselves. They could not climb the volcanic ridges where fire dragons nested. They could not cross the inland calderas where ancient clutches slept. They could not scale the storm cliffs where wind dragons brooded.\n\nSo the Pearl Synod offered Cassian Barrow what every proud traitor believes he deserves:\n\nPower.\n\nWealth.\n\nImmortality.\n\nA throne after the ritual.\n\nCassian was promised rule over the surface fleets once Atlantis rose above all other powers. He would become the first human Lord-Admiral of the New Tide Empire.\n\nCassian accepted.\n\nHe did not raid the nests himself. That would expose him. Instead, he released copied charts to pirate lords, privateers, smugglers, disgraced captains, and treasure fleets hungry for impossible wealth. Some were told the dragon eggs were priceless relics. Some were promised gold. Some were promised pardons. Some were promised Atlantean weapons. Some were simply told that dragon eggs could make men into kings.\n\nThis was the original sin of the pirate age:\n\n**the first great dragon hunts were not random acts of piracy, but a conspiracy between Atlantis, a corrupt admiral, and the pirate lords of the surface.**\n\nThe Pirate Kings of the present are heirs to that sin, whether they know it or not.\n\n---","body":"**Admiral Cassian Barrow**, father of Jasper Barrow, was one of the most trusted men in the old Imperial Admiralty. He was not only a commander, but the **Lord-Cartographer of the Admiralty**, keeper of its most sacred and forbidden charts.\n\nThose charts marked more than trade routes. They recorded storm passages, hidden islands, dragon migration paths, rookery cliffs, volcanic nests, old treaty markers, and the sanctuaries where the dragons of the First Age raised their young.\n\nThe Atlanteans could not reach those places themselves. They could not climb the volcanic ridges where fire dragons nested. They could not cross the inland calderas where ancient clutches slept. They could not scale the storm cliffs where wind dragons brooded.\n\nSo the Pearl Synod offered Cassian Barrow what every proud traitor believes he deserves:\n\nPower.\n\nWealth.\n\nImmortality.\n\nA throne after the ritual.\n\nCassian was promised rule over the surface fleets once Atlantis rose above all other powers. He would become the first human Lord-Admiral of the New Tide Empire.\n\nCassian accepted.\n\nHe did not raid the nests himself. That would expose him. Instead, he released copied charts to pirate lords, privateers, smugglers, disgraced captains, and treasure fleets hungry for impossible wealth. Some were told the dragon eggs were priceless relics. Some were promised gold. Some were promised pardons. Some were promised Atlantean weapons. Some were simply told that dragon eggs could make men into kings.\n\nThis was the original sin of the pirate age:\n\n**the first great dragon hunts were not random acts of piracy, but a conspiracy between Atlantis, a corrupt admiral, and the pirate lords of the surface.**\n\nThe Pirate Kings of the present are heirs to that sin, whether they know it or not.\n\n---","sections":[]},{"id":"jasper-barrow-and-the-false-treason","title":"Jasper Barrow and the False Treason","summary":"Jasper Barrow was raised in the shadow of his father's honour. He believed the Admiralty protected the innocent. He believed charts were sacred because they kept sailors alive. He believed power existed to defend those without it.","markdown":"Jasper Barrow was raised in the shadow of his father's honour. He believed the Admiralty protected the innocent. He believed charts were sacred because they kept sailors alive. He believed power existed to defend those without it.\n\nThat is why he became dangerous.\n\nAs a young captain, Jasper began noticing impossible patterns:\n\n- Dragon nests marked as \"extinct\" shortly before pirate raids.\n- Pirate vessels avoiding naval patrols with impossible accuracy.\n- Atlantean pearl coin found in the hands of surface raiders.\n- Refugees speaking of eggs taken alive, not treasure stolen.\n- His father quietly altering Admiralty records after each attack.\n\nAt first, Jasper thought there was a spy inside the Admiralty.\n\nThen he found the duplicate charts.\n\nNot stolen.\n\nSigned.\n\nSealed.\n\nReleased under his father's authority.\n\nJasper confronted Cassian in private, still hoping there was an explanation. Cassian did not deny it. He told Jasper that the First Age was ending. That dragons were relics. That humans were weak because they clung to old treaties. That Atlantis had the will to remake the world, and that the Barrow name would stand at the right hand of the new empire.\n\nJasper refused.\n\nHe threatened to expose him.\n\nSo Cassian destroyed his son.\n\n### The False Distress Call\n\nCassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.\n\nJasper sailed immediately.\n\nBut there was no convoy.\n\nOnly pirate lords waiting in the storm, carrying Barrow charts, Atlantean shot, and orders to leave no survivors.\n\nJasper's ship, **The Righteous Tide**, fought until its masts burned and its hull split. His crew died believing they had been abandoned by the Admiralty. Jasper was wounded, chained to the wheel, and left to sink beneath black water.\n\nCassian declared Jasper a traitor.\n\nThe official story became that Jasper had sold Admiralty charts to pirates, murdered his own crew, and fled into the storm. That lie survived the cataclysm and still stains his name in some ports.\n\nSome sailors still curse Jasper Barrow as the first traitor-captain.\n\nOthers whisper that he was the only honest man in the Admiralty.\n\n---","body":"Jasper Barrow was raised in the shadow of his father's honour. He believed the Admiralty protected the innocent. He believed charts were sacred because they kept sailors alive. He believed power existed to defend those without it.\n\nThat is why he became dangerous.\n\nAs a young captain, Jasper began noticing impossible patterns:\n\n- Dragon nests marked as \"extinct\" shortly before pirate raids.\n- Pirate vessels avoiding naval patrols with impossible accuracy.\n- Atlantean pearl coin found in the hands of surface raiders.\n- Refugees speaking of eggs taken alive, not treasure stolen.\n- His father quietly altering Admiralty records after each attack.\n\nAt first, Jasper thought there was a spy inside the Admiralty.\n\nThen he found the duplicate charts.\n\nNot stolen.\n\nSigned.\n\nSealed.\n\nReleased under his father's authority.\n\nJasper confronted Cassian in private, still hoping there was an explanation. Cassian did not deny it. He told Jasper that the First Age was ending. That dragons were relics. That humans were weak because they clung to old treaties. That Atlantis had the will to remake the world, and that the Barrow name would stand at the right hand of the new empire.\n\nJasper refused.\n\nHe threatened to expose him.\n\nSo Cassian destroyed his son.\n\n### The False Distress Call\n\nCassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.\n\nJasper sailed immediately.\n\nBut there was no convoy.\n\nOnly pirate lords waiting in the storm, carrying Barrow charts, Atlantean shot, and orders to leave no survivors.\n\nJasper's ship, **The Righteous Tide**, fought until its masts burned and its hull split. His crew died believing they had been abandoned by the Admiralty. Jasper was wounded, chained to the wheel, and left to sink beneath black water.\n\nCassian declared Jasper a traitor.\n\nThe official story became that Jasper had sold Admiralty charts to pirates, murdered his own crew, and fled into the storm. That lie survived the cataclysm and still stains his name in some ports.\n\nSome sailors still curse Jasper Barrow as the first traitor-captain.\n\nOthers whisper that he was the only honest man in the Admiralty.\n\n---","sections":[{"id":"the-false-distress-call","title":"The False Distress Call","markdown":"Cassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.\n\nJasper sailed immediately.\n\nBut there was no convoy.\n\nOnly pirate lords waiting in the storm, carrying Barrow charts, Atlantean shot, and orders to leave no survivors.\n\nJasper's ship, **The Righteous Tide**, fought until its masts burned and its hull split. His crew died believing they had been abandoned by the Admiralty. Jasper was wounded, chained to the wheel, and left to sink beneath black water.\n\nCassian declared Jasper a traitor.\n\nThe official story became that Jasper had sold Admiralty charts to pirates, murdered his own crew, and fled into the storm. That lie survived the cataclysm and still stains his name in some ports.\n\nSome sailors still curse Jasper Barrow as the first traitor-captain.\n\nOthers whisper that he was the only honest man in the Admiralty.\n\n---","excerpt":"Cassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.","bullets":[]}]},{"id":"aurelions-dive","title":"Aurelion's Dive","summary":"As Jasper sank, an Elder Dragon was nearby.","markdown":"As Jasper sank, an Elder Dragon was nearby.\n\nHis name was **Aurelion Veyr**, the Last Dawn-Wing.\n\nAurelion was one of the oldest dragons of the First Age, guardian of a hidden migration route and keeper of several scattered clutches. He had already sensed the theft of eggs across the world. He had felt nests go silent. He had heard unborn dragon-song vanish.\n\nThen he felt something different.\n\nNot the fear of prey.\n\nNot the rage of battle.\n\nA betrayal so deep it echoed like a wound in the world.\n\nJasper's soul, still burning with grief and justice, called through the storm.\n\nAurelion dived from the clouds into the sea.\n\nSailor myth remembers this only as a flash of gold beneath black waves: a dragon-shaped dawn vanishing into the storm.\n\nAurelion could not save Jasper's life.\n\nBut he saved his soul.\n\nHe carried Jasper's dying spirit into the deep, away from the pirates, away from Cassian's lie, away from the reach of Atlantis. There, beneath the storm, dragonfire met seawater and created something impossible:\n\n**Veilflame.**\n\nNot living fire.\n\nNot ghost magic.\n\nA sacred flame that burns only around broken oaths, betrayed innocents, and buried truths.\n\n---","body":"As Jasper sank, an Elder Dragon was nearby.\n\nHis name was **Aurelion Veyr**, the Last Dawn-Wing.\n\nAurelion was one of the oldest dragons of the First Age, guardian of a hidden migration route and keeper of several scattered clutches. He had already sensed the theft of eggs across the world. He had felt nests go silent. He had heard unborn dragon-song vanish.\n\nThen he felt something different.\n\nNot the fear of prey.\n\nNot the rage of battle.\n\nA betrayal so deep it echoed like a wound in the world.\n\nJasper's soul, still burning with grief and justice, called through the storm.\n\nAurelion dived from the clouds into the sea.\n\nSailor myth remembers this only as a flash of gold beneath black waves: a dragon-shaped dawn vanishing into the storm.\n\nAurelion could not save Jasper's life.\n\nBut he saved his soul.\n\nHe carried Jasper's dying spirit into the deep, away from the pirates, away from Cassian's lie, away from the reach of Atlantis. There, beneath the storm, dragonfire met seawater and created something impossible:\n\n**Veilflame.**\n\nNot living fire.\n\nNot ghost magic.\n\nA sacred flame that burns only around broken oaths, betrayed innocents, and buried truths.\n\n---","sections":[]},{"id":"the-crown-below-ritual","title":"The Crown Below Ritual","summary":"By then, the Atlanteans had gathered enough eggs.","markdown":"By then, the Atlanteans had gathered enough eggs.\n\nThe pirate lords delivered crates of them into the deep: fire eggs, storm eggs, reef eggs, moon eggs, frost eggs, ash eggs, and ancient clutches stolen from nests older than human kingdoms.\n\nThe Pearl Synod placed them around the Crown Below. They believed dragon eggs were batteries: sources of sky-magic to be cracked, drained, and commanded.\n\nThey were wrong.\n\nDragon eggs were not containers of power.\n\nThey were promises.\n\nEach egg was bound to a place, a season, a current, a mountain, a wind, a future migration, and a balance not yet born.\n\nWhen the ritual began, the Crown Below tried to pull all three realms into one command.\n\nIt reached for the land through stolen maps.\n\nIt reached for the sea through leviathan song.\n\nIt reached for the sky through unborn dragons.\n\nFor one heartbeat, it worked.\n\nThe tides stopped.\n\nThe stars bent downward.\n\nEvery dragon in the world screamed.\n\nThen the unborn refused.\n\nThe eggs broke, but they did not obey.\n\nInstead of crowning Atlantis, the ritual tore the covenants of the First Age apart.\n\nThe continental shelves shattered.\n\nAtlantis sank deeper than the sea was meant to go.\n\nVolcanic chains erupted.\n\nStorms became permanent.\n\nDragon routes vanished.\n\nLeviathans went mad.\n\nOld gods, sea beasts, or abyssal things—depending on who tells the tale—stirred beneath the wound.\n\nThe world became the Shattered Seas.\n\nThis event is remembered by many names:\n\n- **The Shattering**\n- **The Drowning**\n- **The Sundering of the Three Crowns**\n- **The Night the Sea Rose**\n- **The Breaking of the First Age**\n\n---","body":"By then, the Atlanteans had gathered enough eggs.\n\nThe pirate lords delivered crates of them into the deep: fire eggs, storm eggs, reef eggs, moon eggs, frost eggs, ash eggs, and ancient clutches stolen from nests older than human kingdoms.\n\nThe Pearl Synod placed them around the Crown Below. They believed dragon eggs were batteries: sources of sky-magic to be cracked, drained, and commanded.\n\nThey were wrong.\n\nDragon eggs were not containers of power.\n\nThey were promises.\n\nEach egg was bound to a place, a season, a current, a mountain, a wind, a future migration, and a balance not yet born.\n\nWhen the ritual began, the Crown Below tried to pull all three realms into one command.\n\nIt reached for the land through stolen maps.\n\nIt reached for the sea through leviathan song.\n\nIt reached for the sky through unborn dragons.\n\nFor one heartbeat, it worked.\n\nThe tides stopped.\n\nThe stars bent downward.\n\nEvery dragon in the world screamed.\n\nThen the unborn refused.\n\nThe eggs broke, but they did not obey.\n\nInstead of crowning Atlantis, the ritual tore the covenants of the First Age apart.\n\nThe continental shelves shattered.\n\nAtlantis sank deeper than the sea was meant to go.\n\nVolcanic chains erupted.\n\nStorms became permanent.\n\nDragon routes vanished.\n\nLeviathans went mad.\n\nOld gods, sea beasts, or abyssal things—depending on who tells the tale—stirred beneath the wound.\n\nThe world became the Shattered Seas.\n\nThis event is remembered by many names:\n\n- **The Shattering**\n- **The Drowning**\n- **The Sundering of the Three Crowns**\n- **The Night the Sea Rose**\n- **The Breaking of the First Age**\n\n---","sections":[]},{"id":"jaspers-binding","title":"Jasper's Binding","summary":"During the catastrophe, Aurelion knew the world had been wounded beyond simple healing.","markdown":"During the catastrophe, Aurelion knew the world had been wounded beyond simple healing.\n\nThe dragons were scattered.\n\nAtlantis was drowning.\n\nHuman kingdoms were collapsing.\n\nThe seas were filling with pirates, monsters, wrecks, and lies.\n\nJasper's body was dead. His name had been ruined. His crew was gone. But his soul remained fiercely intact.\n\nAurelion offered him a choice.\n\nNot resurrection.\n\nNot peace.\n\nA charge.\n\nJasper could pass beyond death and leave the world to its ruin. Or he could be bound to the sea as a revenant oath: a guardian of the betrayed, a hunter of tyrants, and a witness against the lie that destroyed the First Age.\n\nJasper accepted.\n\nAurelion bound Jasper's soul to the Veilwake Sea with dragonfire, seawater, and the last breath of the storm.\n\nFrom that moment, Jasper Barrow became:\n\n**The Ghost Captain of the Righteous Tide.**  \n**The First Drowned Oath.**  \n**The Witness in the Fog.**  \n**The Man the Sea Would Not Let Die.**\n\nJasper's undeath is not merely a curse. It is a sacred wound. He is consecrated by betrayal and chained to justice until corruption, tyranny, and the crimes against dragonkind are answered.\n\n### The Fate of Aurelion Veyr\n\nAurelion vanished after binding Jasper.\n\nSome say he died and became the golden dawn sometimes seen over the Veilwake Sea. Others claim his bones lie wrapped around the first dragon sanctuary. Some Tidewardens believe his body still sleeps beneath **Dawnrest**, the oldest hidden sanctuary, and that his dreams guide lost eggs home.\n\nThe truth of Aurelion's fate is one of the deepest mysteries of the Shattered Seas.\n\n---","body":"During the catastrophe, Aurelion knew the world had been wounded beyond simple healing.\n\nThe dragons were scattered.\n\nAtlantis was drowning.\n\nHuman kingdoms were collapsing.\n\nThe seas were filling with pirates, monsters, wrecks, and lies.\n\nJasper's body was dead. His name had been ruined. His crew was gone. But his soul remained fiercely intact.\n\nAurelion offered him a choice.\n\nNot resurrection.\n\nNot peace.\n\nA charge.\n\nJasper could pass beyond death and leave the world to its ruin. Or he could be bound to the sea as a revenant oath: a guardian of the betrayed, a hunter of tyrants, and a witness against the lie that destroyed the First Age.\n\nJasper accepted.\n\nAurelion bound Jasper's soul to the Veilwake Sea with dragonfire, seawater, and the last breath of the storm.\n\nFrom that moment, Jasper Barrow became:\n\n**The Ghost Captain of the Righteous Tide.**  \n**The First Drowned Oath.**  \n**The Witness in the Fog.**  \n**The Man the Sea Would Not Let Die.**\n\nJasper's undeath is not merely a curse. It is a sacred wound. He is consecrated by betrayal and chained to justice until corruption, tyranny, and the crimes against dragonkind are answered.\n\n### The Fate of Aurelion Veyr\n\nAurelion vanished after binding Jasper.\n\nSome say he died and became the golden dawn sometimes seen over the Veilwake Sea. Others claim his bones lie wrapped around the first dragon sanctuary. Some Tidewardens believe his body still sleeps beneath **Dawnrest**, the oldest hidden sanctuary, and that his dreams guide lost eggs home.\n\nThe truth of Aurelion's fate is one of the deepest mysteries of the Shattered Seas.\n\n---","sections":[{"id":"the-fate-of-aurelion-veyr","title":"The Fate of Aurelion Veyr","markdown":"Aurelion vanished after binding Jasper.\n\nSome say he died and became the golden dawn sometimes seen over the Veilwake Sea. Others claim his bones lie wrapped around the first dragon sanctuary. Some Tidewardens believe his body still sleeps beneath **Dawnrest**, the oldest hidden sanctuary, and that his dreams guide lost eggs home.\n\nThe truth of Aurelion's fate is one of the deepest mysteries of the Shattered Seas.\n\n---","excerpt":"Aurelion vanished after binding Jasper.","bullets":[]}]},{"id":"the-crown-below-the-wound-that-still-pulses","title":"The Crown Below: The Wound That Still Pulses","summary":"The Crown Below did not vanish after the ritual failed.","markdown":"The Crown Below did not vanish after the ritual failed.\n\nIt remains beneath the deepest ruins of Atlantis: broken, buried, and leaking power.\n\nIt no longer has enough strength to command land, sea, and sky, but it continues to distort the world. Its pulse explains why the Shattered Seas are still unstable, why old routes change, why magic returns in dangerous forms, why sea monsters stir, and why the domains of the Pirate Kings are warped by supernatural influence.\n\nEvery stolen dragon egg, every slain dragon, every awakened leviathan, every serpent curse, every abyssal song, and every act of tyrannical conquest risks feeding the old wound.\n\nThe greatest danger is not that the world was broken once.\n\nIt is that the world can be broken again.\n\n---","body":"The Crown Below did not vanish after the ritual failed.\n\nIt remains beneath the deepest ruins of Atlantis: broken, buried, and leaking power.\n\nIt no longer has enough strength to command land, sea, and sky, but it continues to distort the world. Its pulse explains why the Shattered Seas are still unstable, why old routes change, why magic returns in dangerous forms, why sea monsters stir, and why the domains of the Pirate Kings are warped by supernatural influence.\n\nEvery stolen dragon egg, every slain dragon, every awakened leviathan, every serpent curse, every abyssal song, and every act of tyrannical conquest risks feeding the old wound.\n\nThe greatest danger is not that the world was broken once.\n\nIt is that the world can be broken again.\n\n---","sections":[]},{"id":"public-rumours-vs-hidden-truth","title":"Public Rumours vs. Hidden Truth","summary":"Most people do not know the true history of the Shattered Seas. The player should uncover it gradually through quests, wrecks, charts, murals, ghostly encounters, sanctuary lore, and conflicting faction testimony.","markdown":"Most people do not know the true history of the Shattered Seas. The player should uncover it gradually through quests, wrecks, charts, murals, ghostly encounters, sanctuary lore, and conflicting faction testimony.\n\n### Common Sailor Rumours\n\n- \"The Shattering was a war between sea gods.\"\n- \"The dragons burned the world and fled.\"\n- \"Atlantis tried to save us, but the surface kingdoms betrayed them.\"\n- \"Pirates cracked the world open looking for gold.\"\n- \"Something woke beneath the waves and swallowed the continents.\"\n- \"Jasper Barrow caused it. That's why his ghost still sails.\"\n\n### The Atlantean Version\n\nAtlantean loyalists blame the surface world. They say humans broke the old treaties, pirates slaughtered dragons carelessly, and Atlantis attempted a desperate ritual to restore order before the world collapsed.\n\nSome Atlanteans know this is a lie.\n\nOthers believe it completely.\n\n### The Admiralty Version\n\nThe remaining human authorities blame pirates, dragons, natural disaster, and old sea magic. They bury Cassian Barrow's role because admitting that the Lord-Cartographer of the Admiralty helped cause the apocalypse would destroy what little faith remains in naval law.\n\n### The Pirate Version\n\nPirates tell stories of the **Egg Rush**, when dragon eggs were worth more than kingdoms. Many do not understand that their predecessors helped end the world. Some treat it as a glorious age of plunder.\n\n### Jasper's Version\n\nJasper remembers the truth, but not cleanly.\n\nHis memory is fractured by death, dragonfire, grief, and centuries of vengeance. When the player first meets him, he speaks in accusations, warnings, and half-remembered sorrow. Only by recovering relics, charts, bells, eggshell fragments, and ship logs can the player help him remember the whole story.\n\n---","body":"Most people do not know the true history of the Shattered Seas. The player should uncover it gradually through quests, wrecks, charts, murals, ghostly encounters, sanctuary lore, and conflicting faction testimony.\n\n### Common Sailor Rumours\n\n- \"The Shattering was a war between sea gods.\"\n- \"The dragons burned the world and fled.\"\n- \"Atlantis tried to save us, but the surface kingdoms betrayed them.\"\n- \"Pirates cracked the world open looking for gold.\"\n- \"Something woke beneath the waves and swallowed the continents.\"\n- \"Jasper Barrow caused it. That's why his ghost still sails.\"\n\n### The Atlantean Version\n\nAtlantean loyalists blame the surface world. They say humans broke the old treaties, pirates slaughtered dragons carelessly, and Atlantis attempted a desperate ritual to restore order before the world collapsed.\n\nSome Atlanteans know this is a lie.\n\nOthers believe it completely.\n\n### The Admiralty Version\n\nThe remaining human authorities blame pirates, dragons, natural disaster, and old sea magic. They bury Cassian Barrow's role because admitting that the Lord-Cartographer of the Admiralty helped cause the apocalypse would destroy what little faith remains in naval law.\n\n### The Pirate Version\n\nPirates tell stories of the **Egg Rush**, when dragon eggs were worth more than kingdoms. Many do not understand that their predecessors helped end the world. Some treat it as a glorious age of plunder.\n\n### Jasper's Version\n\nJasper remembers the truth, but not cleanly.\n\nHis memory is fractured by death, dragonfire, grief, and centuries of vengeance. When the player first meets him, he speaks in accusations, warnings, and half-remembered sorrow. Only by recovering relics, charts, bells, eggshell fragments, and ship logs can the player help him remember the whole story.\n\n---","sections":[{"id":"common-sailor-rumours","title":"Common Sailor Rumours","markdown":"- \"The Shattering was a war between sea gods.\"\n- \"The dragons burned the world and fled.\"\n- \"Atlantis tried to save us, but the surface kingdoms betrayed them.\"\n- \"Pirates cracked the world open looking for gold.\"\n- \"Something woke beneath the waves and swallowed the continents.\"\n- \"Jasper Barrow caused it. That's why his ghost still sails.\"","excerpt":"\"The Shattering was a war between sea gods.\" \"The dragons burned the world and fled.\" \"Atlantis tried to save us, but the surface kingdoms betrayed them.\" \"Pirates cracked the world open looking for gold.\" \"Something woke beneath the waves and swallowed the continents.\" \"Jasper Barrow caused it. That's why his ghost still sails.\"","bullets":["\"The Shattering was a war between sea gods.\"","\"The dragons burned the world and fled.\"","\"Atlantis tried to save us, but the surface kingdoms betrayed them.\"","\"Pirates cracked the world open looking for gold.\"","\"Something woke beneath the waves and swallowed the continents.\"","\"Jasper Barrow caused it. That's why his ghost still sails.\""]},{"id":"the-atlantean-version","title":"The Atlantean Version","markdown":"Atlantean loyalists blame the surface world. They say humans broke the old treaties, pirates slaughtered dragons carelessly, and Atlantis attempted a desperate ritual to restore order before the world collapsed.\n\nSome Atlanteans know this is a lie.\n\nOthers believe it completely.","excerpt":"Atlantean loyalists blame the surface world. They say humans broke the old treaties, pirates slaughtered dragons carelessly, and Atlantis attempted a desperate ritual to restore order before the world collapsed.","bullets":[]},{"id":"the-admiralty-version","title":"The Admiralty Version","markdown":"The remaining human authorities blame pirates, dragons, natural disaster, and old sea magic. They bury Cassian Barrow's role because admitting that the Lord-Cartographer of the Admiralty helped cause the apocalypse would destroy what little faith remains in naval law.","excerpt":"The remaining human authorities blame pirates, dragons, natural disaster, and old sea magic. They bury Cassian Barrow's role because admitting that the Lord-Cartographer of the Admiralty helped cause the apocalypse would destroy what little faith remains in naval law.","bullets":[]},{"id":"the-pirate-version","title":"The Pirate Version","markdown":"Pirates tell stories of the **Egg Rush**, when dragon eggs were worth more than kingdoms. Many do not understand that their predecessors helped end the world. Some treat it as a glorious age of plunder.","excerpt":"Pirates tell stories of the Egg Rush, when dragon eggs were worth more than kingdoms. Many do not understand that their predecessors helped end the world. Some treat it as a glorious age of plunder.","bullets":[]},{"id":"jaspers-version","title":"Jasper's Version","markdown":"Jasper remembers the truth, but not cleanly.\n\nHis memory is fractured by death, dragonfire, grief, and centuries of vengeance. When the player first meets him, he speaks in accusations, warnings, and half-remembered sorrow. Only by recovering relics, charts, bells, eggshell fragments, and ship logs can the player help him remember the whole story.\n\n---","excerpt":"Jasper remembers the truth, but not cleanly.","bullets":[]}]}],"beats":[{"id":"story-lore-the-sundering-of-the-three-crowns","title":"The Sundering of the Three Crowns","summary":"Before the Shattered Seas, there was a golden age remembered only in fragments: The First Age of the Three Crowns."},{"id":"the-atlantean-hunger","title":"The Atlantean Hunger","summary":"As the centuries passed, the Atlantean high houses became obsessed with a forbidden question:"},{"id":"admiral-barrows-betrayal","title":"Admiral Barrow's Betrayal","summary":"Admiral Cassian Barrow, father of Jasper Barrow, was one of the most trusted men in the old Imperial Admiralty. He was not only a commander, but the Lord-Cartographer of the Admiralty, keeper of its most sacred and forbidden charts."},{"id":"jasper-barrow-and-the-false-treason","title":"Jasper Barrow and the False Treason","summary":"Jasper Barrow was raised in the shadow of his father's honour. He believed the Admiralty protected the innocent. He believed charts were sacred because they kept sailors alive. He believed power existed to defend those without it."},{"id":"aurelions-dive","title":"Aurelion's Dive","summary":"As Jasper sank, an Elder Dragon was nearby."},{"id":"the-crown-below-ritual","title":"The Crown Below Ritual","summary":"By then, the Atlanteans had gathered enough eggs."},{"id":"jaspers-binding","title":"Jasper's Binding","summary":"During the catastrophe, Aurelion knew the world had been wounded beyond simple healing."}],"rumours":["\"The Shattering was a war between sea gods.\"","\"The dragons burned the world and fled.\"","\"Atlantis tried to save us, but the surface kingdoms betrayed them.\"","\"Pirates cracked the world open looking for gold.\"","\"Something woke beneath the waves and swallowed the continents.\"","\"Jasper Barrow caused it. That's why his ghost still sails.\""]},"loreBook":{"title":"The Shattered Seas Lorebook","subtitle":"A readable sourcebook generated from LORE.md for the pitch deck","chapters":[{"id":"the-world-the-shattered-seas","order":1,"title":"The World: The Shattered Seas","category":"World","excerpt":"The Shattered Seas are what remains of a once-balanced world. To most sailors, the truth of its ruin is lost beneath rumour, superstition, and salt.","markdown":"The **Shattered Seas** are what remains of a once-balanced world. To most sailors, the truth of its ruin is lost beneath rumour, superstition, and salt.\n\nCenturies ago, a cataclysm—some say a war between gods, others a volcanic chain reaction, still others whisper of something that *woke* beneath the waves—shattered the continental shelves and drowned the great coastal empires. What survived was an archipelago of scattered islands, treacherous straits, haunted routes, and waters that no longer obey the old charts.\n\nToday, the seas are ruled by **trade, rumor, and fear**. The inner archipelago—the **Home Waters**—remains relatively safe: established ports, merchant guilds, lighthouse keepers, and the last vestiges of naval authority. But beyond the safe routes lie the **Outer Seas**, where the **Five Pirate Kings** hold dominion. Each King commands a domain shaped by their curse, their ambition, or their obsession. Sailors who venture too far may never return—or return changed.\n\nThe world remembers the cataclysm only in broken stories. The player enters the Shattered Seas hearing conflicting rumours:\n\n- That the gods fought and cracked the world.\n- That a chain of volcanoes erupted and swallowed the continents.\n- That dragons burned the skies and fled.\n- That Atlantis tried to save the world and was betrayed.\n- That pirates dug too greedily into forbidden places.\n- That something ancient woke beneath the waves.\n- That the ghost captain Jasper Barrow caused it all.\n\nAll of these stories contain a shard of truth.\n\nNone of them are the whole truth.\n\n---","sections":[]},{"id":"story-lore-the-sundering-of-the-three-crowns","order":2,"title":"Story / Lore: The Sundering of the Three Crowns","category":"Myth","excerpt":"Before the Shattered Seas, there was a golden age remembered only in fragments: The First Age of the Three Crowns.","markdown":"Before the Shattered Seas, there was a golden age remembered only in fragments: **The First Age of the Three Crowns**.\n\nThe \"crowns\" were not merely royal titles. They were sacred charges: three realms, three peoples, and three duties that kept the world whole.\n\n### The Crown of Land\n\nThe humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.\n\nTheir charge was **stewardship of the land**.\n\nThey built the lighthouse chains, maintained the ports, grew the food, forged the cannons, and charted the safe roads between mountain, jungle, desert, and coast. Their admiralties guarded trade routes and kept sacred charts that marked not only reefs and storms, but the hidden places where dragons nested.\n\n### The Crown of Sea\n\nThe Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, and tide-forges.\n\nTheir charge was **stewardship of the sea**.\n\nAtlanteans could not live long upon dry land. Their skin dried, their lungs burned, and their magic weakened away from saltwater. For this reason, they relied on treaties, surface envoys, and human navigators to understand the continents above. They knew the deep better than any surface kingdom, but the mountains, volcanoes, high cliffs, and inland dragon rookeries were beyond their reach.\n\n### The Crown of Sky\n\nThe dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.\n\nTheir charge was **stewardship of the sky**.\n\nThe dragons did not own the world. They anchored it.\n\nWhere dragons nested, the world was stable. Volcanoes slept. Storms followed seasons. Oceans respected their shores. Magic flowed in cycles rather than floods. Each clutch was more than a generation of dragons; it was a promise between land, sea, and sky.\n\n### The First Age\n\nIn the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.\n\nHumans traded surface goods to Atlantis: timber, iron, fruit, spices, cloth, stories, and maps. Atlanteans traded sea-gifts to humans: pearls, medicines, current-charts, coral glass, tide charms, and leviathan-safe passages. Dragons rarely traded, but they gave warnings. A dragon circling a harbour might mean storm. A dragon vanishing from a mountain might mean eruption. A clutch abandoned before hatching was considered a prophecy of disaster.\n\nThis age was prosperous because no one power could rule all three realms.\n\nHumans could not command the deep.\n\nAtlanteans could not walk the land.\n\nDragons would not kneel to either.\n\nThat limitation was the source of peace.\n\nThen Atlantis grew ashamed of needing others.\n\n---","sections":[{"id":"the-crown-of-land","title":"The Crown of Land","markdown":"The humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.\n\nTheir charge was **stewardship of the land**.\n\nThey built the lighthouse chains, maintained the ports, grew the food, forged the cannons, and charted the safe roads between mountain, jungle, desert, and coast. Their admiralties guarded trade routes and kept sacred charts that marked not only reefs and storms, but the hidden places where dragons nested.","excerpt":"The humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.","bullets":[]},{"id":"the-crown-of-sea","title":"The Crown of Sea","markdown":"The Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, and tide-forges.\n\nTheir charge was **stewardship of the sea**.\n\nAtlanteans could not live long upon dry land. Their skin dried, their lungs burned, and their magic weakened away from saltwater. For this reason, they relied on treaties, surface envoys, and human navigators to understand the continents above. They knew the deep better than any surface kingdom, but the mountains, volcanoes, high cliffs, and inland dragon rookeries were beyond their reach.","excerpt":"The Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, and tide-forges.","bullets":[]},{"id":"the-crown-of-sky","title":"The Crown of Sky","markdown":"The dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.\n\nTheir charge was **stewardship of the sky**.\n\nThe dragons did not own the world. They anchored it.\n\nWhere dragons nested, the world was stable. Volcanoes slept. Storms followed seasons. Oceans respected their shores. Magic flowed in cycles rather than floods. Each clutch was more than a generation of dragons; it was a promise between land, sea, and sky.","excerpt":"The dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.","bullets":[]},{"id":"the-first-age","title":"The First Age","markdown":"In the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.\n\nHumans traded surface goods to Atlantis: timber, iron, fruit, spices, cloth, stories, and maps. Atlanteans traded sea-gifts to humans: pearls, medicines, current-charts, coral glass, tide charms, and leviathan-safe passages. Dragons rarely traded, but they gave warnings. A dragon circling a harbour might mean storm. A dragon vanishing from a mountain might mean eruption. A clutch abandoned before hatching was considered a prophecy of disaster.\n\nThis age was prosperous because no one power could rule all three realms.\n\nHumans could not command the deep.\n\nAtlanteans could not walk the land.\n\nDragons would not kneel to either.\n\nThat limitation was the source of peace.\n\nThen Atlantis grew ashamed of needing others.\n\n---","excerpt":"In the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.","bullets":[]}]},{"id":"the-atlantean-hunger","order":3,"title":"The Atlantean Hunger","category":"World","excerpt":"As the centuries passed, the Atlantean high houses became obsessed with a forbidden question:","markdown":"As the centuries passed, the Atlantean high houses became obsessed with a forbidden question:\n\n**Why should the sea merely be one crown of three?**\n\nTheir empire was vast, beautiful, ancient, and powerful—but trapped beneath the surface. They watched human kingdoms multiply across the land. They watched dragons soar over both land and sea without borders. To the most ambitious Atlanteans, balance began to look like humiliation.\n\nThe ruling faction that embraced this belief became known as **The Pearl Synod**. They argued that Atlantis had been denied its rightful destiny. They believed only the sea was eternal, and that all land, sky, wind, fire, beast, and kingdom should eventually answer to the tide.\n\nTo achieve this, the Pearl Synod designed a ritual engine beneath the Atlantean capital:\n\n**The Crown Below.**\n\nThe Crown Below was not simply an artifact. It was a world-commanding device. It was intended to bind land, sea, and sky into one throne of tidal law.\n\nTo awaken it, the Synod needed three kinds of power:\n\n1. **The blood-memory of dragons** — contained most purely in their eggs.\n2. **The obedience of leviathans** — controlled through Atlantean tide-song.\n3. **The maps of the surface world** — especially the hidden locations of dragon nests.\n\nAtlantis already had the leviathans.\n\nThey lacked the maps.\n\nSo they turned to a man of the surface.\n\n---","sections":[]},{"id":"admiral-barrows-betrayal","order":4,"title":"Admiral Barrow's Betrayal","category":"Myth","excerpt":"Admiral Cassian Barrow, father of Jasper Barrow, was one of the most trusted men in the old Imperial Admiralty. He was not only a commander, but the Lord-Cartographer of the Admiralty, keeper of its most sacred and forbidden charts.","markdown":"**Admiral Cassian Barrow**, father of Jasper Barrow, was one of the most trusted men in the old Imperial Admiralty. He was not only a commander, but the **Lord-Cartographer of the Admiralty**, keeper of its most sacred and forbidden charts.\n\nThose charts marked more than trade routes. They recorded storm passages, hidden islands, dragon migration paths, rookery cliffs, volcanic nests, old treaty markers, and the sanctuaries where the dragons of the First Age raised their young.\n\nThe Atlanteans could not reach those places themselves. They could not climb the volcanic ridges where fire dragons nested. They could not cross the inland calderas where ancient clutches slept. They could not scale the storm cliffs where wind dragons brooded.\n\nSo the Pearl Synod offered Cassian Barrow what every proud traitor believes he deserves:\n\nPower.\n\nWealth.\n\nImmortality.\n\nA throne after the ritual.\n\nCassian was promised rule over the surface fleets once Atlantis rose above all other powers. He would become the first human Lord-Admiral of the New Tide Empire.\n\nCassian accepted.\n\nHe did not raid the nests himself. That would expose him. Instead, he released copied charts to pirate lords, privateers, smugglers, disgraced captains, and treasure fleets hungry for impossible wealth. Some were told the dragon eggs were priceless relics. Some were promised gold. Some were promised pardons. Some were promised Atlantean weapons. Some were simply told that dragon eggs could make men into kings.\n\nThis was the original sin of the pirate age:\n\n**the first great dragon hunts were not random acts of piracy, but a conspiracy between Atlantis, a corrupt admiral, and the pirate lords of the surface.**\n\nThe Pirate Kings of the present are heirs to that sin, whether they know it or not.\n\n---","sections":[]},{"id":"jasper-barrow-and-the-false-treason","order":5,"title":"Jasper Barrow and the False Treason","category":"Myth","excerpt":"Jasper Barrow was raised in the shadow of his father's honour. He believed the Admiralty protected the innocent. He believed charts were sacred because they kept sailors alive. He believed power existed to defend those without it.","markdown":"Jasper Barrow was raised in the shadow of his father's honour. He believed the Admiralty protected the innocent. He believed charts were sacred because they kept sailors alive. He believed power existed to defend those without it.\n\nThat is why he became dangerous.\n\nAs a young captain, Jasper began noticing impossible patterns:\n\n- Dragon nests marked as \"extinct\" shortly before pirate raids.\n- Pirate vessels avoiding naval patrols with impossible accuracy.\n- Atlantean pearl coin found in the hands of surface raiders.\n- Refugees speaking of eggs taken alive, not treasure stolen.\n- His father quietly altering Admiralty records after each attack.\n\nAt first, Jasper thought there was a spy inside the Admiralty.\n\nThen he found the duplicate charts.\n\nNot stolen.\n\nSigned.\n\nSealed.\n\nReleased under his father's authority.\n\nJasper confronted Cassian in private, still hoping there was an explanation. Cassian did not deny it. He told Jasper that the First Age was ending. That dragons were relics. That humans were weak because they clung to old treaties. That Atlantis had the will to remake the world, and that the Barrow name would stand at the right hand of the new empire.\n\nJasper refused.\n\nHe threatened to expose him.\n\nSo Cassian destroyed his son.\n\n### The False Distress Call\n\nCassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.\n\nJasper sailed immediately.\n\nBut there was no convoy.\n\nOnly pirate lords waiting in the storm, carrying Barrow charts, Atlantean shot, and orders to leave no survivors.\n\nJasper's ship, **The Righteous Tide**, fought until its masts burned and its hull split. His crew died believing they had been abandoned by the Admiralty. Jasper was wounded, chained to the wheel, and left to sink beneath black water.\n\nCassian declared Jasper a traitor.\n\nThe official story became that Jasper had sold Admiralty charts to pirates, murdered his own crew, and fled into the storm. That lie survived the cataclysm and still stains his name in some ports.\n\nSome sailors still curse Jasper Barrow as the first traitor-captain.\n\nOthers whisper that he was the only honest man in the Admiralty.\n\n---","sections":[{"id":"the-false-distress-call","title":"The False Distress Call","markdown":"Cassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.\n\nJasper sailed immediately.\n\nBut there was no convoy.\n\nOnly pirate lords waiting in the storm, carrying Barrow charts, Atlantean shot, and orders to leave no survivors.\n\nJasper's ship, **The Righteous Tide**, fought until its masts burned and its hull split. His crew died believing they had been abandoned by the Admiralty. Jasper was wounded, chained to the wheel, and left to sink beneath black water.\n\nCassian declared Jasper a traitor.\n\nThe official story became that Jasper had sold Admiralty charts to pirates, murdered his own crew, and fled into the storm. That lie survived the cataclysm and still stains his name in some ports.\n\nSome sailors still curse Jasper Barrow as the first traitor-captain.\n\nOthers whisper that he was the only honest man in the Admiralty.\n\n---","excerpt":"Cassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.","bullets":[]}]},{"id":"aurelions-dive","order":6,"title":"Aurelion's Dive","category":"Myth","excerpt":"As Jasper sank, an Elder Dragon was nearby.","markdown":"As Jasper sank, an Elder Dragon was nearby.\n\nHis name was **Aurelion Veyr**, the Last Dawn-Wing.\n\nAurelion was one of the oldest dragons of the First Age, guardian of a hidden migration route and keeper of several scattered clutches. He had already sensed the theft of eggs across the world. He had felt nests go silent. He had heard unborn dragon-song vanish.\n\nThen he felt something different.\n\nNot the fear of prey.\n\nNot the rage of battle.\n\nA betrayal so deep it echoed like a wound in the world.\n\nJasper's soul, still burning with grief and justice, called through the storm.\n\nAurelion dived from the clouds into the sea.\n\nSailor myth remembers this only as a flash of gold beneath black waves: a dragon-shaped dawn vanishing into the storm.\n\nAurelion could not save Jasper's life.\n\nBut he saved his soul.\n\nHe carried Jasper's dying spirit into the deep, away from the pirates, away from Cassian's lie, away from the reach of Atlantis. There, beneath the storm, dragonfire met seawater and created something impossible:\n\n**Veilflame.**\n\nNot living fire.\n\nNot ghost magic.\n\nA sacred flame that burns only around broken oaths, betrayed innocents, and buried truths.\n\n---","sections":[]},{"id":"the-crown-below-ritual","order":7,"title":"The Crown Below Ritual","category":"Myth","excerpt":"By then, the Atlanteans had gathered enough eggs.","markdown":"By then, the Atlanteans had gathered enough eggs.\n\nThe pirate lords delivered crates of them into the deep: fire eggs, storm eggs, reef eggs, moon eggs, frost eggs, ash eggs, and ancient clutches stolen from nests older than human kingdoms.\n\nThe Pearl Synod placed them around the Crown Below. They believed dragon eggs were batteries: sources of sky-magic to be cracked, drained, and commanded.\n\nThey were wrong.\n\nDragon eggs were not containers of power.\n\nThey were promises.\n\nEach egg was bound to a place, a season, a current, a mountain, a wind, a future migration, and a balance not yet born.\n\nWhen the ritual began, the Crown Below tried to pull all three realms into one command.\n\nIt reached for the land through stolen maps.\n\nIt reached for the sea through leviathan song.\n\nIt reached for the sky through unborn dragons.\n\nFor one heartbeat, it worked.\n\nThe tides stopped.\n\nThe stars bent downward.\n\nEvery dragon in the world screamed.\n\nThen the unborn refused.\n\nThe eggs broke, but they did not obey.\n\nInstead of crowning Atlantis, the ritual tore the covenants of the First Age apart.\n\nThe continental shelves shattered.\n\nAtlantis sank deeper than the sea was meant to go.\n\nVolcanic chains erupted.\n\nStorms became permanent.\n\nDragon routes vanished.\n\nLeviathans went mad.\n\nOld gods, sea beasts, or abyssal things—depending on who tells the tale—stirred beneath the wound.\n\nThe world became the Shattered Seas.\n\nThis event is remembered by many names:\n\n- **The Shattering**\n- **The Drowning**\n- **The Sundering of the Three Crowns**\n- **The Night the Sea Rose**\n- **The Breaking of the First Age**\n\n---","sections":[]},{"id":"jaspers-binding","order":8,"title":"Jasper's Binding","category":"World","excerpt":"During the catastrophe, Aurelion knew the world had been wounded beyond simple healing.","markdown":"During the catastrophe, Aurelion knew the world had been wounded beyond simple healing.\n\nThe dragons were scattered.\n\nAtlantis was drowning.\n\nHuman kingdoms were collapsing.\n\nThe seas were filling with pirates, monsters, wrecks, and lies.\n\nJasper's body was dead. His name had been ruined. His crew was gone. But his soul remained fiercely intact.\n\nAurelion offered him a choice.\n\nNot resurrection.\n\nNot peace.\n\nA charge.\n\nJasper could pass beyond death and leave the world to its ruin. Or he could be bound to the sea as a revenant oath: a guardian of the betrayed, a hunter of tyrants, and a witness against the lie that destroyed the First Age.\n\nJasper accepted.\n\nAurelion bound Jasper's soul to the Veilwake Sea with dragonfire, seawater, and the last breath of the storm.\n\nFrom that moment, Jasper Barrow became:\n\n**The Ghost Captain of the Righteous Tide.**  \n**The First Drowned Oath.**  \n**The Witness in the Fog.**  \n**The Man the Sea Would Not Let Die.**\n\nJasper's undeath is not merely a curse. It is a sacred wound. He is consecrated by betrayal and chained to justice until corruption, tyranny, and the crimes against dragonkind are answered.\n\n### The Fate of Aurelion Veyr\n\nAurelion vanished after binding Jasper.\n\nSome say he died and became the golden dawn sometimes seen over the Veilwake Sea. Others claim his bones lie wrapped around the first dragon sanctuary. Some Tidewardens believe his body still sleeps beneath **Dawnrest**, the oldest hidden sanctuary, and that his dreams guide lost eggs home.\n\nThe truth of Aurelion's fate is one of the deepest mysteries of the Shattered Seas.\n\n---","sections":[{"id":"the-fate-of-aurelion-veyr","title":"The Fate of Aurelion Veyr","markdown":"Aurelion vanished after binding Jasper.\n\nSome say he died and became the golden dawn sometimes seen over the Veilwake Sea. Others claim his bones lie wrapped around the first dragon sanctuary. Some Tidewardens believe his body still sleeps beneath **Dawnrest**, the oldest hidden sanctuary, and that his dreams guide lost eggs home.\n\nThe truth of Aurelion's fate is one of the deepest mysteries of the Shattered Seas.\n\n---","excerpt":"Aurelion vanished after binding Jasper.","bullets":[]}]},{"id":"the-crown-below-the-wound-that-still-pulses","order":9,"title":"The Crown Below: The Wound That Still Pulses","category":"Myth","excerpt":"The Crown Below did not vanish after the ritual failed.","markdown":"The Crown Below did not vanish after the ritual failed.\n\nIt remains beneath the deepest ruins of Atlantis: broken, buried, and leaking power.\n\nIt no longer has enough strength to command land, sea, and sky, but it continues to distort the world. Its pulse explains why the Shattered Seas are still unstable, why old routes change, why magic returns in dangerous forms, why sea monsters stir, and why the domains of the Pirate Kings are warped by supernatural influence.\n\nEvery stolen dragon egg, every slain dragon, every awakened leviathan, every serpent curse, every abyssal song, and every act of tyrannical conquest risks feeding the old wound.\n\nThe greatest danger is not that the world was broken once.\n\nIt is that the world can be broken again.\n\n---","sections":[]},{"id":"public-rumours-vs-hidden-truth","order":10,"title":"Public Rumours vs. Hidden Truth","category":"Myth","excerpt":"Most people do not know the true history of the Shattered Seas. The player should uncover it gradually through quests, wrecks, charts, murals, ghostly encounters, sanctuary lore, and conflicting faction testimony.","markdown":"Most people do not know the true history of the Shattered Seas. The player should uncover it gradually through quests, wrecks, charts, murals, ghostly encounters, sanctuary lore, and conflicting faction testimony.\n\n### Common Sailor Rumours\n\n- \"The Shattering was a war between sea gods.\"\n- \"The dragons burned the world and fled.\"\n- \"Atlantis tried to save us, but the surface kingdoms betrayed them.\"\n- \"Pirates cracked the world open looking for gold.\"\n- \"Something woke beneath the waves and swallowed the continents.\"\n- \"Jasper Barrow caused it. That's why his ghost still sails.\"\n\n### The Atlantean Version\n\nAtlantean loyalists blame the surface world. They say humans broke the old treaties, pirates slaughtered dragons carelessly, and Atlantis attempted a desperate ritual to restore order before the world collapsed.\n\nSome Atlanteans know this is a lie.\n\nOthers believe it completely.\n\n### The Admiralty Version\n\nThe remaining human authorities blame pirates, dragons, natural disaster, and old sea magic. They bury Cassian Barrow's role because admitting that the Lord-Cartographer of the Admiralty helped cause the apocalypse would destroy what little faith remains in naval law.\n\n### The Pirate Version\n\nPirates tell stories of the **Egg Rush**, when dragon eggs were worth more than kingdoms. Many do not understand that their predecessors helped end the world. Some treat it as a glorious age of plunder.\n\n### Jasper's Version\n\nJasper remembers the truth, but not cleanly.\n\nHis memory is fractured by death, dragonfire, grief, and centuries of vengeance. When the player first meets him, he speaks in accusations, warnings, and half-remembered sorrow. Only by recovering relics, charts, bells, eggshell fragments, and ship logs can the player help him remember the whole story.\n\n---","sections":[{"id":"common-sailor-rumours","title":"Common Sailor Rumours","markdown":"- \"The Shattering was a war between sea gods.\"\n- \"The dragons burned the world and fled.\"\n- \"Atlantis tried to save us, but the surface kingdoms betrayed them.\"\n- \"Pirates cracked the world open looking for gold.\"\n- \"Something woke beneath the waves and swallowed the continents.\"\n- \"Jasper Barrow caused it. That's why his ghost still sails.\"","excerpt":"\"The Shattering was a war between sea gods.\" \"The dragons burned the world and fled.\" \"Atlantis tried to save us, but the surface kingdoms betrayed them.\" \"Pirates cracked the world open looking for gold.\" \"Something woke beneath the waves and swallowed the continents.\" \"Jasper Barrow caused it. That's why his ghost still sails.\"","bullets":["\"The Shattering was a war between sea gods.\"","\"The dragons burned the world and fled.\"","\"Atlantis tried to save us, but the surface kingdoms betrayed them.\"","\"Pirates cracked the world open looking for gold.\"","\"Something woke beneath the waves and swallowed the continents.\"","\"Jasper Barrow caused it. That's why his ghost still sails.\""]},{"id":"the-atlantean-version","title":"The Atlantean Version","markdown":"Atlantean loyalists blame the surface world. They say humans broke the old treaties, pirates slaughtered dragons carelessly, and Atlantis attempted a desperate ritual to restore order before the world collapsed.\n\nSome Atlanteans know this is a lie.\n\nOthers believe it completely.","excerpt":"Atlantean loyalists blame the surface world. They say humans broke the old treaties, pirates slaughtered dragons carelessly, and Atlantis attempted a desperate ritual to restore order before the world collapsed.","bullets":[]},{"id":"the-admiralty-version","title":"The Admiralty Version","markdown":"The remaining human authorities blame pirates, dragons, natural disaster, and old sea magic. They bury Cassian Barrow's role because admitting that the Lord-Cartographer of the Admiralty helped cause the apocalypse would destroy what little faith remains in naval law.","excerpt":"The remaining human authorities blame pirates, dragons, natural disaster, and old sea magic. They bury Cassian Barrow's role because admitting that the Lord-Cartographer of the Admiralty helped cause the apocalypse would destroy what little faith remains in naval law.","bullets":[]},{"id":"the-pirate-version","title":"The Pirate Version","markdown":"Pirates tell stories of the **Egg Rush**, when dragon eggs were worth more than kingdoms. Many do not understand that their predecessors helped end the world. Some treat it as a glorious age of plunder.","excerpt":"Pirates tell stories of the Egg Rush, when dragon eggs were worth more than kingdoms. Many do not understand that their predecessors helped end the world. Some treat it as a glorious age of plunder.","bullets":[]},{"id":"jaspers-version","title":"Jasper's Version","markdown":"Jasper remembers the truth, but not cleanly.\n\nHis memory is fractured by death, dragonfire, grief, and centuries of vengeance. When the player first meets him, he speaks in accusations, warnings, and half-remembered sorrow. Only by recovering relics, charts, bells, eggshell fragments, and ship logs can the player help him remember the whole story.\n\n---","excerpt":"Jasper remembers the truth, but not cleanly.","bullets":[]}]},{"id":"dragons-the-last-of-the-great-beasts","order":11,"title":"Dragons: The Last of the Great Beasts","category":"Dragons","excerpt":"Dragons once ruled the skies and volcanic isles of the Shattered Seas—ancient, proud, and few. In the First Age, they were not merely powerful creatures. They were living anchors of the world.","markdown":"**Dragons** once ruled the skies and volcanic isles of the Shattered Seas—ancient, proud, and few. In the First Age, they were not merely powerful creatures. They were living anchors of the world.\n\nWhere dragons nested, the world held steady. Their eggs carried elemental memory. Their migrations shaped wind, tide, storm, and volcanic pressure. Their songs warned of imbalance. Their absence is one reason the seas remain broken.\n\nThe cataclysm scattered their nesting grounds, destroyed countless clutches, and drove the survivors to the edges of the world. Now they are **nearly extinct**, hunted to the brink by those who covet their power.\n\
