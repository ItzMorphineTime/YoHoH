n### Why Dragons Matter\n\nDragons are not only rare beasts or powerful allies. They are part of the world's structure.\n\n- **Volcanic dragons** calm eruptions and regulate fire beneath the islands.\n- **Wind dragons** guide storms, trade winds, and migration paths.\n- **Frost dragons** steady northern currents and ice routes.\n- **Reef dragons** protect coral gates, island shelves, and hidden coves.\n- **Elder dragons** remember the covenants of the First Age.\n\nEvery dragon killed makes the world less stable.\n\nEvery egg saved is a small repair to the broken covenant of land, sea, and sky.\n\n### Why the Kings Hunt Dragons\n\n- **Dragon eggs** can be sold, broken, hatched, corrupted, or used to power forbidden rituals.\n- **Dragon scales and bone** fuel ancient magic, curses, relics, and weapons.\n- **A living dragon** is the ultimate symbol of dominance—or the ultimate rival to eliminate.\n- **Dragon sanctuaries** threaten the Pirate Kings because they restore balance outside King control.\n\nMost of the **Five Pirate Kings** hunt dragons relentlessly. They raid volcanic islands for eggs, ambush migrating dragons at sea, and pay bounties for any captain who delivers a dragon—dead or alive—to their strongholds. The few dragons that remain are scattered, hidden, or captured.\n\n### Your Mission: Rescue and Save the Dragons\n\nYou are not like the Kings. Your calling is to **rescue and save** the last of the great beasts—to find dragon eggs before hunters do, to free captured dragons from King strongholds, and to ferry them to **sanctuaries** where they can hatch and thrive in peace.\n\nAt first, this mission may seem like mercy.\n\nOver time, the player learns it is also survival.\n\nThe dragons are not separate from the fate of the world. Saving them may be the only way to prevent a Second Drowning.\n\nThis puts you in **direct opposition** to most of the Pirate Kings. They will hunt you as fiercely as they hunt dragons—unless you outsmart them, outfight them, or find unlikely allies among those who do not share their obsession.\n\n### Dragon Sanctuaries\n\nHidden islands and secret coves serve as **dragon sanctuaries**—places where rescued eggs can hatch and young dragons can grow without fear. Building, protecting, and supplying these sanctuaries is a core part of your mission.\n\nThe oldest sanctuaries may be protected by the dreams of Aurelion Veyr. Others are maintained by the **Tidewardens**, a secret network of lighthouse keepers, navigators, smugglers, healers, ex-Admiralty officers, old dragon priests, and sympathetic captains who move eggs under false cargo manifests.\n\nSome say the Ghost Captain himself has been known to aid those who share this cause.\n\n### Known Dragons of the Shattered Seas\n\nThe few dragons that remain are scattered across the seas. Each breed carries distinct traits—and each is hunted by the Kings who covet their power.\n\n| Dragon | Breed / Trait | Where Found |\n|--------|---------------|-------------|\n| **Blackfang** | Fire • Conquest • Trauma | Bound to Ebon Flameheart. The only dragon he allows to live. |\n| **Blaze** | Fire • Volcanic | Volcanic islands of the Ashen Reach. Eggs nest in lava vents. |\n| **Icey** | Frost • Northern | Frozen straits and iceberg caves. Rarely seen south of the ice line. |\n| **Speedy** | Wind • Swift | Coastal cliffs and storm-wracked isles. Fastest of the great beasts. |\n| **Elder** | Ancient • Wisdom | The oldest breed. Nest in ruins, hidden sanctuaries, and sunken temples. Nearly extinct. |\n| **Aurelion Veyr** | Elder • Dawn • Oath | The Last Dawn-Wing. Saviour of Jasper's soul. His fate is unknown. |\n\n**Young dragons**—hatchlings rescued from eggs or freed from captivity—grow into these forms. Baby Blaze, Baby Icey, Baby Speedy, and Baby Elder are among those you might save and ferry to sanctuary. Each one you rescue is a blow against the Kings who would see them destroyed.\n\n---","sections":[{"id":"why-dragons-matter","title":"Why Dragons Matter","markdown":"Dragons are not only rare beasts or powerful allies. They are part of the world's structure.\n\n- **Volcanic dragons** calm eruptions and regulate fire beneath the islands.\n- **Wind dragons** guide storms, trade winds, and migration paths.\n- **Frost dragons** steady northern currents and ice routes.\n- **Reef dragons** protect coral gates, island shelves, and hidden coves.\n- **Elder dragons** remember the covenants of the First Age.\n\nEvery dragon killed makes the world less stable.\n\nEvery egg saved is a small repair to the broken covenant of land, sea, and sky.","excerpt":"Dragons are not only rare beasts or powerful allies. They are part of the world's structure.","bullets":["**Volcanic dragons** calm eruptions and regulate fire beneath the islands.","**Wind dragons** guide storms, trade winds, and migration paths.","**Frost dragons** steady northern currents and ice routes.","**Reef dragons** protect coral gates, island shelves, and hidden coves.","**Elder dragons** remember the covenants of the First Age."]},{"id":"why-the-kings-hunt-dragons","title":"Why the Kings Hunt Dragons","markdown":"- **Dragon eggs** can be sold, broken, hatched, corrupted, or used to power forbidden rituals.\n- **Dragon scales and bone** fuel ancient magic, curses, relics, and weapons.\n- **A living dragon** is the ultimate symbol of dominance—or the ultimate rival to eliminate.\n- **Dragon sanctuaries** threaten the Pirate Kings because they restore balance outside King control.\n\nMost of the **Five Pirate Kings** hunt dragons relentlessly. They raid volcanic islands for eggs, ambush migrating dragons at sea, and pay bounties for any captain who delivers a dragon—dead or alive—to their strongholds. The few dragons that remain are scattered, hidden, or captured.","excerpt":"Most of the Five Pirate Kings hunt dragons relentlessly. They raid volcanic islands for eggs, ambush migrating dragons at sea, and pay bounties for any captain who delivers a dragon—dead or alive—to their strongholds. The few dragons that remain are scattered, hidden, or captured.","bullets":["**Dragon eggs** can be sold, broken, hatched, corrupted, or used to power forbidden rituals.","**Dragon scales and bone** fuel ancient magic, curses, relics, and weapons.","**A living dragon** is the ultimate symbol of dominance—or the ultimate rival to eliminate.","**Dragon sanctuaries** threaten the Pirate Kings because they restore balance outside King control."]},{"id":"your-mission-rescue-and-save-the-dragons","title":"Your Mission: Rescue and Save the Dragons","markdown":"You are not like the Kings. Your calling is to **rescue and save** the last of the great beasts—to find dragon eggs before hunters do, to free captured dragons from King strongholds, and to ferry them to **sanctuaries** where they can hatch and thrive in peace.\n\nAt first, this mission may seem like mercy.\n\nOver time, the player learns it is also survival.\n\nThe dragons are not separate from the fate of the world. Saving them may be the only way to prevent a Second Drowning.\n\nThis puts you in **direct opposition** to most of the Pirate Kings. They will hunt you as fiercely as they hunt dragons—unless you outsmart them, outfight them, or find unlikely allies among those who do not share their obsession.","excerpt":"You are not like the Kings. Your calling is to rescue and save the last of the great beasts—to find dragon eggs before hunters do, to free captured dragons from King strongholds, and to ferry them to sanctuaries where they can hatch and thrive in peace.","bullets":[]},{"id":"dragon-sanctuaries","title":"Dragon Sanctuaries","markdown":"Hidden islands and secret coves serve as **dragon sanctuaries**—places where rescued eggs can hatch and young dragons can grow without fear. Building, protecting, and supplying these sanctuaries is a core part of your mission.\n\nThe oldest sanctuaries may be protected by the dreams of Aurelion Veyr. Others are maintained by the **Tidewardens**, a secret network of lighthouse keepers, navigators, smugglers, healers, ex-Admiralty officers, old dragon priests, and sympathetic captains who move eggs under false cargo manifests.\n\nSome say the Ghost Captain himself has been known to aid those who share this cause.","excerpt":"Hidden islands and secret coves serve as dragon sanctuaries—places where rescued eggs can hatch and young dragons can grow without fear. Building, protecting, and supplying these sanctuaries is a core part of your mission.","bullets":[]},{"id":"known-dragons-of-the-shattered-seas","title":"Known Dragons of the Shattered Seas","markdown":"The few dragons that remain are scattered across the seas. Each breed carries distinct traits—and each is hunted by the Kings who covet their power.\n\n| Dragon | Breed / Trait | Where Found |\n|--------|---------------|-------------|\n| **Blackfang** | Fire • Conquest • Trauma | Bound to Ebon Flameheart. The only dragon he allows to live. |\n| **Blaze** | Fire • Volcanic | Volcanic islands of the Ashen Reach. Eggs nest in lava vents. |\n| **Icey** | Frost • Northern | Frozen straits and iceberg caves. Rarely seen south of the ice line. |\n| **Speedy** | Wind • Swift | Coastal cliffs and storm-wracked isles. Fastest of the great beasts. |\n| **Elder** | Ancient • Wisdom | The oldest breed. Nest in ruins, hidden sanctuaries, and sunken temples. Nearly extinct. |\n| **Aurelion Veyr** | Elder • Dawn • Oath | The Last Dawn-Wing. Saviour of Jasper's soul. His fate is unknown. |\n\n**Young dragons**—hatchlings rescued from eggs or freed from captivity—grow into these forms. Baby Blaze, Baby Icey, Baby Speedy, and Baby Elder are among those you might save and ferry to sanctuary. Each one you rescue is a blow against the Kings who would see them destroyed.\n\n---","excerpt":"The few dragons that remain are scattered across the seas. Each breed carries distinct traits—and each is hunted by the Kings who covet their power.","bullets":[]}]},{"id":"the-five-pirate-kings","order":12,"title":"The Five Pirate Kings","category":"Characters","excerpt":"The Five Pirate Kings are not merely powerful captains. Each one embodies a different wound left by the Sundering of the Three Crowns.","markdown":"The Five Pirate Kings are not merely powerful captains. Each one embodies a different wound left by the Sundering of the Three Crowns.\n\n| King | Ancient Power | Corrupted Idea | Domain |\n|------|---------------|----------------|--------|\n| **Jasper Barrow** | Oath / Justice | Vengeance without rest | Veilwake Sea |\n| **Mordekai Drakon** | Serpent survival | Dominion through fear | Coiled Expanse |\n| **Adara Thalassa** | Atlantean rule | Order through conquest | Drowned Crown |\n| **Nimue Tideborn** | Abyssal song | Communion through consumption | Black Spiral |\n| **Ebon Flameheart** | Dragonfire | Strength through destruction | Ashen Reach |\n\n---\n\n### 1. Jasper Barrow — The Ghost Captain of the Righteous Tide\n\n**Theme:** Curse • Justice • Ghosts • Vengeance  \n**Alignment:** Chaotic Good (Relentless, Unforgiving)  \n**Status:** Undead (Revenant / Reborn)  \n**Dragon Stance:** protects  \n**Image:** Images/PirateKings/JasperBarrow.png  \n**Familiar Image:** Images/Familiars/Gloomfeather.png  \n**Mythic Role:** The Witness • The First Drowned Oath • The Player's First Guide into Magic\n\n**Backstory**  \nOnce the youngest son of Admiral Cassian Barrow, Jasper was raised on honour, duty, and the belief that the Admiralty existed to protect the innocent. Though denied command for years by court politics and his father's shadow, he eventually earned his own ship, **The Righteous Tide**, and became known as a captain who protected small ports, civilian convoys, and weak crews rather than chasing conquest.\n\nHis downfall came when he uncovered his father's betrayal. Cassian Barrow, Lord-Cartographer of the Admiralty, had been selling sacred dragon nest charts to pirate lords on behalf of the Atlantean Pearl Synod. Those pirate lords raided dragon nests across the world and sold the eggs into the deep to fuel the Crown Below ritual.\n\nJasper confronted his father and threatened to expose the conspiracy. Cassian responded by framing him as the traitor. Jasper was lured into a storm by a false distress call and ambushed by pirate lords carrying Atlantean weapons and Barrow charts. His ship was sunk. His crew was slaughtered. His name was ruined.\n\nAs Jasper drowned, the Elder Dragon **Aurelion Veyr** sensed the depth of the betrayal and the purity of Jasper's soul. Aurelion dived into the storm sea and preserved Jasper's spirit. When the Crown Below ritual shattered the world, Aurelion bound Jasper's soul to the sea with dragonfire and oath-magic.\n\nDeath could not still his sense of justice.\n\nNow, Jasper hunts tyrants, pirate kings, corrupt rulers, and bullies—especially those who prey on weaker crews, islands, or dragons.\n\n**Public Reputation**  \nTo many sailors, Jasper is a curse in the fog. Merchants fear him because he sinks corrupt convoys. Pirates fear him because he appears when they prey on the weak. Admiralty officers hate him because he attacks ships carrying sealed orders from corrupt old bloodlines. Common sailors leave lanterns in fog to beg safe passage.\n\nDragon sanctuary keepers and Tidewardens call him **The Tidebound Saint**, though Jasper despises the title.\n\n**Dragons:** Jasper does **not** hunt dragons. He sees them as fellow victims of tyranny—hunted, betrayed, driven to the brink by the same conspiracy that destroyed his crew and broke the world. He has been known to aid captains who rescue dragons, guide lost eggs to sanctuary, and punish those who sell dragonkind for profit.\n\n**Relationship to the Player**  \nJasper should be the player's first direct contact with the supernatural. At first, he appears as a terrifying rumour: a ghost captain who judges ships in fog. Then he becomes a rescuer, a test, a reluctant mentor, and eventually the emotional key to the true history of the Shattered Seas.\n\nJasper can punish corruption.\n\nThe player can heal what corruption broke.\n\nThat distinction should define their relationship.\n\n**Familiar:** *Gloomfeather* — Spectral Parrot  \n- Debuffs enemies with fear, misfortune, and cursed luck  \n- Scouts invisibly through fog and darkness  \n- Mimics enemy voices to sow panic  \n- Repeats fragments of Jasper's lost memories at key lore sites  \n\n**Domain:** *The Veilwake Sea* — fog-choked waters where ghost ships drift silently  \n- His ghost fleet can ignore blockades  \n- Ports under his watch see reduced piracy… unless they're corrupt  \n- Broken oaths, hidden crimes, and blood-stained cargo may draw his attention  \n- Veilflame appears around wrecks connected to betrayal or dragon hunts  \n\n**Player Hooks**  \n- Appears to aid bullied or outmatched players mid-fight  \n- May spare or reward honorable crews  \n- Tests whether the player protects the weak or exploits them  \n- Guides rescued dragon eggs through impossible fog routes  \n- Can become a powerful ally… or a relentless enemy  \n\n**Suggested First Encounter: \"Ghost Lights in the Fog\"**  \nThe player is attacked early by a stronger pirate ship on what should be a safe route. As defeat nears, fog rolls in. Green-gold lights appear on the water. The enemy's cannon fire dies in the air. A spectral warship emerges.\n\nJasper cripples the attackers, boards as an apparition, and studies the player. If the player carries an eggshell fragment, dragon-scale charm, or suspicious cargo, he says:\n\n> \"You carry a piece of a crime older than your blood.\"\n\nThen he vanishes.\n\n---\n\n### 2. Captain Mordekai Drakon — The Sea Serpent King\n\n**Theme:** Curse • Serpents • Ancient Magic  \n**Alignment:** Lawful Evil  \n**Dragon Stance:** hunts  \n**Image:** Images/PirateKings/Captain_Mordekai_Drakon.png  \n**Familiar Image:** Images/Familiars/Ssyrix.png  \n**Mythic Role:** The Serpent Heir • The Rival Claimant to Draconic Power\n\n**Backstory**  \nMordekai was once a cabin boy aboard a doomed merchant vessel. When the ship was attacked by a colossal sea serpent, he discovered an ancient blade sealed within the hold. Slaying the beast bound its dying spirit to him.\n\nThe serpent spirit, **Ssyrix**, whispered that dragons had stolen the world's reverence while serpents were driven into the deep. It told him that the Drowning proved dragons were unworthy stewards and that only those who survive the abyss deserve dominion.\n\nOver time, the serpent's curse twisted Mordekai—granting power, longevity, and dominion over the deep, but slowly replacing his humanity. He now rules through fear and inevitability, believing the seas demand dominance, not mercy.\n\n**Dragons:** Mordekai **hunts dragons** relentlessly. Serpents and dragons are ancient rivals—both draconic, both claiming dominion over the world's primal forces. He consumes dragon scales and bone to feed Ssyrix and extend his own power. His lieutenants raid volcanic islands, ambush migrating dragons at sea, and seek old nest charts from the age of Cassian Barrow.\n\n**Familiar:** *Ssyrix* — The Bound Serpent Spirit  \n- Wraps ships, immobilizing them  \n- Inflicts stacking curses over time  \n- Can briefly possess Mordekai to amplify power  \n- Whispers ancient anti-dragon lore  \n\n**Domain:** *The Coiled Expanse* — waters marked by massive serpentine shapes beneath the waves  \n- Ships move slower  \n- Crew morale drains over time  \n- Serpent wakes can redirect routes  \n- Cursed offers appear after major victories  \n\n**Player Hooks**  \n- Hunts players who grow too powerful too quickly  \n- May offer cursed power in exchange for loyalty  \n- Tempts the player to trade dragon eggs for ship upgrades or serpent boons  \n- Slaying him risks releasing Ssyrix upon the world  \n\n---\n\n### 3. Lady Adara Thalassa — Queen of the Leviathans\n\n**Theme:** Atlantis • Leviathans • Ocean Sovereignty  \n**Alignment:** Neutral (Ruthlessly Pragmatic)  \n**Dragon Stance:** hunts  \n**Image:** Images/PirateKings/Lady_Adara_Thalassa.png  \n**Familiar Image:** Images/Familiars/Pearl.png  \n**Mythic Role:** The Heir of the Guilty Empire • The Temptation of Order\n\n**Backstory**  \nAdara was born to a sunken empire—one of the last true descendants of Atlantis. She grew up among coral ruins, drowned courts, broken tide-engines, and murals that told a polished version of the past: Atlantis as saviour, the surface as betrayer, and dragons as proud beasts who refused necessary sacrifice.\n\nWhen her people fell into factional ruin, Adara reclaimed their legacy by stealing the **Trident of the Tides**, an artifact granting command over leviathans.\n\nShe does not raid for gold. She conquers to rebuild a lost civilization beneath the sea. Islands that swear fealty are protected. Those that resist are erased.\n\nAdara does not think of herself as a pirate.\n\nShe considers the surface ports illegal squatters on Atlantean waters.\n\n**Dragons:** Adara **hunts dragons** as obstacles to her ocean sovereignty. Dragons are ancient, powerful, and refuse to bow—they threaten her claim to rule the seas. She captures eggs for Atlantean rituals and slays adult dragons that encroach on her domain. She believes the Crown Below failed because it was corrupted, rushed, or betrayed—not because Atlantis was wrong to attempt it.\n\nDelivering a dragon egg to her stronghold earns rare favor—and damns the dragon.\n\n**Familiar:** *Pearl* — Juvenile Leviathan  \n- Shields allies with tidal barriers  \n- Heals ships and structures  \n- Grows stronger the longer Adara reigns  \n- Can sense Atlantean relics and Crown Below fragments  \n\n**Domain:** *The Drowned Crown* — a semi-submerged kingdom of coral and ruins  \n- Can flood islands  \n- Controls trade routes via sea beasts  \n- Offers protection to ports that swear fealty  \n- Houses murals, archives, and ritual chambers tied to the true history of the Crown Below  \n\n**Player Hooks**  \n- Can become a powerful political ally  \n- Might task players with reclaiming Atlantean relics  \n- Offers lawful safety at the cost of freedom  \n- Open war with her reshapes the map  \n\n---\n\n### 4. Nimue Tideborn — The Kraken Caller\n\n**Theme:** Darkness • Abyss • Madness  \n**Alignment:** Chaotic Neutral  \n**Dragon Stance:** hunts  \n**Image:** Images/PirateKings/Nimue_Tideborn.png  \n**Familiar Image:** Images/Familiars/Inkshadow.png  \n**Mythic Role:** The Listener at the Wound • The Human Doorway into the Deep\n\n**Backstory**  \nOnce a fisher's daughter obsessed with legends, Nimue discovered an abyssal song etched into black stone. Singing it summoned not death—but a young Kraken. Instead of fleeing, she bonded with it.\n\nAs the Kraken grew, so did Nimue's power—and her distance from humanity. She no longer raids ports in any ordinary sense. She drags entire fleets into the dark to \"feed the deep.\"\n\nNimue's song may be older than Atlantis. Some scholars believe the failed Crown Below ritual woke something beneath the world, and that the Kraken is not merely a beast but a child, limb, or messenger of that deeper presence.\n\nNimue may not be conquering the sea.\n\nShe may be listening to it scream.\n\n**Dragons:** Nimue **hunts dragons** to feed the Kraken. Dragons are powerful prey—their essence sustains the deep and empowers her bond with the abyss. She sends her servants to lure dragons into the Black Spiral, where the Kraken drags them under. A dragon egg is a rare delicacy; a full-grown dragon, a feast.\n\n**Familiar:** *Inkshadow* — Living Shadow Octopus  \n- Creates zones of magical darkness  \n- Blinds and disorients enemies  \n- Can merge with the Kraken to empower it  \n- Carries fragments of abyssal song between wrecks  \n\n**Domain:** *The Black Spiral* — waters that absorb light and sound  \n- Visibility is severely reduced  \n- Sanity-testing environment  \n- Compass drift and false audio cues  \n- Ancient lore can sometimes resolve encounters that combat cannot  \n\n**Player Hooks**  \n- May ignore players entirely… until provoked  \n- Can be reasoned with via ancient lore  \n- May reveal hints about what woke beneath the Crown Below  \n- Killing the Kraken may break her mind—or free her  \n\n---\n\n### 5. Captain Ebon Flameheart — The Dragon Marauder\n\n**Theme:** Fire • Dragons • Conquest  \n**Alignment:** Chaotic Evil  \n**Dragon Stance:** hunts  \n**Image:** Images/PirateKings/Flameheart_01.png  \n**Familiar Image:** Images/Familiars/Ember.png  \n**Mythic Role:** The Modern Repetition of the First Sin • The False Dragon King\n\n**Backstory**  \nEbon was once a subordinate pirate, hungry for more. During a raid on a volcanic isle, he stole a dragon egg and survived long enough to hatch it. That dragon—**Blackfang**—made him a legend.\n\nEbon believes strength is the only truth. He conquers islands not to rule them, but to burn them into submission, forging a fleet of fear and fire.\n\nHe is the living proof that the original sin of the Shattered Seas did not end with Cassian Barrow or the Pearl Synod. Men are still stealing dragon futures and calling it destiny.\n\n**Dragons:** Ebon **hunts dragons** to eliminate all rivals. He has Blackfang—the only dragon that matters. Every other dragon is a threat: another captain could hatch an egg, another King could claim a beast, another free dragon could challenge his myth. He burns dragon nests, slaughters migrating dragons, and pays bounties for eggs delivered to him—so he can crush them himself.\n\nThere will be only one Dragon King.\n\n**Blackfang:** Ebon claims Blackfang is loyal. The truth is darker. Blackfang is bound by theft, trauma, rage, and domination magic. Ebon thinks he controls dragonfire, but he is sitting on a volcano he cannot command forever.\n\n**Familiar:** *Ember* — Fire Phoenix  \n- Revives after death  \n- Ignites ships and crews  \n- Buffs allies with flame-based rage  \n- Marks targets for Blackfang's fire  \n\n**Domain:** *The Ashen Reach* — scorched islands and burning seas  \n- Constant fire hazards  \n- Volcanic events during combat  \n- Refugee ports and burned markets  \n- Dragon hunter bounties are common  \n\n**Player Hooks**  \n- Ultimate test of naval combat skill  \n- Can trigger massive world events if unchecked  \n- Offers huge rewards for dragon eggs, then destroys them  \n- Slaying him may leave Blackfang unbound… and furious  \n\n---","sections":[{"id":"1-jasper-barrow-the-ghost-captain-of-the-righteous-tide","title":"1. Jasper Barrow — The Ghost Captain of the Righteous Tide","markdown":"**Theme:** Curse • Justice • Ghosts • Vengeance  \n**Alignment:** Chaotic Good (Relentless, Unforgiving)  \n**Status:** Undead (Revenant / Reborn)  \n**Dragon Stance:** protects  \n**Image:** Images/PirateKings/JasperBarrow.png  \n**Familiar Image:** Images/Familiars/Gloomfeather.png  \n**Mythic Role:** The Witness • The First Drowned Oath • The Player's First Guide into Magic\n\n**Backstory**  \nOnce the youngest son of Admiral Cassian Barrow, Jasper was raised on honour, duty, and the belief that the Admiralty existed to protect the innocent. Though denied command for years by court politics and his father's shadow, he eventually earned his own ship, **The Righteous Tide**, and became known as a captain who protected small ports, civilian convoys, and weak crews rather than chasing conquest.\n\nHis downfall came when he uncovered his father's betrayal. Cassian Barrow, Lord-Cartographer of the Admiralty, had been selling sacred dragon nest charts to pirate lords on behalf of the Atlantean Pearl Synod. Those pirate lords raided dragon nests across the world and sold the eggs into the deep to fuel the Crown Below ritual.\n\nJasper confronted his father and threatened to expose the conspiracy. Cassian responded by framing him as the traitor. Jasper was lured into a storm by a false distress call and ambushed by pirate lords carrying Atlantean weapons and Barrow charts. His ship was sunk. His crew was slaughtered. His name was ruined.\n\nAs Jasper drowned, the Elder Dragon **Aurelion Veyr** sensed the depth of the betrayal and the purity of Jasper's soul. Aurelion dived into the storm sea and preserved Jasper's spirit. When the Crown Below ritual shattered the world, Aurelion bound Jasper's soul to the sea with dragonfire and oath-magic.\n\nDeath could not still his sense of justice.\n\nNow, Jasper hunts tyrants, pirate kings, corrupt rulers, and bullies—especially those who prey on weaker crews, islands, or dragons.\n\n**Public Reputation**  \nTo many sailors, Jasper is a curse in the fog. Merchants fear him because he sinks corrupt convoys. Pirates fear him because he appears when they prey on the weak. Admiralty officers hate him because he attacks ships carrying sealed orders from corrupt old bloodlines. Common sailors leave lanterns in fog to beg safe passage.\n\nDragon sanctuary keepers and Tidewardens call him **The Tidebound Saint**, though Jasper despises the title.\n\n**Dragons:** Jasper does **not** hunt dragons. He sees them as fellow victims of tyranny—hunted, betrayed, driven to the brink by the same conspiracy that destroyed his crew and broke the world. He has been known to aid captains who rescue dragons, guide lost eggs to sanctuary, and punish those who sell dragonkind for profit.\n\n**Relationship to the Player**  \nJasper should be the player's first direct contact with the supernatural. At first, he appears as a terrifying rumour: a ghost captain who judges ships in fog. Then he becomes a rescuer, a test, a reluctant mentor, and eventually the emotional key to the true history of the Shattered Seas.\n\nJasper can punish corruption.\n\nThe player can heal what corruption broke.\n\nThat distinction should define their relationship.\n\n**Familiar:** *Gloomfeather* — Spectral Parrot  \n- Debuffs enemies with fear, misfortune, and cursed luck  \n- Scouts invisibly through fog and darkness  \n- Mimics enemy voices to sow panic  \n- Repeats fragments of Jasper's lost memories at key lore sites  \n\n**Domain:** *The Veilwake Sea* — fog-choked waters where ghost ships drift silently  \n- His ghost fleet can ignore blockades  \n- Ports under his watch see reduced piracy… unless they're corrupt  \n- Broken oaths, hidden crimes, and blood-stained cargo may draw his attention  \n- Veilflame appears around wrecks connected to betrayal or dragon hunts  \n\n**Player Hooks**  \n- Appears to aid bullied or outmatched players mid-fight  \n- May spare or reward honorable crews  \n- Tests whether the player protects the weak or exploits them  \n- Guides rescued dragon eggs through impossible fog routes  \n- Can become a powerful ally… or a relentless enemy  \n\n**Suggested First Encounter: \"Ghost Lights in the Fog\"**  \nThe player is attacked early by a stronger pirate ship on what should be a safe route. As defeat nears, fog rolls in. Green-gold lights appear on the water. The enemy's cannon fire dies in the air. A spectral warship emerges.\n\nJasper cripples the attackers, boards as an apparition, and studies the player. If the player carries an eggshell fragment, dragon-scale charm, or suspicious cargo, he says:\n\n> \"You carry a piece of a crime older than your blood.\"\n\nThen he vanishes.\n\n---","excerpt":"Theme: Curse • Justice • Ghosts • Vengeance Alignment: Chaotic Good (Relentless, Unforgiving) Status: Undead (Revenant / Reborn) Dragon Stance: protects Image: Images/PirateKings/JasperBarrow.png Familiar Image: Images/Familiars/Gloomfeather.png Mythic Role: The Witness • The First Drowned Oath • The Player's First Guide into Magic","bullets":["Debuffs enemies with fear, misfortune, and cursed luck","Scouts invisibly through fog and darkness","Mimics enemy voices to sow panic","Repeats fragments of Jasper's lost memories at key lore sites","His ghost fleet can ignore blockades","Ports under his watch see reduced piracy… unless they're corrupt","Broken oaths, hidden crimes, and blood-stai the Kraken drags them under. A dragon egg is a rare delicacy; a full-grown dragon, a feast.\n\n**Familiar:** *Inkshadow* — Living Shadow Octopus  \n- Creates zones of magical darkness  \n- Blinds and disorients enemies  \n- Can merge with the Kraken to empower it  \n- Carries fragments of abyssal song between wrecks  \n\n**Domain:** *The Black Spiral* — waters that absorb light and sound  \n- Visibility is severely reduced  \n- Sanity-testing environment  \n- Compass drift and false audio cues  \n- Ancient lore can sometimes resolve encounters that combat cannot  \n\n**Player Hooks**  \n- May ignore players entirely… until provoked  \n- Can be reasoned with via ancient lore  \n- May reveal hints about what woke beneath the Crown Below  \n- Killing the Kraken may break her mind—or free her  \n\n---","excerpt":"Theme: Darkness • Abyss • Madness Alignment: Chaotic Neutral Dragon Stance: hunts Image: Images/PirateKings/Nimue_Tideborn.png Familiar Image: Images/Familiars/Inkshadow.png Mythic Role: The Listener at the Wound • The Human Doorway into the Deep","bullets":["Creates zones of magical darkness","Blinds and disorients enemies","Can merge with the Kraken to empower it","Carries fragments of abyssal song between wrecks","Visibility is severely reduced","Sanity-testing environment","Compass drift and false audio cues","Ancient lore can sometimes resolve encounters that combat cannot","May ignore players entirely… until provoked","Can be reasoned with via ancient lore","May reveal hints about what woke beneath the Crown Below","Killing the Kraken may break her mind—or free her"]},{"id":"5-captain-ebon-flameheart-the-dragon-marauder","title":"5. Captain Ebon Flameheart — The Dragon Marauder","markdown":"**Theme:** Fire • Dragons • Conquest  \n**Alignment:** Chaotic Evil  \n**Dragon Stance:** hunts  \n**Image:** Images/PirateKings/Flameheart_01.png  \n**Familiar Image:** Images/Familiars/Ember.png  \n**Mythic Role:** The Modern Repetition of the First Sin • The False Dragon King\n\n**Backstory**  \nEbon was once a subordinate pirate, hungry for more. During a raid on a volcanic isle, he stole a dragon egg and survived long enough to hatch it. That dragon—**Blackfang**—made him a legend.\n\nEbon believes strength is the only truth. He conquers islands not to rule them, but to burn them into submission, forging a fleet of fear and fire.\n\nHe is the living proof that the original sin of the Shattered Seas did not end with Cassian Barrow or the Pearl Synod. Men are still stealing dragon futures and calling it destiny.\n\n**Dragons:** Ebon **hunts dragons** to eliminate all rivals. He has Blackfang—the only dragon that matters. Every other dragon is a threat: another captain could hatch an egg, another King could claim a beast, another free dragon could challenge his myth. He burns dragon nests, slaughters migrating dragons, and pays bounties for eggs delivered to him—so he can crush them himself.\n\nThere will be only one Dragon King.\n\n**Blackfang:** Ebon claims Blackfang is loyal. The truth is darker. Blackfang is bound by theft, trauma, rage, and domination magic. Ebon thinks he controls dragonfire, but he is sitting on a volcano he cannot command forever.\n\n**Familiar:** *Ember* — Fire Phoenix  \n- Revives after death  \n- Ignites ships and crews  \n- Buffs allies with flame-based rage  \n- Marks targets for Blackfang's fire  \n\n**Domain:** *The Ashen Reach* — scorched islands and burning seas  \n- Constant fire hazards  \n- Volcanic events during combat  \n- Refugee ports and burned markets  \n- Dragon hunter bounties are common  \n\n**Player Hooks**  \n- Ultimate test of naval combat skill  \n- Can trigger massive world events if unchecked  \n- Offers huge rewards for dragon eggs, then destroys them  \n- Slaying him may leave Blackfang unbound… and furious  \n\n---","excerpt":"Theme: Fire • Dragons • Conquest Alignment: Chaotic Evil Dragon Stance: hunts Image: Images/PirateKings/Flameheart_01.png Familiar Image: Images/Familiars/Ember.png Mythic Role: The Modern Repetition of the First Sin • The False Dragon King","bullets":["Revives after death","Ignites ships and crews","Buffs allies with flame-based rage","Marks targets for Blackfang's fire","Constant fire hazards","Volcanic events during combat","Refugee ports and burned markets","Dragon hunter bounties are common","Ultimate test of naval combat skill","Can trigger massive world events if unchecked","Offers huge rewards for dragon eggs, then destroys them","Slaying him may leave Blackfang unbound… and furious"]}]},{"id":"the-archipelago-your-place-in-it","order":13,"title":"The Archipelago & Your Place in It","category":"World","excerpt":"The inner archipelago—where you begin—is the last bastion of order. Ports here pay lip service to distant crowns, but in practice they answer to merchants, guilds, lighthouse keepers, and whoever keeps the peace. This is where new captains earn their stripes: trading goods, taking contracts, hiring crew, and building infamy.","markdown":"### Home Waters\n\nThe **inner archipelago**—where you begin—is the last bastion of order. Ports here pay lip service to distant crowns, but in practice they answer to merchants, guilds, lighthouse keepers, and whoever keeps the peace. This is where new captains earn their stripes: trading goods, taking contracts, hiring crew, and building infamy.\n\nThe Home Waters should feel bright, readable, and adventurous at first. The deeper lore appears as fragments: old dragon symbols on cargo crates, tavern rumours about ghost lights, a lighthouse keeper who refuses to sail through fog, or a merchant who panics when the player finds an eggshell fragment.\n\nPossible Home Waters locations:\n- **Port Mercy** — starter port, market, shipwright, and basic contracts.\n- **Lantern Cay** — lighthouse island and rumour hub.\n- **Saltmarket** — trade hub with competing merchant guilds.\n- **The Old Rookery** — abandoned dragon nesting cliffs and possible first egg discovery.\n- **Greywake Shoals** — early wreck salvage site tied to Jasper's false treason.\n\n### The Outer Seas\n\nBeyond the safe routes, the map grows strange. **Route modifiers** reflect the influence of the Kings:\n\n- **Fog** — Veilwake Sea (Jasper's domain)\n- **Serpent marks** — Coiled Expanse (Mordekai)\n- **Coral ruins, tidal currents** — Drowned Crown (Adara)\n- **Darkness, abyssal waters** — Black Spiral (Nimue)\n- **Ash, volcanic vents** — Ashen Reach (Ebon)\n\nThe Outer Seas are not only more dangerous. They are closer to the wound left by the Crown Below. Routes shift, compasses lie, old charts become unreliable, and the supernatural becomes harder to dismiss.\n\n### Pirate King Strongholds\n\nEach King maintains **strongholds** in their domain. Defeating a **Lieutenant**—a trusted captain who serves a King—reveals the coordinates of that King's stronghold. Raiding a stronghold is the ultimate challenge: unique loot, legendary encounters, and—for those who dare—**rescued dragons** held in captivity.\n\nStrongholds should also reveal lore. Each one contains a different piece of the truth:\n- Jasper's domain reveals betrayal, oath, and lost Admiralty records.\n- Mordekai's domain reveals serpent myths and anti-dragon resentment.\n- Adara's domain reveals Atlantean murals, Crown Below fragments, and Pearl Synod doctrine.\n- Nimue's domain reveals abyssal songs and hints of what woke beneath the waves.\n- Ebon's domain reveals modern dragon theft and the danger of repeating the First Age's crime.\n\n### Dragon Sanctuaries\n\nHidden islands and secret coves serve as **dragon sanctuaries**—places where rescued eggs can hatch and young dragons can grow in peace. Finding, building, and protecting these sanctuaries is central to your mission. Some lie in the Home Waters; others require venturing into the outer seas.\n\nThe sanctuaries are supported by the **Tidewardens**, a secret network of lighthouse keepers, smugglers, healers, old navigators, ex-Admiralty officers, and dragon-sympathizers.\n\nTheir motto:\n\n> **\"No crown owns the sky. No king owns the sea.\"**\n\n### The Tidewardens\n\nThe Tidewardens are not a formal nation. They are a hidden rescue network. They move dragon eggs under false cargo manifests, mark safe routes with lighthouse codes, shelter hunted crews, and preserve fragments of the true history.\n\nThey are ideal quest-givers for:\n- dragon egg delivery contracts,\n- sanctuary supply runs,\n- rescue missions,\n- hidden route unlocks,\n- lore hunts,\n- reputation rewards.\n\nSome Tidewardens revere Jasper. Others fear him. All know that when the fog glows green-gold, someone nearby is being judged.\n\n---","sections":[{"id":"home-waters","title":"Home Waters","markdown":"The **inner archipelago**—where you begin—is the last bastion of order. Ports here pay lip service to distant crowns, but in practice they answer to merchants, guilds, lighthouse keepers, and whoever keeps the peace. This is where new captains earn their stripes: trading goods, taking contracts, hiring crew, and building infamy.\n\nThe Home Waters should feel bright, readable, and adventurous at first. The deeper lore appears as fragments: old dragon symbols on cargo crates, tavern rumours about ghost lights, a lighthouse keeper who refuses to sail through fog, or a merchant who panics when the player finds an eggshell fragment.\n\nPossible Home Waters locations:\n- **Port Mercy** — starter port, market, shipwright, and basic contracts.\n- **Lantern Cay** — lighthouse island and rumour hub.\n- **Saltmarket** — trade hub with competing merchant guilds.\n- **The Old Rookery** — abandoned dragon nesting cliffs and possible first egg discovery.\n- **Greywake Shoals** — early wreck salvage site tied to Jasper's false treason.","excerpt":"The inner archipelago—where you begin—is the last bastion of order. Ports here pay lip service to distant crowns, but in practice they answer to merchants, guilds, lighthouse keepers, and whoever keeps the peace. This is where new captains earn their stripes: trading goods, taking contracts, hiring crew, and building infamy.","bullets":["**Port Mercy** — starter port, market, shipwright, and basic contracts.","**Lantern Cay** — lighthouse island and rumour hub.","**Saltmarket** — trade hub with competing merchant guilds.","**The Old Rookery** — abandoned dragon nesting cliffs and possible first egg discovery.","**Greywake Shoals** — early wreck salvage site tied to Jasper's false treason."]},{"id":"the-outer-seas","title":"The Outer Seas","markdown":"Beyond the safe routes, the map grows strange. **Route modifiers** reflect the influence of the Kings:\n\n- **Fog** — Veilwake Sea (Jasper's domain)\n- **Serpent marks** — Coiled Expanse (Mordekai)\n- **Coral ruins, tidal currents** — Drowned Crown (Adara)\n- **Darkness, abyssal waters** — Black Spiral (Nimue)\n- **Ash, volcanic vents** — Ashen Reach (Ebon)\n\nThe Outer Seas are not only more dangerous. They are closer to the wound left by the Crown Below. Routes shift, compasses lie, old charts become unreliable, and the supernatural becomes harder to dismiss.","excerpt":"Beyond the safe routes, the map grows strange. Route modifiers reflect the influence of the Kings:","bullets":["**Fog** — Veilwake Sea (Jasper's domain)","**Serpent marks** — Coiled Expanse (Mordekai)","**Coral ruins, tidal currents** — Drowned Crown (Adara)","**Darkness, abyssal waters** — Black Spiral (Nimue)","**Ash, volcanic vents** — Ashen Reach (Ebon)"]},{"id":"pirate-king-strongholds","title":"Pirate King Strongholds","markdown":"Each King maintains **strongholds** in their domain. Defeating a **Lieutenant**—a trusted captain who serves a King—reveals the coordinates of that King's stronghold. Raiding a stronghold is the ultimate challenge: unique loot, legendary encounters, and—for those who dare—**rescued dragons** held in captivity.\n\nStrongholds should also reveal lore. Each one contains a different piece of the truth:\n- Jasper's domain reveals betrayal, oath, and lost Admiralty records.\n- Mordekai's domain reveals serpent myths and anti-dragon resentment.\n- Adara's domain reveals Atlantean murals, Crown Below fragments, and Pearl Synod doctrine.\n- Nimue's domain reveals abyssal songs and hints of what woke beneath the waves.\n- Ebon's domain reveals modern dragon theft and the danger of repeating the First Age's crime.","excerpt":"Each King maintains strongholds in their domain. Defeating a Lieutenant—a trusted captain who serves a King—reveals the coordinates of that King's stronghold. Raiding a stronghold is the ultimate challenge: unique loot, legendary encounters, and—for those who dare—rescued dragons held in captivity.","bullets":["Jasper's domain reveals betrayal, oath, and lost Admiralty records.","Mordekai's domain reveals serpent myths and anti-dragon resentment.","Adara's domain reveals Atlantean murals, Crown Below fragments, and Pearl Synod doctrine.","Nimue's domain reveals abyssal songs and hints of what woke beneath the waves.","Ebon's domain reveals modern dragon theft and the danger of repeating the First Age's crime."]},{"id":"dragon-sanctuaries","title":"Dragon Sanctuaries","markdown":"Hidden islands and secret coves serve as **dragon sanctuaries**—places where rescued eggs can hatch and young dragons can grow in peace. Finding, building, and protecting these sanctuaries is central to your mission. Some lie in the Home Waters; others require venturing into the outer seas.\n\nThe sanctuaries are supported by the **Tidewardens**, a secret network of lighthouse keepers, smugglers, healers, old navigators, ex-Admiralty officers, and dragon-sympathizers.\n\nTheir motto:\n\n> **\"No crown owns the sky. No king owns the sea.\"**","excerpt":"Hidden islands and secret coves serve as dragon sanctuaries—places where rescued eggs can hatch and young dragons can grow in peace. Finding, building, and protecting these sanctuaries is central to your mission. Some lie in the Home Waters; others require venturing into the outer seas.","bullets":[]},{"id":"the-tidewardens","title":"The Tidewardens","markdown":"The Tidewardens are not a formal nation. They are a hidden rescue network. They move dragon eggs under false cargo manifests, mark safe routes with lighthouse codes, shelter hunted crews, and preserve fragments of the true history.\n\nThey are ideal quest-givers for:\n- dragon egg delivery contracts,\n- sanctuary supply runs,\n- rescue missions,\n- hidden route unlocks,\n- lore hunts,\n- reputation rewards.\n\nSome Tidewardens revere Jasper. Others fear him. All know that when the fog glows green-gold, someone nearby is being judged.\n\n---","excerpt":"The Tidewardens are not a formal nation. They are a hidden rescue network. They move dragon eggs under false cargo manifests, mark safe routes with lighthouse codes, shelter hunted crews, and preserve fragments of the true history.","bullets":["dragon egg delivery contracts,","sanctuary supply runs,","rescue missions,","hidden route unlocks,","lore hunts,","reputation rewards."]}]},{"id":"tone-narrative-beats","order":14,"title":"Tone & Narrative Beats","category":"World","excerpt":"Tone: Adventurous, slightly comedic, readable fantasy piracy—with darker undertones when the Kings are involved.","markdown":"**Tone:** Adventurous, slightly comedic, readable fantasy piracy—with darker undertones when the Kings are involved.\n\nThe world should feel like **fun pirate adventure on the surface, wounded myth underneath**.\n\nThe player should be able to enjoy tavern rumours, cargo runs, eccentric crew traits, ship upgrades, broadside combat, and boss fights without needing a lore lecture. But the farther they sail, the more they discover that the economy, monsters, dragons, and Pirate Kings are all symptoms of the same ancient wound.\n\n### Your Story\n\nYou are a new captain climbing the ranks in the Home Waters. At first, your goals are practical: make profit, hire crew, upgrade your ship, and survive.\n\nThen you encounter something that should not exist.\n\nGhost lights in the fog.\n\nA dragon egg hidden in ordinary cargo.\n\nA chart marked with a symbol older than the Admiralty.\n\nA spectral captain who knows your cargo before you do.\n\nFrom there, your secret mission begins: **rescue and save the last of the dragons**. The Five Pirate Kings hunt them relentlessly; you defy them by finding eggs before hunters do, freeing captured dragons from strongholds, and ferrying them to sanctuaries where they can thrive.\n\nThe Shattered Seas offer profit, danger, and legend—but your true calling is to protect what the Kings would destroy.\n\nDefeat lieutenants, uncover stronghold locations, recover the truth of the Crown Below, and decide: will you serve a King, defy them, or carve your own path—and save the dragons before the world drowns again?\n\n---","sections":[{"id":"your-story","title":"Your Story","markdown":"You are a new captain climbing the ranks in the Home Waters. At first, your goals are practical: make profit, hire crew, upgrade your ship, and survive.\n\nThen you encounter something that should not exist.\n\nGhost lights in the fog.\n\nA dragon egg hidden in ordinary cargo.\n\nA chart marked with a symbol older than the Admiralty.\n\nA spectral captain who knows your cargo before you do.\n\nFrom there, your secret mission begins: **rescue and save the last of the dragons**. The Five Pirate Kings hunt them relentlessly; you defy them by finding eggs before hunters do, freeing captured dragons from strongholds, and ferrying them to sanctuaries where they can thrive.\n\nThe Shattered Seas offer profit, danger, and legend—but your true calling is to protect what the Kings would destroy.\n\nDefeat lieutenants, uncover stronghold locations, recover the truth of the Crown Below, and decide: will you serve a King, defy them, or carve your own path—and save the dragons before the world drowns again?\n\n---","excerpt":"You are a new captain climbing the ranks in the Home Waters. At first, your goals are practical: make profit, hire crew, upgrade your ship, and survive.","bullets":[]}]},{"id":"player-facing-lore-reveal-structure","order":15,"title":"Player-Facing Lore Reveal Structure","category":"Myth","excerpt":"The truth of the Shattered Seas should unfold in layers rather than exposition dumps.","markdown":"The truth of the Shattered Seas should unfold in layers rather than exposition dumps.\n\n### Layer 1 — Rumour\n\nThe player hears contradictory explanations for the Shattering in taverns, markets, ports, and crew chatter.\n\nExample lines:\n- \"My gran said the sea rose in one night. Took three kingdoms before breakfast.\"\n- \"Was dragons, I heard. Wings of fire from horizon to horizon.\"\n- \"Nah. Atlantis did it. Dug too deep, sang too loud.\"\n- \"Don't say Barrow's name in fog. He hears.\"\n\n### Layer 2 — Evidence\n\nThe player finds physical clues:\n- old Admiralty charts with dragon nest markings,\n- pirate ledgers listing \"warm pearls\" or \"sky eggs,\"\n- Atlantean coin in surface wrecks,\n- eggshell fragments inside ritual crates,\n- lighthouse records showing Jasper was framed,\n- a broken Barrow family seal on a pirate contract.\n\n### Layer 3 — Jasper's Memory\n\nJasper appears after key discoveries. He does not explain everything immediately. He reacts emotionally.\n\nAt first:\n> \"That mark. I watched men die beneath that seal.\"\n\nLater:\n> \"Those charts were never stolen. They were given.\"\n\nFinally:\n> \"My father sold the sky to the sea, and called it order.\"\n\n### Layer 4 — Atlantean Confirmation\n\nIn Adara's domain, the player finds Atlantean murals, ritual chambers, and living witnesses who tell a different version. Some are ashamed. Others are proud. This should complicate the truth: Atlantis was guilty, but not every Atlantean was evil.\n\n### Layer 5 — The Crown Below\n\nLate in the campaign, the player sees the ruined engine itself or a projection of it. Only then does the full myth become undeniable: the world was not broken by accident, and the same forces could break it again.\n\n---","sections":[{"id":"layer-1-rumour","title":"Layer 1 — Rumour","markdown":"The player hears contradictory explanations for the Shattering in taverns, markets, ports, and crew chatter.\n\nExample lines:\n- \"My gran said the sea rose in one night. Took three kingdoms before breakfast.\"\n- \"Was dragons, I heard. Wings of fire from horizon to horizon.\"\n- \"Nah. Atlantis did it. Dug too deep, sang too loud.\"\n- \"Don't say Barrow's name in fog. He hears.\"","excerpt":"The player hears contradictory explanations for the Shattering in taverns, markets, ports, and crew chatter.","bullets":["\"My gran said the sea rose in one night. Took three kingdoms before breakfast.\"","\"Was dragons, I heard. Wings of fire from horizon to horizon.\"","\"Nah. Atlantis did it. Dug too deep, sang too loud.\"","\"Don't say Barrow's name in fog. He hears.\""]},{"id":"layer-2-evidence","title":"Layer 2 — Evidence","markdown":"The player finds physical clues:\n- old Admiralty charts with dragon nest markings,\n- pirate ledgers listing \"warm pearls\" or \"sky eggs,\"\n- Atlantean coin in surface wrecks,\n- eggshell fragments inside ritual crates,\n- lighthouse records showing Jasper was framed,\n- a broken Barrow family seal on a pirate contract.","excerpt":"The player finds physical clues: old Admiralty charts with dragon nest markings, pirate ledgers listing \"warm pearls\" or \"sky eggs,\" Atlantean coin in surface wrecks, eggshell fragments inside ritual crates, lighthouse records showing Jasper was framed, a broken Barrow family seal on a pirate contract.","bullets":["old Admiralty charts with dragon nest markings,","pirate ledgers listing \"warm pearls\" or \"sky eggs,\"","Atlantean coin in surface wrecks,","eggshell fragments inside ritual crates,","lighthouse records showing Jasper was framed,","a broken Barrow family seal on a pirate contract."]},{"id":"layer-3-jaspers-memory","title":"Layer 3 — Jasper's Memory","markdown":"Jasper appears after key discoveries. He does not explain everything immediately. He reacts emotionally.\n\nAt first:\n> \"That mark. I watched men die beneath that seal.\"\n\nLater:\n> \"Those charts were never stolen. They were given.\"\n\nFinally:\n> \"My father sold the sky to the sea, and called it order.\"","excerpt":"Jasper appears after key discoveries. He does not explain everything immediately. He reacts emotionally.","bullets":[]},{"id":"layer-4-atlantean-confirmation","title":"Layer 4 — Atlantean Confirmation","markdown":"In Adara's domain, the player finds Atlantean murals, ritual chambers, and living witnesses who tell a different version. Some are ashamed. Others are proud. This should complicate the truth: Atlantis was guilty, but not every Atlantean was evil.","excerpt":"In Adara's domain, the player finds Atlantean murals, ritual chambers, and living witnesses who tell a different version. Some are ashamed. Others are proud. This should complicate the truth: Atlantis was guilty, but not every Atlantean was evil.","bullets":[]},{"id":"layer-5-the-crown-below","title":"Layer 5 — The Crown Below","markdown":"Late in the campaign, the player sees the ruined engine itself or a projection of it. Only then does the full myth become undeniable: the world was not broken by accident, and the same forces could break it again.\n\n---","excerpt":"Late in the campaign, the player sees the ruined engine itself or a projection of it. Only then does the full myth become undeniable: the world was not broken by accident, and the same forces could break it again.","bullets":[]}]},{"id":"suggested-jasper-questline","order":16,"title":"Suggested Jasper Questline","category":"Myth","excerpt":"The player is saved by Jasper during an unfair pirate ambush.","markdown":"### Quest 1: Ghost Lights in the Fog\n\nThe player is saved by Jasper during an unfair pirate ambush.\n\n**Purpose:** Introduce magic, ghost ships, moral judgment, and Jasper as terrifying protector rather than simple villain.\n\n### Quest 2: The Traitor's Bell\n\nA port asks the player to recover a bell from a wreck believed to belong to Jasper's \"traitor ship.\" The bell is from **The Righteous Tide**. When returned, it rings by itself in fog.\n\n**Purpose:** Establish that Jasper's public reputation may be false.\n\n### Quest 3: Charts Written in Blood\n\nThe player finds an old Admiralty chart showing dragon nests. It bears Cassian Barrow's seal. Jasper becomes hostile at first, believing the player may be another egg-runner.\n\n**Purpose:** Reveal Cassian's betrayal and connect dragon hunts to the Admiralty.\n\n### Quest 4: The Last Clutch of Emberfall\n\nThe player rescues their first dragon egg from pirates using one of Cassian's old charts. Jasper guides the player through fog to a hidden sanctuary route.\n\n**Purpose:** Make the player a true Sanctuary Runner.\n\n### Quest 5: The Father's Name\n\nThe player uncovers evidence that Cassian Barrow framed Jasper.\n\nPossible objectives:\n- find Admiralty court records,\n- intercept a sealed naval archive,\n- recover a pirate confession,\n- explore a ruined Barrow estate.\n\n**Purpose:** Clear Jasper's name emotionally, even if the world never fully believes it.\n\n### Quest 6: Aurelion's Dive\n\nThe player discovers the memory of the Elder Dragon who saved Jasper. This could happen through a dragon sanctuary, a dream sequence, or a golden scale that reacts to Jasper's Veilflame.\n\n**Purpose:** Reveal that Jasper was not cursed by evil magic; he was bound by a dragon oath.\n\n### Quest 7: The Crown Below\n\nThe player learns that the ritual still pulses beneath the world. Jasper asks the player not only to avenge the past, but to prevent its repetition.\n\n**Purpose:** Turn the campaign from \"rescue dragons\" into \"stop the Second Drowning.\"\n\n---","sections":[{"id":"quest-1-ghost-lights-in-the-fog","title":"Quest 1: Ghost Lights in the Fog","markdown":"The player is saved by Jasper during an unfair pirate ambush.\n\n**Purpose:** Introduce magic, ghost ships, moral judgment, and Jasper as terrifying protector rather than simple villain.","excerpt":"The player is saved by Jasper during an unfair pirate ambush.","bullets":[]},{"id":"quest-2-the-traitors-bell","title":"Quest 2: The Traitor's Bell","markdown":"A port asks the player to recover a bell from a wreck believed to belong to Jasper's \"traitor ship.\" The bell is from **The Righteous Tide**. When returned, it rings by itself in fog.\n\n**Purpose:** Establish that Jasper's public reputation may be false.","excerpt":"A port asks the player to recover a bell from a wreck believed to belong to Jasper's \"traitor ship.\" The bell is from The Righteous Tide. When returned, it rings by itself in fog.","bullets":[]},{"id":"quest-3-charts-written-in-blood","title":"Quest 3: Charts Written in Blood","markdown":"The player finds an old Admiralty chart showing dragon nests. It bears Cassian Barrow's seal. Jasper becomes hostile at first, believing the player may be another egg-runner.\n\n**Purpose:** Reveal Cassian's betrayal and connect dragon hunts to the Admiralty.","excerpt":"The player finds an old Admiralty chart showing dragon nests. It bears Cassian Barrow's seal. Jasper becomes hostile at first, believing the player may be another egg-runner.","bullets":[]},{"id":"quest-4-the-last-clutch-of-emberfall","title":"Quest 4: The Last Clutch of Emberfall","markdown":"The player rescues their first dragon egg from pirates using one of Cassian's old charts. Jasper guides the player through fog to a hidden sanctuary route.\n\n**Purpose:** Make the player a true Sanctuary Runner.","excerpt":"The player rescues their first dragon egg from pirates using one of Cassian's old charts. Jasper guides the player through fog to a hidden sanctuary route.","bullets":[]},{"id":"quest-5-the-fathers-name","title":"Quest 5: The Father's Name","markdown":"The player uncovers evidence that Cassian Barrow framed Jasper.\n\nPossible objectives:\n- find Admiralty court records,\n- intercept a sealed naval archive,\n- recover a pirate confession,\n- explore a ruined Barrow estate.\n\n**Purpose:** Clear Jasper's name emotionally, even if the world never fully believes it.","excerpt":"The player uncovers evidence that Cassian Barrow framed Jasper.","bullets":["find Admiralty court records,","intercept a sealed naval archive,","recover a pirate confession,","explore a ruined Barrow estate."]},{"id":"quest-6-aurelions-dive","title":"Quest 6: Aurelion's Dive","markdown":"The player discovers the memory of the Elder Dragon who saved Jasper. This could happen through a dragon sanctuary, a dream sequence, or a golden scale that reacts to Jasper's Veilflame.\n\n**Purpose:** Reveal that Jasper was not cursed by evil magic; he was bound by a dragon oath.","excerpt":"The player discovers the memory of the Elder Dragon who saved Jasper. This could happen through a dragon sanctuary, a dream sequence, or a golden scale that reacts to Jasper's Veilflame.","bullets":[]},{"id":"quest-7-the-crown-below","title":"Quest 7: The Crown Below","markdown":"The player learns that the ritual still pulses beneath the world. Jasper asks the player not only to avenge the past, but to prevent its repetition.\n\n**Purpose:** Turn the campaign from \"rescue dragons\" into \"stop the Second Drowning.\"\n\n---","excerpt":"The player learns that the ritual still pulses beneath the world. Jasper asks the player not only to avenge the past, but to prevent its repetition.","bullets":[]}]},{"id":"appendix-domain-map-conceptual","order":17,"title":"Appendix: Domain Map (Conceptual)","category":"Appendix","excerpt":"Domain King Waters / Hazards Dragon Stance Mythic Function ------------------ ------------------- ------------------------------- -------------------- ----------------- Veilwake Sea Jasper Barrow Fog, ghost ships, blockades Protects Oath, truth, justice Coiled Expanse Mordekai Drakon Serpents, slow waters, morale Hunts (rivalry) Serpent dominion Drowned Crown Adara Thalassa Coral, ruins, leviathans Hunts (sovereignty) Atlantean ambition Black Spiral Nimue Tideborn Darkness, Kraken, madness Hunts (feeds deep) Abyssal hunger Ashen Reach Ebon Flameheart Fire, volcanoes, dragons Hunts (eliminates rivals) Repeated dragon theft ---","markdown":"| Domain           | King              | Waters / Hazards              | Dragon Stance       | Mythic Function |\n|------------------|-------------------|-------------------------------|--------------------|-----------------|\n| Veilwake Sea     | Jasper Barrow     | Fog, ghost ships, blockades   | **Protects**       | Oath, truth, justice |\n| Coiled Expanse   | Mordekai Drakon   | Serpents, slow waters, morale | Hunts (rivalry)    | Serpent dominion |\n| Drowned Crown    | Adara Thalassa    | Coral, ruins, leviathans      | Hunts (sovereignty)| Atlantean ambition |\n| Black Spiral     | Nimue Tideborn    | Darkness, Kraken, madness     | Hunts (feeds deep) | Abyssal hunger |\n| Ashen Reach      | Ebon Flameheart   | Fire, volcanoes, dragons      | Hunts (eliminates rivals) | Repeated dragon theft |\n\n---","sections":[]},{"id":"appendix-key-terms","order":18,"title":"Appendix: Key Terms","category":"Appendix","excerpt":"Term Meaning ------ --------- The First Age The golden era when humans, Atlanteans, and dragons maintained balance. The Three Crowns The sacred charges of Land, Sea, and Sky. The Pearl Synod Atlantean ruling faction that built the Crown Below. The Crown Below Atlantean ritual engine meant to bind land, sea, and sky under ocean rule. The Shattering / The Drowning The cataclysm caused by the failed Crown Below ritual. Cassian Barrow Jasper's father, Lord-Cartographer of the Admiralty, traitor to the First Age. Jasper Barrow Ghost Captain, betrayed son, guardian of the innocent, protector of dragons. Aurelion Veyr Elder Dragon known as the Last Dawn-Wing, who preserved Jasper's soul. Veilflame Ghostly dragonfire created where betrayal, oath, seawater, and justice meet. Tidewardens Secret network that rescues dragon eggs and maintains hidden sanctuaries. Dawnrest Possible oldest dragon sanctuary and rumoured resting place of Aurelion Veyr. Second Drowning The feared future catastrophe if the Crown Below is awakened or overfed again. ---","markdown":"| Term | Meaning |\n|------|---------|\n| **The First Age** | The golden era when humans, Atlanteans, and dragons maintained balance. |\n| **The Three Crowns** | The sacred charges of Land, Sea, and Sky. |\n| **The Pearl Synod** | Atlantean ruling faction that built the Crown Below. |\n| **The Crown Below** | Atlantean ritual engine meant to bind land, sea, and sky under ocean rule. |\n| **The Shattering / The Drowning** | The cataclysm caused by the failed Crown Below ritual. |\n| **Cassian Barrow** | Jasper's father, Lord-Cartographer of the Admiralty, traitor to the First Age. |\n| **Jasper Barrow** | Ghost Captain, betrayed son, guardian of the innocent, protector of dragons. |\n| **Aurelion Veyr** | Elder Dragon known as the Last Dawn-Wing, who preserved Jasper's soul. |\n| **Veilflame** | Ghostly dragonfire created where betrayal, oath, seawater, and justice meet. |\n| **Tidewardens** | Secret network that rescues dragon eggs and maintains hidden sanctuaries. |\n| **Dawnrest** | Possible oldest dragon sanctuary and rumoured resting place of Aurelion Veyr. |\n| **Second Drowning** | The feared future catastrophe if the Crown Below is awakened or overfed again. |\n\n---","sections":[]},{"id":"appendix-internal-truth-summary","order":19,"title":"Appendix: Internal Truth Summary","category":"Appendix","excerpt":"This is the true version of the myth for writer/designer reference:","markdown":"This is the true version of the myth for writer/designer reference:\n\n> In the First Age, humans of the land, Atlanteans of the sea, and dragons of the sky kept the world in balance. The Atlanteans, resentful of their dependence on surface maps and dragon migration, built the Crown Below, a ritual engine meant to bind all realms under ocean rule.\n>\n> Because Atlanteans could not walk the land, they bribed Admiral Cassian Barrow, keeper of the Admiralty's forbidden dragon charts. Cassian gave those charts to pirate lords, who raided nests across the world and sold the eggs into the deep.\n>\n> Jasper Barrow discovered his father's betrayal and confronted him. Rather than repent, Cassian framed his son as the traitor and lured him into a storm, where pirate lords sank his ship.\n>\n> As Jasper drowned, an Elder Dragon named Aurelion Veyr sensed both the betrayal and the purity of Jasper's soul. Aurelion dived into the sea and preserved Jasper's spirit.\n>\n> When the Atlanteans performed the Crown Below ritual, the stolen dragon eggs shattered the balance of land, sea, and sky. Atlantis drowned, the continents broke, the dragons vanished, and the Shattered Seas were born.\n>\n> In the chaos, Aurelion bound Jasper's soul to the sea as a revenant guardian: a ghost captain sworn to protect the innocent, punish corruption, and guide the last dragons to sanctuary.\n>\n> The world remembers only rumours.\n>\n> Jasper remembers the truth.","sections":[]}]},"dragons":{"title":"Dragons: The Last of the Great Beasts","body":"**Dragons** once ruled the skies and volcanic isles of the Shattered Seas—ancient, proud, and few. In the First Age, they were not merely powerful creatures. They were living anchors of the world.\n\nWhere dragons nested, the world held steady. Their eggs carried elemental memory. Their migrations shaped wind, tide, storm, and volcanic pressure. Their songs warned of imbalance. Their absence is one reason the seas remain broken.\n\nThe cataclysm scattered their nesting grounds, destroyed countless clutches, and drove the survivors to the edges of the world. Now they are **nearly extinct**, hunted to the brink by those who covet their power.\n\nDragons are not only rare beasts or powerful allies. They are part of the world's structure.\n\nEvery dragon killed makes the world less stable.\n\nEvery egg saved is a small repair to the broken covenant of land, sea, and sky.\n\nMost of the **Five Pirate Kings** hunt dragons relentlessly. They raid volcanic islands for eggs, ambush migrating dragons at sea, and pay bounties for any captain who delivers a dragon—dead or alive—to their strongholds. The few dragons that remain are scattered, hidden, or captured.\n\nYou are not like the Kings. Your calling is to **rescue and save** the last of the great beasts—to find dragon eggs before hunters do, to free captured dragons from King strongholds, and to ferry them to **sanctuaries** where they can hatch and thrive in peace.\n\nAt first, this mission may seem like mercy.\n\nOver time, the player learns it is also survival.\n\nThe dragons are not separate from the fate of the world. Saving them may be the only way to prevent a Second Drowning.\n\nThis puts you in **direct opposition** to most of the Pirate Kings. They will hunt you as fiercely as they hunt dragons—unless you outsmart them, outfight them, or find unlikely allies among those who do not share their obsession.\n\nHidden islands and secret coves serve as **dragon sanctuaries**—places where rescued eggs can hatch and young dragons can grow without fear. Building, protecting, and supplying these sanctuaries is a core part of your mission.\n\nThe oldest sanctuaries may be protected by the dreams of Aurelion Veyr. Others are maintained by the **Tidewardens**, a secret network of lighthouse keepers, navigators, smugglers, healers, ex-Admiralty officers, old dragon priests, and sympathetic captains who move eggs under false cargo manifests.\n\nSome say the Ghost Captain himself has been known to aid those who share this cause.\n\nThe few dragons that remain are scattered across the seas. Each breed carries distinct traits—and each is hunted by the Kings who covet their power.\n\n**Young dragons**—hatchlings rescued from eggs or freed from captivity—grow into these forms. Baby Blaze, Baby Icey, Baby Speedy, and Baby Elder are among those you might save and ferry to sanctuary. Each one you rescue is a blow against the Kings who would see them destroyed.","known":[{"name":"Blackfang","breed":"Fire • Conquest • Trauma","whereFound":"Bound to Ebon Flameheart. The only dragon he allows to live."},{"name":"Blaze","breed":"Fire • Volcanic","whereFound":"Volcanic islands of the Ashen Reach. Eggs nest in lava vents."},{"name":"Icey","breed":"Frost • Northern","whereFound":"Frozen straits and iceberg caves. Rarely seen south of the ice line."},{"name":"Speedy","breed":"Wind • Swift","whereFound":"Coastal cliffs and storm-wracked isles. Fastest of the great beasts."},{"name":"Elder","breed":"Ancient • Wisdom","whereFound":"The oldest breed. Nest in ruins, hidden sanctuaries, and sunken temples. Nearly extinct."},{"name":"Aurelion Veyr","breed":"Elder • Dawn • Oath","whereFound":"The Last Dawn-Wing. Saviour of Jasper's soul. His fate is unknown."}]},"pirateKings":[{"id":"jasper","order":1,"name":"Jasper Barrow","title":"The Ghost Captain of the Righteous Tide","image":"Images/PirateKings/JasperBarrow.png","theme":"Curse • Justice • Ghosts • Vengeance","alignment":"Chaotic Good (Relentless, Unforgiving)","status":"Undead (Revenant / Reborn)","mythicRole":"The Witness • The First Drowned Oath • The Player's First Guide into Magic","dragonStance":"protects","backstory":"Once the youngest son of Admiral Cassian Barrow, Jasper was raised on honour, duty, and the belief that the Admiralty existed to protect the innocent. Though denied command for years by court politics and his father's shadow, he eventually earned his own ship, **The Righteous Tide**, and became known as a captain who protected small ports, civilian convoys, and weak crews rather than chasing conquest.\n\nHis downfall came when he uncovered his father's betrayal. Cassian Barrow, Lord-Cartographer of the Admiralty, had been selling sacred dragon nest charts to pirate lords on behalf of the Atlantean Pearl Synod. Those pirate lords raided dragon nests across the world and sold the eggs into the deep to fuel the Crown Below ritual.\n\nJasper confronted his father and threatened to expose the conspiracy. Cassian responded by framing him as the traitor. Jasper was lured into a storm by a false distress call and ambushed by pirate lords carrying Atlantean weapons and Barrow charts. His ship was sunk. His crew was slaughtered. His name was ruined.\n\nAs Jasper drowned, the Elder Dragon **Aurelion Veyr** sensed the depth of the betrayal and the purity of Jasper's soul. Aurelion dived into the storm sea and preserved Jasper's spirit. When the Crown Below ritual shattered the world, Aurelion bound Jasper's soul to the sea with dragonfire and oath-magic.\n\nDeath could not still his sense of justice.\n\nNow, Jasper hunts tyrants, pirate kings, corrupt rulers, and bullies—especially those who prey on weaker crews, islands, or dragons.\n\n**Public Reputation**  \nTo many sailors, Jasper is a curse in the fog. Merchants fear him because he sinks corrupt convoys. Pirates fear him because he appears when they prey on the weak. Admiralty officers hate him because he attacks ships carrying sealed orders from corrupt old bloodlines. Common sailors leave lanterns in fog to beg safe passage.\n\nDragon sanctuary keepers and Tidewardens call him **The Tidebound Saint**, though Jasper despises the title.","dragons":"Jasper does **not** hunt dragons. He sees them as fellow victims of tyranny—hunted, betrayed, driven to the brink by the same conspiracy that destroyed his crew and broke the world. He has been known to aid captains who rescue dragons, guide lost eggs to sanctuary, and punish those who sell dragonkind for profit.","relationshipToPlayer":"Jasper should be the player's first direct contact with the supernatural. At first, he appears as a terrifying rumour: a ghost captain who judges ships in fog. Then he becomes a rescuer, a test, a reluctant mentor, and eventually the emotional key to the true history of the Shattered Seas.\n\nJasper can punish corruption.\n\nThe player can heal what corruption broke.\n\nThat distinction should define their relationship.","familiar":{"name":"Gloomfeather","type":"Spectral Parrot","image":"Images/Familiars/Gloomfeather.png","abilities":["Debuffs enemies with fear, misfortune, and cursed luck","Scouts invisibly through fog and darkness","Mimics enemy voices to sow panic","Repeats fragments of Jasper's lost memories at key lore sites"]},"domain":{"name":"The Veilwake Sea","desc":"fog-choked waters where ghost ships drift silently","effects":["His ghost fleet can ignore blockades","Ports under his watch see reduced piracy… unless they're corrupt","Broken oaths, hidden crimes, and blood-stained cargo may draw his attention","Veilflame appears around wrecks connected to betrayal or dragon hunts"]},"playerHooks":["Appears to aid bullied or outmatched players mid-fight","May spare or reward honorable crews","Tests whether the player protects the weak or exploits them","Guides rescued dragon eggs through impossible fog routes","Can become a powerful ally… or a relentless enemy"]},{"id":"mordekai","order":2,"name":"Captain Mordekai Drakon","title":"The Sea Serpent King","image":"Images/PirateKings/Captain_Mordekai_Drakon.png","theme":"Curse • Serpents • Ancient Magic","alignment":"Lawful Evil","status":"","mythicRole":"The Serpent Heir • The Rival Claimant to Draconic Power","dragonStance":"hunts","backstory":"Mordekai was once a cabin boy aboard a doomed merchant vessel. When the ship was attacked by a colossal sea serpent, he discovered an ancient blade sealed within the hold. Slaying the beast bound its dying spirit to him.\n\nThe serpent spirit, **Ssyrix**, whispered that dragons had stolen the world's reverence while serpents were driven into the deep. It told him that the Drowning proved dragons were unworthy stewards and that only those who survive the abyss deserve dominion.\n\nOver time, the serpent's curse twisted Mordekai—granting power, longevity, and dominion over the deep, but slowly replacing his humanity. He now rules through fear and inevitability, believing the seas demand dominance, not mercy.","dragons":"Mordekai **hunts dragons** relentlessly. Serpents and dragons are ancient rivals—both draconic, both claiming dominion over the world's primal forces. He consumes dragon scales and bone to feed Ssyrix and extend his own power. His lieutenants raid volcanic islands, ambush migrating dragons at sea, and seek old nest charts from the age of Cassian Barrow.","relationshipToPlayer":"","familiar":{"name":"Ssyrix","type":"The Bound Serpent Spirit","image":"Images/Familiars/Ssyrix.png","abilities":["Wraps ships, immobilizing them","Inflicts stacking curses over time","Can briefly possess Mordekai to amplify power","Whispers ancient anti-dragon lore"]},"domain":{"name":"The Coiled Expanse","desc":"waters marked by massive serpentine shapes beneath the waves","effects":["Ships move slower","Crew morale drains over time","Serpent wakes can redirect routes","Cursed offers appear after major victories"]},"playerHooks":["Hunts players who grow too powerful too quickly","May offer cursed power in exchange for loyalty","Tempts the player to trade dragon eggs for ship upgrades or serpent boons","Slaying him risks releasing Ssyrix upon the world"]},{"id":"adara","order":3,"name":"Lady Adara Thalassa","title":"Queen of the Leviathans","image":"Images/PirateKings/Lady_Adara_Thalassa.png","theme":"Atlantis • Leviathans • Ocean Sovereignty","alignment":"Neutral (Ruthlessly Pragmatic)","status":"","mythicRole":"The Heir of the Guilty Empire • The Temptation of Order","dragonStance":"hunts","backstory":"Adara was born to a sunken empire—one of the last true descendants of Atlantis. She grew up among coral ruins, drowned courts, broken tide-engines, and murals that told a polished version of the past: Atlantis as saviour, the surface as betrayer, and dragons as proud beasts who refused necessary sacrifice.\n\nWhen her people fell into factional ruin, Adara reclaimed their legacy by stealing the **Trident of the Tides**, an artifact granting command over leviathans.\n\nShe does not raid for gold. She conquers to rebuild a lost civilization beneath the sea. Islands that swear fealty are protected. Those that resist are erased.\n\nAdara does not think of herself as a pirate.\n\nShe considers the surface ports illegal squatters on Atlantean waters.","dragons":"Adara **hunts dragons** as obstacles to her ocean sovereignty. Dragons are ancient, powerful, and refuse to bow—they threaten her claim to rule the seas. She captures eggs for Atlantean rituals and slays adult dragons that encroach on her domain. She believes the Crown Below failed because it was corrupted, rushed, or betrayed—not because Atlantis was wrong to attempt it.\n\nDelivering a dragon egg to her stronghold earns rare favor—and damns the dragon.","relationshipToPlayer":"","familiar":{"name":"Pearl","type":"Juvenile Leviathan","image":"Images/Familiars/Pearl.png","abilities":["Shields allies with tidal barriers","Heals ships and structures","Grows stronger the longer Adara reigns","Can sense Atlantean relics and Crown Below fragments"]},"domain":{"name":"The Drowned Crown","desc":"a semi-submerged kingdom of coral and ruins","effects":["Can flood islands","Controls trade routes via sea beasts","Offers protection to ports that swear fealty","Houses murals, archives, and ritual chambers tied to the true history of the Crown Below"]},"playerHooks":["Can become a powerful political ally","Might task players with reclaiming Atlantean relics","Offers lawful safety at the cost of freedom","Open war with her reshapes the map"]},{"id":"nimue","order":4,"name":"Nimue Tideborn","title":"The Kraken Caller","image":"Images/PirateKings/Nimue_Tideborn.png","theme":"Darkness • Abyss • Madness","alignment":"Chaotic Neutral","status":"","mythicRole":"The Listener at the Wound • The Human Doorway into the Deep","dragonStance":"hunts","backstory":"Once a fisher's daughter obsessed with legends, Nimue discovered an abyssal song etched into black stone. Singing it summoned not death—but a young Kraken. Instead of fleeing, she bonded with it.\n\nAs the Kraken grew, so did Nimue's power—and her distance from humanity. She no longer raids ports in any ordinary sense. She drags entire fleets into the dark to \"feed the deep.\"\n\nNimue's song may be older than Atlantis. Some scholars believe the failed Crown Below ritual woke something beneath the world, and that the Kraken is not merely a beast but a child, limb, or messenger of that deeper presence.\n\nNimue may not be conquering the sea.\n\nShe may be listening to it scream.","dragons":"Nimue **hunts dragons** to feed the Kraken. Dragons are powerful prey—their essence sustains the deep and empowers her bond with the abyss. She sends her servants to lure dragons into the Black Spiral, where the Kraken drags them under. A dragon egg is a rare delicacy; a full-grown dragon, a feast.","relationshipToPlayer":"","familiar":{"name":"Inkshadow","type":"Living Shadow Octopus","image":"Images/Familiars/Inkshadow.png","abilities":["Creates zones of magical darkness","Blinds and disorients enemies","Can merge with the Kraken to empower it","Carries fragments of abyssal song between wrecks"]},"domain":{"name":"The Black Spiral","desc":"waters that absorb light and sound","effects":["Visibility is severely reduced","Sanity-testing environment","Compass drift and false audio cues","Ancient lore can sometimes resolve encounters that combat cannot"]},"playerHooks":["May ignore players entirely… until provoked","Can be reasoned with via ancient lore","May reveal hints about what woke beneath the Crown Below","Killing the Kraken may break her mind—or free her"]},{"id":"ebon","order":5,"name":"Captain Ebon Flameheart","title":"The Dragon Marauder","ima
