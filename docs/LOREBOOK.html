  <script>window.LORE_DATA={"meta":{"title":"The Shattered Seas — World Lore & Backstory","tagline":"The old empires drowned. The seas broke. Five crowns rose from the wreckage—and none of them bow to any king on land.","source":"LORE.md","generatedAt":"2026-05-22T22:21:37.467Z"},"world":{"title":"The Shattered Seas","body":"The **Shattered Seas** are what remains of a once-balanced world. To most sailors, the truth of its ruin is lost beneath rumour, superstition, propaganda, and salt.\n\nCenturies ago, a cataclysm—some say a war between gods, others a volcanic chain reaction, still others whisper of something that *woke* beneath the waves—shattered the continental shelves and drowned the great coastal empires. What survived was an archipelago of scattered islands, treacherous straits, haunted routes, and waters that no longer obey the old charts.\n\nToday, the seas are ruled by **trade, rumour, and fear**. The inner archipelago—the **Home Waters**—remains relatively safe: established ports, merchant guilds, lighthouse keepers, and the last vestiges of naval authority. But beyond the safe routes lie the **Outer Seas**, where the **Five Pirate Kings** hold dominion. Each King commands a domain shaped by their curse, their ambition, their trauma, or their obsession. Sailors who venture too far may never return—or return changed.\n\nThe world did not become this way in a single moment. Its history is remembered in ages:\n\nThe player enters the Shattered Seas hearing only fragments:\n\nAll of these stories contain a shard of truth.\n\nNone of them are the whole truth.","rumours":["That the gods fought and cracked the world.","That a chain of volcanoes erupted and swallowed the continents.","That dragons burned the skies and fled.","That Atlantis tried to save the world and was betrayed.","That pirates dug too greedily into forbidden places.","That something ancient woke beneath the waves.","That the ghost captain Jasper Barrow caused it all.","That Ebon Flameheart once saved trade and gave glory back to pirates."],"agesTable":"| Age | Common Name | Dominant Power | What It Means |\n|-----|-------------|----------------|---------------|\n| **First Age** | The Age of Three Crowns | Humans, Atlanteans, Dragons | Balance between Land, Sea, and Sky |\n| **Cataclysm** | The Shattering / The Drowning | None | The Crown Below breaks the old world |\n| **Second Age** | The Age of the Drowned Crown | Atlanteans | Atlantis dominates the flooded world |\n| **Collapse Event** | The Unbinding Tide | Sea Serpents, Krakens, Deep Beasts | The deep rebels against Atlantean rule |\n| **Third Age** | The Age of Free Sails | Pirates, Merchants, Free Captains | Trade returns and pirate glory rises |\n| **Current Age** | The Age of Five Crowns / Broken Tides | The Pirate Kings | Five powers divide the seas while dragons near extinction |"},"ages":[{"age":"First Age","label":"The Age of Three Crowns","power":"Humans, Atlanteans, Dragons","summary":"Balance between Land, Sea, and Sky","key":"first-age","shortKey":"first"},{"age":"Cataclysm","label":"The Shattering / The Drowning","power":"None","summary":"The Crown Below breaks the old world","key":"cataclysm","shortKey":"cataclysm"},{"age":"Second Age","label":"The Age of the Drowned Crown","power":"Atlanteans","summary":"Atlantis dominates the flooded world","key":"second-age","shortKey":"second"},{"age":"Collapse Event","label":"The Unbinding Tide","power":"Sea Serpents, Krakens, Deep Beasts","summary":"The deep rebels against Atlantean rule","key":"collapse-event","shortKey":"collapse"},{"age":"Third Age","label":"The Age of Free Sails","power":"Pirates, Merchants, Free Captains","summary":"Trade returns and pirate glory rises","key":"third-age","shortKey":"third"},{"age":"Current Age","label":"The Age of Five Crowns / Broken Tides","power":"The Pirate Kings","summary":"Five powers divide the seas while dragons near extinction","key":"current-age","shortKey":"current"}],"storyLore":{"title":"The Sundering of the Three Crowns","subtitle":"The hidden truth beneath every rumour in the Shattered Seas","sections":[{"id":"story-lore-the-sundering-of-the-three-crowns","title":"Story / Lore: The Sundering of the Three Crowns","summary":"*Copied from Tidewarden fragments, Atlantean mural translations, surviving Admiralty logs, dragon sanctuary oral histories, and the testimony of sailors who claim to have seen green-gold fire in the fog.*","markdown":"> *Copied from Tidewarden fragments, Atlantean mural translations, surviving Admiralty logs, dragon sanctuary oral histories, and the testimony of sailors who claim to have seen green-gold fire in the fog.*\n\nBefore the Shattered Seas, there was a golden age remembered only in fragments: **The First Age of the Three Crowns**.\n\nThe \"crowns\" were not merely royal titles. They were sacred charges: three realms, three peoples, and three duties that kept the world whole.\n\n### The Crown of Land\n\nThe humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.\n\nTheir charge was **stewardship of the land**.\n\nThey built the lighthouse chains, maintained the ports, grew the food, forged the cannons, and charted the safe roads between mountain, jungle, desert, and coast. Their admiralties guarded trade routes and kept sacred charts that marked not only reefs and storms, but the hidden places where dragons nested.\n\n### The Crown of Sea\n\nThe Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, tide-forges, and libraries sung into living shell.\n\nTheir charge was **stewardship of the sea**.\n\nAtlanteans could not live long upon dry land. Their skin dried, their lungs burned, and their magic weakened away from saltwater. For this reason, they relied on treaties, surface envoys, and human navigators to understand the continents above. They knew the deep better than any surface kingdom, but the mountains, volcanoes, high cliffs, and inland dragon rookeries were beyond their reach.\n\n### The Crown of Sky\n\nThe dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.\n\nTheir charge was **stewardship of the sky**.\n\nThe dragons did not own the world. They anchored it.\n\nWhere dragons nested, the world was stable. Volcanoes slept. Storms followed seasons. Oceans respected their shores. Magic flowed in cycles rather than floods. Each clutch was more than a generation of dragons; it was a promise between land, sea, and sky.\n\n### The First Age\n\nIn the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.\n\nHumans traded surface goods to Atlantis: timber, iron, fruit, spices, cloth, stories, and maps. Atlanteans traded sea-gifts to humans: pearls, medicines, current-charts, coral glass, tide charms, and leviathan-safe passages. Dragons rarely traded, but they gave warnings. A dragon circling a harbour might mean storm. A dragon vanishing from a mountain might mean eruption. A clutch abandoned before hatching was considered a prophecy of disaster.\n\nThis age was prosperous because no one power could rule all three realms.\n\nHumans could not command the deep.\n\nAtlanteans could not walk the land.\n\nDragons would not kneel to either.\n\nThat limitation was the source of peace.\n\nThen Atlantis grew ashamed of needing others.\n\n---","body":"> *Copied from Tidewarden fragments, Atlantean mural translations, surviving Admiralty logs, dragon sanctuary oral histories, and the testimony of sailors who claim to have seen green-gold fire in the fog.*\n\nBefore the Shattered Seas, there was a golden age remembered only in fragments: **The First Age of the Three Crowns**.\n\nThe \"crowns\" were not merely royal titles. They were sacred charges: three realms, three peoples, and three duties that kept the world whole.\n\n### The Crown of Land\n\nThe humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.\n\nTheir charge was **stewardship of the land**.\n\nThey built the lighthouse chains, maintained the ports, grew the food, forged the cannons, and charted the safe roads between mountain, jungle, desert, and coast. Their admiralties guarded trade routes and kept sacred charts that marked not only reefs and storms, but the hidden places where dragons nested.\n\n### The Crown of Sea\n\nThe Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, tide-forges, and libraries sung into living shell.\n\nTheir charge was **stewardship of the sea**.\n\nAtlanteans could not live long upon dry land. Their skin dried, their lungs burned, and their magic weakened away from saltwater. For this reason, they relied on treaties, surface envoys, and human navigators to understand the continents above. They knew the deep better than any surface kingdom, but the mountains, volcanoes, high cliffs, and inland dragon rookeries were beyond their reach.\n\n### The Crown of Sky\n\nThe dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.\n\nTheir charge was **stewardship of the sky**.\n\nThe dragons did not own the world. They anchored it.\n\nWhere dragons nested, the world was stable. Volcanoes slept. Storms followed seasons. Oceans respected their shores. Magic flowed in cycles rather than floods. Each clutch was more than a generation of dragons; it was a promise between land, sea, and sky.\n\n### The First Age\n\nIn the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.\n\nHumans traded surface goods to Atlantis: timber, iron, fruit, spices, cloth, stories, and maps. Atlanteans traded sea-gifts to humans: pearls, medicines, current-charts, coral glass, tide charms, and leviathan-safe passages. Dragons rarely traded, but they gave warnings. A dragon circling a harbour might mean storm. A dragon vanishing from a mountain might mean eruption. A clutch abandoned before hatching was considered a prophecy of disaster.\n\nThis age was prosperous because no one power could rule all three realms.\n\nHumans could not command the deep.\n\nAtlanteans could not walk the land.\n\nDragons would not kneel to either.\n\nThat limitation was the source of peace.\n\nThen Atlantis grew ashamed of needing others.\n\n---","sections":[{"id":"the-crown-of-land","title":"The Crown of Land","markdown":"The humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.\n\nTheir charge was **stewardship of the land**.\n\nThey built the lighthouse chains, maintained the ports, grew the food, forged the cannons, and charted the safe roads between mountain, jungle, desert, and coast. Their admiralties guarded trade routes and kept sacred charts that marked not only reefs and storms, but the hidden places where dragons nested.","excerpt":"The humans of the great continents built cities, farms, harbours, roads, libraries, and navies. They were mortal, ambitious, inventive, and numerous. They did not command the oldest magic, but they had memory, law, craft, courage, and the will to cross any horizon.","bullets":[]},{"id":"the-crown-of-sea","title":"The Crown of Sea","markdown":"The Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, tide-forges, and libraries sung into living shell.\n\nTheir charge was **stewardship of the sea**.\n\nAtlanteans could not live long upon dry land. Their skin dried, their lungs burned, and their magic weakened away from saltwater. For this reason, they relied on treaties, surface envoys, and human navigators to understand the continents above. They knew the deep better than any surface kingdom, but the mountains, volcanoes, high cliffs, and inland dragon rookeries were beyond their reach.","excerpt":"The Atlanteans ruled beneath the waves. They were not merely humans who lived underwater, but an ancient ocean-born people adapted to pressure, current, song, and tide. They built coral palaces, pearl engines, glass domes, leviathan gates, tide-forges, and libraries sung into living shell.","bullets":[]},{"id":"the-crown-of-sky","title":"The Crown of Sky","markdown":"The dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.\n\nTheir charge was **stewardship of the sky**.\n\nThe dragons did not own the world. They anchored it.\n\nWhere dragons nested, the world was stable. Volcanoes slept. Storms followed seasons. Oceans respected their shores. Magic flowed in cycles rather than floods. Each clutch was more than a generation of dragons; it was a promise between land, sea, and sky.","excerpt":"The dragons ruled neither as kings nor conquerors. They were ancient sovereign creatures who nested in volcanoes, storm peaks, cliff-rookeries, floating isles, jungle calderas, frozen ridges, and hidden ruins. Their migrations shaped winds. Their songs steadied storms. Their eggs carried old elemental memory.","bullets":[]},{"id":"the-first-age","title":"The First Age","markdown":"In the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.\n\nHumans traded surface goods to Atlantis: timber, iron, fruit, spices, cloth, stories, and maps. Atlanteans traded sea-gifts to humans: pearls, medicines, current-charts, coral glass, tide charms, and leviathan-safe passages. Dragons rarely traded, but they gave warnings. A dragon circling a harbour might mean storm. A dragon vanishing from a mountain might mean eruption. A clutch abandoned before hatching was considered a prophecy of disaster.\n\nThis age was prosperous because no one power could rule all three realms.\n\nHumans could not command the deep.\n\nAtlanteans could not walk the land.\n\nDragons would not kneel to either.\n\nThat limitation was the source of peace.\n\nThen Atlantis grew ashamed of needing others.\n\n---","excerpt":"In the First Age, humanity, Atlantis, and dragonkind were not always friends, but they understood balance.","bullets":[]}]},{"id":"the-atlantean-hunger","title":"The Atlantean Hunger","summary":"As the centuries passed, the Atlantean high houses became obsessed with a forbidden question:","markdown":"As the centuries passed, the Atlantean high houses became obsessed with a forbidden question:\n\n**Why should the sea merely be one crown of three?**\n\nTheir empire was vast, beautiful, ancient, and powerful—but trapped beneath the surface. They watched human kingdoms multiply across the land. They watched dragons soar over both land and sea without borders. To the most ambitious Atlanteans, balance began to look like humiliation.\n\nThe ruling faction that embraced this belief became known as **The Pearl Synod**. They argued that Atlantis had been denied its rightful destiny. They believed only the sea was eternal, and that all land, sky, wind, fire, beast, and kingdom should eventually answer to the tide.\n\nTo achieve this, the Pearl Synod designed a ritual engine beneath the Atlantean capital:\n\n**The Crown Below.**\n\nThe Crown Below was not simply an artifact. It was a world-commanding device. It was intended to bind land, sea, and sky into one throne of tidal law.\n\nTo awaken it, the Synod needed three kinds of power:\n\n1. **The blood-memory of dragons** — contained most purely in their eggs.\n2. **The obedience of leviathans** — controlled through Atlantean tide-song.\n3. **The maps of the surface world** — especially the hidden locations of dragon nests.\n\nAtlantis already had the leviathans.\n\nThey lacked the maps.\n\nSo they turned to a man of the surface.\n\n---","body":"As the centuries passed, the Atlantean high houses became obsessed with a forbidden question:\n\n**Why should the sea merely be one crown of three?**\n\nTheir empire was vast, beautiful, ancient, and powerful—but trapped beneath the surface. They watched human kingdoms multiply across the land. They watched dragons soar over both land and sea without borders. To the most ambitious Atlanteans, balance began to look like humiliation.\n\nThe ruling faction that embraced this belief became known as **The Pearl Synod**. They argued that Atlantis had been denied its rightful destiny. They believed only the sea was eternal, and that all land, sky, wind, fire, beast, and kingdom should eventually answer to the tide.\n\nTo achieve this, the Pearl Synod designed a ritual engine beneath the Atlantean capital:\n\n**The Crown Below.**\n\nThe Crown Below was not simply an artifact. It was a world-commanding device. It was intended to bind land, sea, and sky into one throne of tidal law.\n\nTo awaken it, the Synod needed three kinds of power:\n\n1. **The blood-memory of dragons** — contained most purely in their eggs.\n2. **The obedience of leviathans** — controlled through Atlantean tide-song.\n3. **The maps of the surface world** — especially the hidden locations of dragon nests.\n\nAtlantis already had the leviathans.\n\nThey lacked the maps.\n\nSo they turned to a man of the surface.\n\n---","sections":[]},{"id":"admiral-barrows-betrayal","title":"Admiral Barrow's Betrayal","summary":"Admiral Cassian Barrow, father of Jasper Barrow, was one of the most trusted men in the old Imperial Admiralty. He was not only a commander, but the Lord-Cartographer of the Admiralty, keeper of its most sacred and forbidden charts.","markdown":"**Admiral Cassian Barrow**, father of Jasper Barrow, was one of the most trusted men in the old Imperial Admiralty. He was not only a commander, but the **Lord-Cartographer of the Admiralty**, keeper of its most sacred and forbidden charts.\n\nThose charts marked more than trade routes. They recorded storm passages, hidden islands, dragon migration paths, rookery cliffs, volcanic nests, old treaty markers, and the sanctuaries where the dragons of the First Age raised their young.\n\nThe Atlanteans could not reach those places themselves. They could not climb the volcanic ridges where fire dragons nested. They could not cross the inland calderas where ancient clutches slept. They could not scale the storm cliffs where wind dragons brooded.\n\nSo the Pearl Synod offered Cassian Barrow what every proud traitor believes he deserves:\n\nPower.\n\nWealth.\n\nImmortality.\n\nA throne after the ritual.\n\nCassian was promised rule over the surface fleets once Atlantis rose above all other powers. He would become the first human Lord-Admiral of the New Tide Empire.\n\nCassian accepted.\n\nHe did not raid the nests himself. That would expose him. Instead, he released copied charts to pirate lords, privateers, smugglers, disgraced captains, and treasure fleets hungry for impossible wealth. Some were told the dragon eggs were priceless relics. Some were promised gold. Some were promised pardons. Some were promised Atlantean weapons. Some were simply told that dragon eggs could make men into kings.\n\nThis was the original sin of the pirate age:\n\n**the first great dragon hunts were not random acts of piracy, but a conspiracy between Atlantis, a corrupt admiral, and the pirate lords of the surface.**\n\nThe Pirate Kings of the present are heirs to that sin, whether they know it or not.\n\n---","body":"**Admiral Cassian Barrow**, father of Jasper Barrow, was one of the most trusted men in the old Imperial Admiralty. He was not only a commander, but the **Lord-Cartographer of the Admiralty**, keeper of its most sacred and forbidden charts.\n\nThose charts marked more than trade routes. They recorded storm passages, hidden islands, dragon migration paths, rookery cliffs, volcanic nests, old treaty markers, and the sanctuaries where the dragons of the First Age raised their young.\n\nThe Atlanteans could not reach those places themselves. They could not climb the volcanic ridges where fire dragons nested. They could not cross the inland calderas where ancient clutches slept. They could not scale the storm cliffs where wind dragons brooded.\n\nSo the Pearl Synod offered Cassian Barrow what every proud traitor believes he deserves:\n\nPower.\n\nWealth.\n\nImmortality.\n\nA throne after the ritual.\n\nCassian was promised rule over the surface fleets once Atlantis rose above all other powers. He would become the first human Lord-Admiral of the New Tide Empire.\n\nCassian accepted.\n\nHe did not raid the nests himself. That would expose him. Instead, he released copied charts to pirate lords, privateers, smugglers, disgraced captains, and treasure fleets hungry for impossible wealth. Some were told the dragon eggs were priceless relics. Some were promised gold. Some were promised pardons. Some were promised Atlantean weapons. Some were simply told that dragon eggs could make men into kings.\n\nThis was the original sin of the pirate age:\n\n**the first great dragon hunts were not random acts of piracy, but a conspiracy between Atlantis, a corrupt admiral, and the pirate lords of the surface.**\n\nThe Pirate Kings of the present are heirs to that sin, whether they know it or not.\n\n---","sections":[]},{"id":"jasper-barrow-and-the-false-treason","title":"Jasper Barrow and the False Treason","summary":"Jasper Barrow was raised in the shadow of his father's honour. He believed the Admiralty protected the innocent. He believed charts were sacred because they kept sailors alive. He believed power existed to defend those without it.","markdown":"Jasper Barrow was raised in the shadow of his father's honour. He believed the Admiralty protected the innocent. He believed charts were sacred because they kept sailors alive. He believed power existed to defend those without it.\n\nThat is why he became dangerous.\n\nAs a young captain, Jasper began noticing impossible patterns:\n\n- Dragon nests marked as \"extinct\" shortly before pirate raids.\n- Pirate vessels avoiding naval patrols with impossible accuracy.\n- Atlantean pearl coin found in the hands of surface raiders.\n- Refugees speaking of eggs taken alive, not treasure stolen.\n- His father quietly altering Admiralty records after each attack.\n\nAt first, Jasper thought there was a spy inside the Admiralty.\n\nThen he found the duplicate charts.\n\nNot stolen.\n\nSigned.\n\nSealed.\n\nReleased under his father's authority.\n\nJasper confronted Cassian in private, still hoping there was an explanation. Cassian did not deny it. He told Jasper that the First Age was ending. That dragons were relics. That humans were weak because they clung to old treaties. That Atlantis had the will to remake the world, and that the Barrow name would stand at the right hand of the new empire.\n\nJasper refused.\n\nHe threatened to expose him.\n\nSo Cassian destroyed his son.\n\n### The False Distress Call\n\nCassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.\n\nJasper sailed immediately.\n\nBut there was no convoy.\n\nOnly pirate lords waiting in the storm, carrying Barrow charts, Atlantean shot, and orders to leave no survivors.\n\nJasper's ship, **The Righteous Tide**, fought until its masts burned and its hull split. His crew died believing they had been abandoned by the Admiralty. Jasper was wounded, chained to the wheel, and left to sink beneath black water.\n\nCassian declared Jasper a traitor.\n\nThe official story became that Jasper had sold Admiralty charts to pirates, murdered his own crew, and fled into the storm. That lie survived the cataclysm and still stains his name in some ports.\n\nSome sailors still curse Jasper Barrow as the first traitor-captain.\n\nOthers whisper that he was the only honest man in the Admiralty.\n\n---","body":"Jasper Barrow was raised in the shadow of his father's honour. He believed the Admiralty protected the innocent. He believed charts were sacred because they kept sailors alive. He believed power existed to defend those without it.\n\nThat is why he became dangerous.\n\nAs a young captain, Jasper began noticing impossible patterns:\n\n- Dragon nests marked as \"extinct\" shortly before pirate raids.\n- Pirate vessels avoiding naval patrols with impossible accuracy.\n- Atlantean pearl coin found in the hands of surface raiders.\n- Refugees speaking of eggs taken alive, not treasure stolen.\n- His father quietly altering Admiralty records after each attack.\n\nAt first, Jasper thought there was a spy inside the Admiralty.\n\nThen he found the duplicate charts.\n\nNot stolen.\n\nSigned.\n\nSealed.\n\nReleased under his father's authority.\n\nJasper confronted Cassian in private, still hoping there was an explanation. Cassian did not deny it. He told Jasper that the First Age was ending. That dragons were relics. That humans were weak because they clung to old treaties. That Atlantis had the will to remake the world, and that the Barrow name would stand at the right hand of the new empire.\n\nJasper refused.\n\nHe threatened to expose him.\n\nSo Cassian destroyed his son.\n\n### The False Distress Call\n\nCassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.\n\nJasper sailed immediately.\n\nBut there was no convoy.\n\nOnly pirate lords waiting in the storm, carrying Barrow charts, Atlantean shot, and orders to leave no survivors.\n\nJasper's ship, **The Righteous Tide**, fought until its masts burned and its hull split. His crew died believing they had been abandoned by the Admiralty. Jasper was wounded, chained to the wheel, and left to sink beneath black water.\n\nCassian declared Jasper a traitor.\n\nThe official story became that Jasper had sold Admiralty charts to pirates, murdered his own crew, and fled into the storm. That lie survived the cataclysm and still stains his name in some ports.\n\nSome sailors still curse Jasper Barrow as the first traitor-captain.\n\nOthers whisper that he was the only honest man in the Admiralty.\n\n---","sections":[{"id":"the-false-distress-call","title":"The False Distress Call","markdown":"Cassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.\n\nJasper sailed immediately.\n\nBut there was no convoy.\n\nOnly pirate lords waiting in the storm, carrying Barrow charts, Atlantean shot, and orders to leave no survivors.\n\nJasper's ship, **The Righteous Tide**, fought until its masts burned and its hull split. His crew died believing they had been abandoned by the Admiralty. Jasper was wounded, chained to the wheel, and left to sink beneath black water.\n\nCassian declared Jasper a traitor.\n\nThe official story became that Jasper had sold Admiralty charts to pirates, murdered his own crew, and fled into the storm. That lie survived the cataclysm and still stains his name in some ports.\n\nSome sailors still curse Jasper Barrow as the first traitor-captain.\n\nOthers whisper that he was the only honest man in the Admiralty.\n\n---","excerpt":"Cassian arranged for Jasper to receive a distress signal from a remote storm route near a dragon migration path. The message claimed that a civilian convoy had been trapped by pirates.","bullets":[]}]},{"id":"aurelions-dive","title":"Aurelion's Dive","summary":"As Jasper sank, an Elder Dragon was nearby.","markdown":"As Jasper sank, an Elder Dragon was nearby.\n\nHis name was **Aurelion Veyr**, the Last Dawn-Wing.\n\nAurelion was one of the oldest dragons of the First Age, guardian of a hidden migration route and keeper of several scattered clutches. He had already sensed the theft of eggs across the world. He had felt nests go silent. He had heard unborn dragon-song vanish.\n\nThen he felt something different.\n\nNot the fear of prey.\n\nNot the rage of battle.\n\nA betrayal so deep it echoed like a wound in the world.\n\nJasper's soul, still burning with grief and justice, called through the storm.\n\nAurelion dived from the clouds into the sea.\n\nSailor myth remembers this only as a flash of gold beneath black waves: a dragon-shaped dawn vanishing into the storm.\n\nAurelion could not save Jasper's life.\n\nBut he saved his soul.\n\nHe carried Jasper's dying spirit into the deep, away from the pirates, away from Cassian's lie, away from the reach of Atlantis. There, beneath the storm, dragonfire met seawater and created something impossible:\n\n**Veilflame.**\n\nNot living fire.\n\nNot ghost magic.\n\nA sacred flame that burns only around broken oaths, betrayed innocents, and buried truths.\n\n---","body":"As Jasper sank, an Elder Dragon was nearby.\n\nHis name was **Aurelion Veyr**, the Last Dawn-Wing.\n\nAurelion was one of the oldest dragons of the First Age, guardian of a hidden migration route and keeper of several scattered clutches. He had already sensed the theft of eggs across the world. He had felt nests go silent. He had heard unborn dragon-song vanish.\n\nThen he felt something different.\n\nNot the fear of prey.\n\nNot the rage of battle.\n\nA betrayal so deep it echoed like a wound in the world.\n\nJasper's soul, still burning with grief and justice, called through the storm.\n\nAurelion dived from the clouds into the sea.\n\nSailor myth remembers this only as a flash of gold beneath black waves: a dragon-shaped dawn vanishing into the storm.\n\nAurelion could not save Jasper's life.\n\nBut he saved his soul.\n\nHe carried Jasper's dying spirit into the deep, away from the pirates, away from Cassian's lie, away from the reach of Atlantis. There, beneath the storm, dragonfire met seawater and created something impossible:\n\n**Veilflame.**\n\nNot living fire.\n\nNot ghost magic.\n\nA sacred flame that burns only around broken oaths, betrayed innocents, and buried truths.\n\n---","sections":[]},{"id":"the-crown-below-ritual","title":"The Crown Below Ritual","summary":"By then, the Atlanteans had gathered enough eggs.","markdown":"By then, the Atlanteans had gathered enough eggs.\n\nThe pirate lords delivered crates of them into the deep: fire eggs, storm eggs, reef eggs, moon eggs, frost eggs, ash eggs, and ancient clutches stolen from nests older than human kingdoms.\n\nThe Pearl Synod placed them around the Crown Below. They believed dragon eggs were batteries: sources of sky-magic to be cracked, drained, and commanded.\n\nThey were wrong.\n\nDragon eggs were not containers of power.\n\nThey were promises.\n\nEach egg was bound to a place, a season, a current, a mountain, a wind, a future migration, and a balance not yet born.\n\nWhen the ritual began, the Crown Below tried to pull all three realms into one command.\n\nIt reached for the land through stolen maps.\n\nIt reached for the sea through leviathan song.\n\nIt reached for the sky through unborn dragons.\n\nFor one heartbeat, it worked.\n\nThe tides stopped.\n\nThe stars bent downward.\n\nEvery dragon in the world screamed.\n\nThen the unborn refused.\n\nThe eggs broke, but they did not obey.\n\nInstead of crowning Atlantis, the ritual tore the covenants of the First Age apart.\n\nThe continental shelves shattered.\n\nAtlantis sank deeper than the sea was meant to go.\n\nVolcanic chains erupted.\n\nStorms became permanent.\n\nDragon routes vanished.\n\nLeviathans went mad.\n\nOld gods, sea beasts, or abyssal things—depending on who tells the tale—stirred beneath the wound.\n\nThe world became the Shattered Seas.\n\nThis event is remembered by many names:\n\n- **The Shattering**\n- **The Drowning**\n- **The Sundering of the Three Crowns**\n- **The Night the Sea Rose**\n- **The Breaking of the First Age**\n\n---","body":"By then, the Atlanteans had gathered enough eggs.\n\nThe pirate lords delivered crates of them into the deep: fire eggs, storm eggs, reef eggs, moon eggs, frost eggs, ash eggs, and ancient clutches stolen from nests older than human kingdoms.\n\nThe Pearl Synod placed them around the Crown Below. They believed dragon eggs were batteries: sources of sky-magic to be cracked, drained, and commanded.\n\nThey were wrong.\n\nDragon eggs were not containers of power.\n\nThey were promises.\n\nEach egg was bound to a place, a season, a current, a mountain, a wind, a future migration, and a balance not yet born.\n\nWhen the ritual began, the Crown Below tried to pull all three realms into one command.\n\nIt reached for the land through stolen maps.\n\nIt reached for the sea through leviathan song.\n\nIt reached for the sky through unborn dragons.\n\nFor one heartbeat, it worked.\n\nThe tides stopped.\n\nThe stars bent downward.\n\nEvery dragon in the world screamed.\n\nThen the unborn refused.\n\nThe eggs broke, but they did not obey.\n\nInstead of crowning Atlantis, the ritual tore the covenants of the First Age apart.\n\nThe continental shelves shattered.\n\nAtlantis sank deeper than the sea was meant to go.\n\nVolcanic chains erupted.\n\nStorms became permanent.\n\nDragon routes vanished.\n\nLeviathans went mad.\n\nOld gods, sea beasts, or abyssal things—depending on who tells the tale—stirred beneath the wound.\n\nThe world became the Shattered Seas.\n\nThis event is remembered by many names:\n\n- **The Shattering**\n- **The Drowning**\n- **The Sundering of the Three Crowns**\n- **The Night the Sea Rose**\n- **The Breaking of the First Age**\n\n---","sections":[]},{"id":"jaspers-binding","title":"Jasper's Binding","summary":"During the catastrophe, Aurelion knew the world had been wounded beyond simple healing.","markdown":"During the catastrophe, Aurelion knew the world had been wounded beyond simple healing.\n\nThe dragons were scattered.\n\nAtlantis was drowning.\n\nHuman kingdoms were collapsing.\n\nThe seas were filling with pirates, monsters, wrecks, and lies.\n\nJasper's body was dead. His name had been ruined. His crew was gone. But his soul remained fiercely intact.\n\nAurelion offered him a choice.\n\nNot resurrection.\n\nNot peace.\n\nA charge.\n\nJasper could pass beyond death and leave the world to its ruin. Or he could be bound to the sea as a revenant oath: a guardian of the betrayed, a hunter of tyrants, and a witness against the lie that destroyed the First Age.\n\nJasper accepted.\n\nAurelion bound Jasper's soul to the Veilwake Sea with dragonfire, seawater, and the last breath of the storm.\n\nFrom that moment, Jasper Barrow became:\n\n**The Ghost Captain of the Righteous Tide.**  \n**The First Drowned Oath.**  \n**The Witness in the Fog.**  \n**The Man the Sea Would Not Let Die.**\n\nJasper's undeath is not merely a curse. It is a sacred wound. He is consecrated by betrayal and chained to justice until corruption, tyranny, and the crimes against dragonkind are answered.\n\n### The Fate of Aurelion Veyr\n\nAurelion vanished after binding Jasper.\n\nSome say he died and became the golden dawn sometimes seen over the Veilwake Sea. Others claim his bones lie wrapped around the first dragon sanctuary. Some Tidewardens believe his body still sleeps beneath **Dawnrest**, the oldest hidden sanctuary, and that his dreams guide lost eggs home.\n\nThe truth of Aurelion's fate is one of the deepest mysteries of the Shattered Seas.\n\n---","body":"During the catastrophe, Aurelion knew the world had been wounded beyond simple healing.\n\nThe dragons were scattered.\n\nAtlantis was drowning.\n\nHuman kingdoms were collapsing.\n\nThe seas were filling with pirates, monsters, wrecks, and lies.\n\nJasper's body was dead. His name had been ruined. His crew was gone. But his soul remained fiercely intact.\n\nAurelion offered him a choice.\n\nNot resurrection.\n\nNot peace.\n\nA charge.\n\nJasper could pass beyond death and leave the world to its ruin. Or he could be bound to the sea as a revenant oath: a guardian of the betrayed, a hunter of tyrants, and a witness against the lie that destroyed the First Age.\n\nJasper accepted.\n\nAurelion bound Jasper's soul to the Veilwake Sea with dragonfire, seawater, and the last breath of the storm.\n\nFrom that moment, Jasper Barrow became:\n\n**The Ghost Captain of the Righteous Tide.**  \n**The First Drowned Oath.**  \n**The Witness in the Fog.**  \n**The Man the Sea Would Not Let Die.**\n\nJasper's undeath is not merely a curse. It is a sacred wound. He is consecrated by betrayal and chained to justice until corruption, tyranny, and the crimes against dragonkind are answered.\n\n### The Fate of Aurelion Veyr\n\nAurelion vanished after binding Jasper.\n\nSome say he died and became the golden dawn sometimes seen over the Veilwake Sea. Others claim his bones lie wrapped around the first dragon sanctuary. Some Tidewardens believe his body still sleeps beneath **Dawnrest**, the oldest hidden sanctuary, and that his dreams guide lost eggs home.\n\nThe truth of Aurelion's fate is one of the deepest mysteries of the Shattered Seas.\n\n---","sections":[{"id":"the-fate-of-aurelion-veyr","title":"The Fate of Aurelion Veyr","markdown":"Aurelion vanished after binding Jasper.\n\nSome say he died and became the golden dawn sometimes seen over the Veilwake Sea. Others claim his bones lie wrapped around the first dragon sanctuary. Some Tidewardens believe his body still sleeps beneath **Dawnrest**, the oldest hidden sanctuary, and that his dreams guide lost eggs home.\n\nThe truth of Aurelion's fate is one of the deepest mysteries of the Shattered Seas.\n\n---","excerpt":"Aurelion vanished after binding Jasper.","bullets":[]}]},{"id":"the-crown-below-the-wound-that-still-pulses","title":"The Crown Below: The Wound That Still Pulses","summary":"The Crown Below did not vanish after the ritual failed.","markdown":"The Crown Below did not vanish after the ritual failed.\n\nIt remains beneath the deepest ruins of Atlantis: broken, buried, and leaking power.\n\nIt no longer has enough strength to command land, sea, and sky, but it continues to distort the world. Its pulse explains why the Shattered Seas are still unstable, why old routes change, why magic returns in dangerous forms, why sea monsters stir, and why the domains of the Pirate Kings are warped by supernatural influence.\n\nThe Crown Below had two consequences.\n\nThe first was immediate: **The Shattering** broke the old world.\n\nThe second was slower and stranger: **the deep learned to rebel**.\n\nThe ritual corrupted the ancient bonds by which Atlanteans had bargained with leviathans, guided great sea serpents away from cities, and contained krakens in abyssal trenches. After the Crown Below failed, those bonds did not simply snap. They rotted. The things bound by them became stronger, more intelligent, more wrathful, and less obedient.\n\nEvery stolen dragon egg, every slain dragon, every awakened leviathan, every serpent curse, every abyssal song, and every act of tyrannical conquest risks feeding the old wound.\n\nThe greatest danger is not that the world was broken once.\n\nIt is that the world can be broken again.\n\n---","body":"The Crown Below did not vanish after the ritual failed.\n\nIt remains beneath the deepest ruins of Atlantis: broken, buried, and leaking power.\n\nIt no longer has enough strength to command land, sea, and sky, but it continues to distort the world. Its pulse explains why the Shattered Seas are still unstable, why old routes change, why magic returns in dangerous forms, why sea monsters stir, and why the domains of the Pirate Kings are warped by supernatural influence.\n\nThe Crown Below had two consequences.\n\nThe first was immediate: **The Shattering** broke the old world.\n\nThe second was slower and stranger: **the deep learned to rebel**.\n\nThe ritual corrupted the ancient bonds by which Atlanteans had bargained with leviathans, guided great sea serpents away from cities, and contained krakens in abyssal trenches. After the Crown Below failed, those bonds did not simply snap. They rotted. The things bound by them became stronger, more intelligent, more wrathful, and less obedient.\n\nEvery stolen dragon egg, every slain dragon, every awakened leviathan, every serpent curse, every abyssal song, and every act of tyrannical conquest risks feeding the old wound.\n\nThe greatest danger is not that the world was broken once.\n\nIt is that the world can be broken again.\n\n---","sections":[]},{"id":"the-second-age-the-age-of-the-drowned-crown","title":"The Second Age: The Age of the Drowned Crown","summary":"*\"When the land drowned, those who breathed water called themselves merciful.\"* — Tidewarden marginal note, recovered from Lantern Cay","markdown":"> *\"When the land drowned, those who breathed water called themselves merciful.\"*  \n> — Tidewarden marginal note, recovered from Lantern Cay\n\nThe Shattering ended the First Age, but it did not end Atlantean ambition.\n\nIn the immediate aftermath of the cataclysm, the surface world was broken. Continents had fractured into island chains. Coastal capitals lay beneath silt and salt. Human navies were shattered. Lighthouse chains went dark. Roads ended at cliffs where the sea had swallowed provinces whole. Dragons vanished into grief, hiding, or extinction.\n\nAtlantis had also suffered terribly, but the world had become more ocean than land—and that made the Atlanteans the strongest surviving power.\n\nThus began the **Second Age**, remembered by Atlantean loyalists as **The Age of Restoration**, by surface ports as **The Age of Tribute**, and by most sailors as:\n\n**The Age of the Drowned Crown.**\n\nDuring this age, Atlantis dominated the flooded world. Atlantean houses claimed that only they could make the new seas navigable. They rebuilt current-roads, raised coral toll-gates, installed pearl-tax collectors in surviving harbours, and forced surface ports into tribute pacts in exchange for safe passage.\n\nThey built:\n\n- **Tide gates** that redirected dangerous currents.\n- **Coral citadels** around drowned ruins.\n- **Leviathan roads** guarded by sea beasts.\n- **Pearl-tax harbours** that controlled surviving trade.\n- **Underwater prisons** for rebels, smugglers, and dragon sympathizers.\n- **Drowned tollhouses** along routes that had once been free.\n- **Current engines** powered by fragments of the Crown Below.\n\nTo many starving islands, Atlantean rule was better than chaos.\n\nTo free captains, it was conquest with polished manners.\n\nTo the dragons, it was the same old hunger wearing a crown of coral.\n\n### Adara's Inheritance\n\nLady Adara Thalassa was born long after the Second Age's height, but she was raised on its memory. To her, the Age of the Drowned Crown was not tyranny. It was proof that Atlantis could impose order on a broken world.\n\nWhen Adara speaks of restoring Atlantis, she does not merely mean rebuilding coral palaces.\n\nShe means restoring the authority of the Drowned Crown over the seas.\n\nShe means tribute ports.\n\nShe means obedient leviathans.\n\nShe means dragons brought to heel.\n\nShe means a world where no route exists outside Atlantean law.\n\n---","body":"> *\"When the land drowned, those who breathed water called themselves merciful.\"*  \n> — Tidewarden marginal note, recovered from Lantern Cay\n\nThe Shattering ended the First Age, but it did not end Atlantean ambition.\n\nIn the immediate aftermath of the cataclysm, the surface world was broken. Continents had fractured into island chains. Coastal capitals lay beneath silt and salt. Human navies were shattered. Lighthouse chains went dark. Roads ended at cliffs where the sea had swallowed provinces whole. Dragons vanished into grief, hiding, or extinction.\n\nAtlantis had also suffered terribly, but the world had become more ocean than land—and that made the Atlanteans the strongest surviving power.\n\nThus began the **Second Age**, remembered by Atlantean loyalists as **The Age of Restoration**, by surface ports as **The Age of Tribute**, and by most sailors as:\n\n**The Age of the Drowned Crown.**\n\nDuring this age, Atlantis dominated the flooded world. Atlantean houses claimed that only they could make the new seas navigable. They rebuilt current-roads, raised coral toll-gates, installed pearl-tax collectors in surviving harbours, and forced surface ports into tribute pacts in exchange for safe passage.\n\nThey built:\n\n- **Tide gates** that redirected dangerous currents.\n- **Coral citadels** around drowned ruins.\n- **Leviathan roads** guarded by sea beasts.\n- **Pearl-tax harbours** that controlled surviving trade.\n- **Underwater prisons** for rebels, smugglers, and dragon sympathizers.\n- **Drowned tollhouses** along routes that had once been free.\n- **Current engines** powered by fragments of the Crown Below.\n\nTo many starving islands, Atlantean rule was better than chaos.\n\nTo free captains, it was conquest with polished manners.\n\nTo the dragons, it was the same old hunger wearing a crown of coral.\n\n### Adara's Inheritance\n\nLady Adara Thalassa was born long after the Second Age's height, but she was raised on its memory. To her, the Age of the Drowned Crown was not tyranny. It was proof that Atlantis could impose order on a broken world.\n\nWhen Adara speaks of restoring Atlantis, she does not merely mean rebuilding coral palaces.\n\nShe means restoring the authority of the Drowned Crown over the seas.\n\nShe means tribute ports.\n\nShe means obedient leviathans.\n\nShe means dragons brought to heel.\n\nShe means a world where no route exists outside Atlantean law.\n\n---","sections":[{"id":"adaras-inheritance","title":"Adara's Inheritance","markdown":"Lady Adara Thalassa was born long after the Second Age's height, but she was raised on its memory. To her, the Age of the Drowned Crown was not tyranny. It was proof that Atlantis could impose order on a broken world.\n\nWhen Adara speaks of restoring Atlantis, she does not merely mean rebuilding coral palaces.\n\nShe means restoring the authority of the Drowned Crown over the seas.\n\nShe means tribute ports.\n\nShe means obedient leviathans.\n\nShe means dragons brought to heel.\n\nShe means a world where no route exists outside Atlantean law.\n\n---","excerpt":"Lady Adara Thalassa was born long after the Second Age's height, but she was raised on its memory. To her, the Age of the Drowned Crown was not tyranny. It was proof that Atlantis could impose order on a broken world.","bullets":[]}]},{"id":"the-corruption-of-the-deep","title":"The Corruption of the Deep","summary":"The Atlanteans believed the deep belonged to them.","markdown":"The Atlanteans believed the deep belonged to them.\n\nThey were wrong.\n\nBefore the Crown Below, Atlantean tide-song could bargain with leviathans, turn serpent migrations away from cities, and lull krakens into abyssal sleep. Those songs were not absolute control; they were ancient agreements, layered over centuries of ritual, respect, fear, and mutual need.\n\nThe Crown Below corrupted those agreements.\n\nIts failed command taught the deep a terrible lesson: that all bindings could be broken.\n\nSea serpents grew larger and more cunning. Krakens woke from trenches where they had slept since before Atlantis. Leviathans became harder to calm. Lesser sea beasts began following strange currents toward the broken pulse beneath the world.\n\nAtlantean scholars called it **resonant instability**.\n\nSurface sailors called it **the sea getting teeth**.\n\nTidewardens called it the second consequence of the Pearl Synod's sin.\n\n> *The Crown Below did not simply fail. It taught the deep how to rebel.*\n\n---","body":"The Atlanteans believed the deep belonged to them.\n\nThey were wrong.\n\nBefore the Crown Below, Atlantean tide-song could bargain with leviathans, turn serpent migrations away from cities, and lull krakens into abyssal sleep. Those songs were not absolute control; they were ancient agreements, layered over centuries of ritual, respect, fear, and mutual need.\n\nThe Crown Below corrupted those agreements.\n\nIts failed command taught the deep a terrible lesson: that all bindings could be broken.\n\nSea serpents grew larger and more cunning. Krakens woke from trenches where they had slept since before Atlantis. Leviathans became harder to calm. Lesser sea beasts began following strange currents toward the broken pulse beneath the world.\n\nAtlantean scholars called it **resonant instability**.\n\nSurface sailors called it **the sea getting teeth**.\n\nTidewardens called it the second consequence of the Pearl Synod's sin.\n\n> *The Crown Below did not simply fail. It taught the deep how to rebel.*\n\n---","sections":[]},{"id":"the-unbinding-tide","title":"The Unbinding Tide","summary":"The event that ended the Second Age is remembered by many names:","markdown":"The event that ended the Second Age is remembered by many names:\n\n- **The Unbinding Tide**\n- **The Breaking of the Leash**\n- **The War of Unbound Depths**\n- **The Uncoiling**\n- **The Night the Coral Roads Fell**\n\nThe most common name is **The Unbinding Tide**.\n\nIt began when the sea serpents stopped avoiding Atlantean cities.\n\nThen the krakens rose.\n\nNo single king, beast, or battle caused the collapse. It was a season of disasters. Serpents coiled around tide gates and crushed them. Kraken arms pulled coral bridges into the abyss. Leviathans refused commands and turned on their handlers. Current engines overloaded. Pearl-tax harbours lost contact with the deep roads. Underwater prisons cracked open. Entire Atlantean districts were dragged into trenches that had no names.\n\nThe Atlanteans had built an empire on the belief that the sea could be commanded.\n\nThe sea answered.\n\nThe Unbinding Tide devastated Atlantean infrastructure so completely that surface ports began to breathe again. Trade routes that had been taxed by Atlantis became dangerous but open. Smugglers became merchants. Privateers became protectors. Pirates became heroes in their own songs.\n\nThe Second Age ended not because humans defeated Atlantis, but because the monsters of the deep broke the empire first.\n\nThis collapse made the Third Age possible.\n\n### The Legacy of the Unbinding Tide\n\nThe Unbinding Tide did not make the world safe.\n\nIt made the world available.\n\nFor the first time since the Shattering, independent captains could cross routes without bowing to Atlantean tolls. They still had to face serpents, krakens, storms, pirates, and ruined magic—but those dangers could be fought, avoided, bargained with, or outrun.\n\nThis is the age when free captains became more than survivors.\n\nThey became powers.\n\n---","body":"The event that ended the Second Age is remembered by many names:\n\n- **The Unbinding Tide**\n- **The Breaking of the Leash**\n- **The War of Unbound Depths**\n- **The Uncoiling**\n- **The Night the Coral Roads Fell**\n\nThe most common name is **The Unbinding Tide**.\n\nIt began when the sea serpents stopped avoiding Atlantean cities.\n\nThen the krakens rose.\n\nNo single king, beast, or battle caused the collapse. It was a season of disasters. Serpents coiled around tide gates and crushed them. Kraken arms pulled coral bridges into the abyss. Leviathans refused commands and turned on their handlers. Current engines overloaded. Pearl-tax harbours lost contact with the deep roads. Underwater prisons cracked open. Entire Atlantean districts were dragged into trenches that had no names.\n\nThe Atlanteans had built an empire on the belief that the sea could be commanded.\n\nThe sea answered.\n\nThe Unbinding Tide devastated Atlantean infrastructure so completely that surface ports began to breathe again. Trade routes that had been taxed by Atlantis became dangerous but open. Smugglers became merchants. Privateers became protectors. Pirates became heroes in their own songs.\n\nThe Second Age ended not because humans defeated Atlantis, but because the monsters of the deep broke the empire first.\n\nThis collapse made the Third Age possible.\n\n### The Legacy of the Unbinding Tide\n\nThe Unbinding Tide did not make the world safe.\n\nIt made the world available.\n\nFor the first time since the Shattering, independent captains could cross routes without bowing to Atlantean tolls. They still had to face serpents, krakens, storms, pirates, and ruined magic—but those dangers could be fought, avoided, bargained with, or outrun.\n\nThis is the age when free captains became more than survivors.\n\nThey became powers.\n\n---","sections":[{"id":"the-legacy-of-the-unbinding-tide","title":"The Legacy of the Unbinding Tide","markdown":"The Unbinding Tide did not make the world safe.\n\nIt made the world available.\n\nFor the first time since the Shattering, independent captains could cross routes without bowing to Atlantean tolls. They still had to face serpents, krakens, storms, pirates, and ruined magic—but those dangers could be fought, avoided, bargained with, or outrun.\n\nThis is the age when free captains became more than survivors.\n\nThey became powers.\n\n---","excerpt":"The Unbinding Tide did not make the world safe.","bullets":[]}]},{"id":"the-third-age-the-age-of-free-sails","title":"The Third Age: The Age of Free Sails","summary":"*\"Ebon gave men teeth enough to bite monsters.\"* — Old pirate toast, still heard in Ashen Reach taverns","markdown":"> *\"Ebon gave men teeth enough to bite monsters.\"*  \n> — Old pirate toast, still heard in Ashen Reach taverns\n\nAfter the Unbinding Tide, the world entered the **Third Age**.\n\nPirates call it **The Age of Free Sails**.\n\nMerchants call it **The Route-Reopening**.\n\nTidewardens and dragon sanctuary keepers have a darker name for it:\n\n**The Ashen Prosperity.**\n\nThis was the age when humans and pirates rose in the power vacuum left by Atlantis. Trade returned. Ports reopened. Convoys sailed again. Free captains mapped routes through monster waters, salvaged Atlantean ruins, raided old tollhouses, and learned how to survive the new sea.\n\nBut prosperity came at a cost.\n\nThe Third Age was also when dragon-hunting became a craft.\n\nBefore the Age of Free Sails, stealing a dragon egg was a desperate act, a miracle, or a death sentence. After it, there were methods. There were tools. There were markets. There were buyers.\n\nAnd one captain stood at the centre of that transformation.\n\n**Ebon Flameheart.**\n\n---","body":"> *\"Ebon gave men teeth enough to bite monsters.\"*  \n> — Old pirate toast, still heard in Ashen Reach taverns\n\nAfter the Unbinding Tide, the world entered the **Third Age**.\n\nPirates call it **The Age of Free Sails**.\n\nMerchants call it **The Route-Reopening**.\n\nTidewardens and dragon sanctuary keepers have a darker name for it:\n\n**The Ashen Prosperity.**\n\nThis was the age when humans and pirates rose in the power vacuum left by Atlantis. Trade returned. Ports reopened. Convoys sailed again. Free captains mapped routes through monster waters, salvaged Atlantean ruins, raided old tollhouses, and learned how to survive the new sea.\n\nBut prosperity came at a cost.\n\nThe Third Age was also when dragon-hunting became a craft.\n\nBefore the Age of Free Sails, stealing a dragon egg was a desperate act, a miracle, or a death sentence. After it, there were methods. There were tools. There were markets. There were buyers.\n\nAnd one captain stood at the centre of that transformation.\n\n**Ebon Flameheart.**\n\n---","sections":[]},{"id":"ebons-glory-and-the-ashen-turn","title":"Ebon's Glory and the Ashen Turn","summary":"Ebon Flameheart did not begin as the monster he is now.","markdown":"Ebon Flameheart did not begin as the monster he is now.\n\nIn the early Third Age, he was celebrated as one of the greatest free captains ever to sail. He broke serpent blockades, charted ash currents, raided Atlantean ruin-vaults, rescued merchant convoys from kraken waters, and taught pirates how to survive where old navies feared to go.\n\nPirates still sing that Ebon gave glory back to men.\n\nThere is truth in that.\n\nHe taught free captains:\n\n- how to read monster wakes before a serpent surfaced,\n- how to evade kraken feeding grounds,\n- how to use volcanic vents and ash winds,\n- how to raid Atlantean wreck-cities,\n- how to reinforce hulls against fire and acid,\n- how to build harpoons from dragonbone and leviathan steel,\n- how to hunt dragons by dawn-smoke, compass failure, and nesting heat,\n- how to turn scales, bone, claws, and eggs into weapons, armour, and coin.\n\nTo pirates and merchants, Ebon was a liberator.\n\nTo dragons, he was the beginning of an industry.\n\nCassian Barrow sold the first maps.\n\nEbon Flameheart taught the world how to use them.\n\n### Blackfang\n\nDuring one of his most famous raids on a volcanic rookery, Ebon found a single surviving dragon egg among ash, glass, and broken shell. Stories disagree about why he kept it.\n\nSome say greed.\n\nSome say pity.\n\nSome say the egg cracked in his hands and the hatchling looked at him like a storm looks at a mast.\n\nWhatever the truth, Ebon did not sell the egg.\n\nHe hatched it.\n\nHe named the dragon **Blackfang**.\n\nFor a time, Ebon and Blackfang were not master and weapon, but companions. Ebon raised the hatchling aboard his ship. Blackfang learned cannon thunder before mountain wind. He slept around warm anchors, stole fish from barrels, snapped at crewmen who mocked him, and grew into a terror of the skies with a pirate captain as his chosen friend.\n\nTheir bond changed Ebon.\n\nBlackfang's dragonfire spirit entered his blood. Ebon's wounds began to cauterise with ember-light. Fire refused to consume him completely. His age slowed. His rage strengthened Blackfang, and Blackfang's fury strengthened him.\n\nEbon became nearly immortal.\n\nNot because he conquered a dragon.\n\nBecause, once, a dragon chose him.\n\n### The Ashen Turn\n\nThat truth became Ebon's deepest fear.\n\nIf Blackfang had chosen him, another dragon might choose another captain.\n\nAnother pirate could gain dragonfire spirit.\n\nAnother crew could become legend.\n\nAnother Dragon King could rise.\n\nEbon's glory curdled into paranoia. The captain who once taught pirates how to survive the monstrous world began burning dragon nests to prevent anyone else from receiving the gift he had received. He paid bounties for eggs not to hatch them, but to crush them. He slaughtered migrating dragons. He destroyed rookeries he had once spared. He turned the techniques of the Age of Free Sails into a machine of extinction.\n\nThus ended the bright myth of Ebon Flameheart.\n\nThe liberator became the hoarder.\n\nThe teacher became the tyrant.\n\nThe friend of Blackfang became the Dragon Marauder.\n\n---","body":"Ebon Flameheart did not begin as the monster he is now.\n\nIn the early Third Age, he was celebrated as one of the greatest free captains ever to sail. He broke serpent blockades, charted ash currents, raided Atlantean ruin-vaults, rescued merchant convoys from kraken waters, and taught pirates how to survive where old navies feared to go.\n\nPirates still sing that Ebon gave glory back to men.\n\nThere is truth in that.\n\nHe taught free captains:\n\n- how to read monster wakes before a serpent surfaced,\n- how to evade kraken feeding grounds,\n- how to use volcanic vents and ash winds,\n- how to raid Atlantean wreck-cities,\n- how to reinforce hulls against fire and acid,\n- how to build harpoons from dragonbone and leviathan steel,\n- how to hunt dragons by dawn-smoke, compass failure, and nesting heat,\n- how to turn scales, bone, claws, and eggs into weapons, armour, and coin.\n\nTo pirates and merchants, Ebon was a liberator.\n\nTo dragons, he was the beginning of an industry.\n\nCassian Barrow sold the first maps.\n\nEbon Flameheart taught the world how to use them.\n\n### Blackfang\n\nDuring one of his most famous raids on a volcanic rookery, Ebon found a single surviving dragon egg among ash, glass, and broken shell. Stories disagree about why he kept it.\n\nSome say greed.\n\nSome say pity.\n\nSome say the egg cracked in his hands and the hatchling looked at him like a storm looks at a mast.\n\nWhatever the truth, Ebon did not sell the egg.\n\nHe hatched it.\n\nHe named the dragon **Blackfang**.\n\nFor a time, Ebon and Blackfang were not master and weapon, but companions. Ebon raised the hatchling aboard his ship. Blackfang learned cannon thunder before mountain wind. He slept around warm anchors, stole fish from barrels, snapped at crewmen who mocked him, and grew into a terror of the skies with a pirate captain as his chosen friend.\n\nTheir bond changed Ebon.\n\nBlackfang's dragonfire spirit entered his blood. Ebon's wounds began to cauterise with ember-light. Fire refused to consume him completely. His age slowed. His rage strengthened Blackfang, and Blackfang's fury strengthened him.\n\nEbon became nearly immortal.\n\nNot because he conquered a dragon.\n\nBecause, once, a dragon chose him.\n\n### The Ashen Turn\n\nThat truth became Ebon's deepest fear.\n\nIf Blackfang had chosen him, another dragon might choose another captain.\n\nAnother pirate could gain dragonfire spirit.\n\nAnother crew could become legend.\n\nAnother Dragon King could rise.\n\nEbon's glory curdled into paranoia. The captain who once taught pirates how to survive the monstrous world began burning dragon nests to prevent anyone else from receiving the gift he had received. He paid bounties for eggs not to hatch them, but to crush them. He slaughtered migrating dragons. He destroyed rookeries he had once spared. He turned the techniques of the Age of Free Sails into a machine of extinction.\n\nThus ended the bright myth of Ebon Flameheart.\n\nThe liberator became the hoarder.\n\nThe teacher became the tyrant.\n\nThe friend of Blackfang became the Dragon Marauder.\n\n---","sections":[{"id":"blackfang","title":"Blackfang","markdown":"During one of his most famous raids on a volcanic rookery, Ebon found a single surviving dragon egg among ash, glass, and broken shell. Stories disagree about why he kept it.\n\nSome say greed.\n\nSome say pity.\n\nSome say the egg cracked in his hands and the hatchling looked at him like a storm looks at a mast.\n\nWhatever the truth, Ebon did not sell the egg.\n\nHe hatched it.\n\nHe named the dragon **Blackfang**.\n\nFor a time, Ebon and Blackfang were not master and weapon, but companions. Ebon raised the hatchling aboard his ship. Blackfang learned cannon thunder before mountain wind. He slept around warm anchors, stole fish from barrels, snapped at crewmen who mocked him, and grew into a terror of the skies with a pirate captain as his chosen friend.\n\nTheir bond changed Ebon.\n\nBlackfang's dragonfire spirit entered his blood. Ebon's wounds began to cauterise with ember-light. Fire refused to consume him completely. His age slowed. His rage strengthened Blackfang, and Blackfang's fury strengthened him.\n\nEbon became nearly immortal.\n\nNot because he conquered a dragon.\n\nBecause, once, a dragon chose him.","excerpt":"During one of his most famous raids on a volcanic rookery, Ebon found a single surviving dragon egg among ash, glass, and broken shell. Stories disagree about why he kept it.","bullets":[]},{"id":"the-ashen-turn","title":"The Ashen Turn","markdown":"That truth became Ebon's deepest fear.\n\nIf Blackfang had chosen him, another dragon might choose another captain.\n\nAnother pirate could gain dragonfire spirit.\n\nAnother crew could become legend.\n\nAnother Dragon King could rise.\n\nEbon's glory curdled into paranoia. The captain who once taught pirates how to survive the monstrous world began burning dragon nests to prevent anyone else from receiving the gift he had received. He paid bounties for eggs not to hatch them, but to crush them. He slaughtered migrating dragons. He destroyed rookeries he had once spared. He turned the techniques of the Age of Free Sails into a machine of extinction.\n\nThus ended the bright myth of Ebon Flameheart.\n\nThe liberator became the hoarder.\n\nThe teacher became the tyrant.\n\nThe friend of Blackfang became the Dragon Marauder.\n\n---","excerpt":"That truth became Ebon's deepest fear.","bullets":[]}]},{"id":"the-current-age-the-age-of-five-crowns","title":"The Current Age: The Age of Five Crowns","summary":"The current age is called many things.","markdown":"The current age is called many things.\n\nMerchants call it **The Age of Broken Tides**.\n\nPirates call it **The Age of Five Crowns**.\n\nTidewardens call it **The Last Chance**.\n\nThe Atlantean empire is broken, but not gone. Dragonkind is nearly extinct, but not dead. The free ports endure, but only by trade, courage, compromise, and luck. Pirate prosperity has soured into piracy, strongholds, tribute, monster cults, dragon bounties, and kings who answer to no law but their own.\n\nThe Five Pirate Kings are the children of every age before them:\n\n| King | Historical Wound |\n|------|------------------|\n| **Jasper Barrow** | The betrayal that caused the Shattering |\n| **Adara Thalassa** | The failed empire of the Drowned Crown |\n| **Mordekai Drakon** | The human trauma of Atlantean domination and serpent corruption |\n| **Nimue Tideborn** | The freedom and horror of the Unbinding Tide |\n| **Ebon Flameheart** | The pirate prosperity that became dragon genocide |\n\nThe player enters now, when every old sin is still alive.\n\nThe Crown Below still pulses.\n\nThe deep is still unbound.\n\nEbon still hunts dragons.\n\nAdara still dreams of Atlantean order.\n\nMordekai still carries serpent hatred in his blood.\n\nNimue still listens to the abyss.\n\nJasper still judges the fog.\n\nAnd somewhere, hidden in cargo holds, rookery ruins, sanctuary coves, and the dreams of Aurelion Veyr, the last dragon eggs wait to be saved.\n\n---","body":"The current age is called many things.\n\nMerchants call it **The Age of Broken Tides**.\n\nPirates call it **The Age of Five Crowns**.\n\nTidewardens call it **The Last Chance**.\n\nThe Atlantean empire is broken, but not gone. Dragonkind is nearly extinct, but not dead. The free ports endure, but only by trade, courage, compromise, and luck. Pirate prosperity has soured into piracy, strongholds, tribute, monster cults, dragon bounties, and kings who answer to no law but their own.\n\nThe Five Pirate Kings are the children of every age before them:\n\n| King | Historical Wound |\n|------|------------------|\n| **Jasper Barrow** | The betrayal that caused the Shattering |\n| **Adara Thalassa** | The failed empire of the Drowned Crown |\n| **Mordekai Drakon** | The human trauma of Atlantean domination and serpent corruption |\n| **Nimue Tideborn** | The freedom and horror of the Unbinding Tide |\n| **Ebon Flameheart** | The pirate prosperity that became dragon genocide |\n\nThe player enters now, when every old sin is still alive.\n\nThe Crown Below still pulses.\n\nThe deep is still unbound.\n\nEbon still hunts dragons.\n\nAdara still dreams of Atlantean order.\n\nMordekai still carries serpent hatred in his blood.\n\nNimue still listens to the abyss.\n\nJasper still judges the fog.\n\nAnd somewhere, hidden in cargo holds, rookery ruins, sanctuary coves, and the dreams of Aurelion Veyr, the last dragon eggs wait to be saved.\n\n---","sections":[]},{"id":"public-rumours-vs-hidden-truth","title":"Public Rumours vs. Hidden Truth","summary":"Most people do not know the true history of the Shattered Seas. The player should uncover it gradually through quests, wrecks, charts, murals, ghostly encounters, sanctuary lore, and conflicting faction testimony.","markdown":"Most people do not know the true history of the Shattered Seas. The player should uncover it gradually through quests, wrecks, charts, murals, ghostly encounters, sanctuary lore, and conflicting faction testimony.\n\n### Common Sailor Rumours\n\n- \"The Shattering was a war between sea gods.\"\n- \"The dragons burned the world and fled.\"\n- \"Atlantis tried to save us, but the surface kingdoms betrayed them.\"\n- \"Pirates cracked the world open looking for gold.\"\n- \"Something woke beneath the waves and swallowed the continents.\"\n- \"Jasper Barrow caused it. That's why his ghost still sails.\"\n- \"The Unbinding Tide was when the sea monsters took revenge for being chained.\"\n- \"Ebon Flameheart gave the sea back to men.\"\n\n### The Atlantean Version\n\nAtlantean loyalists blame the surface world. They say humans broke the old treaties, pirates slaughtered dragons carelessly, and Atlantis attempted a desperate ritual to restore order before the world collapsed.\n\nThey describe the Age of the Drowned Crown as a mercy: a necessary order imposed on a broken world.\n\nThey describe the Unbinding Tide as barbarism: beasts and surface scavengers destroying the last true civilisation.\n\nSome Atlanteans know this is a lie.\n\nOthers believe it completely.\n\n### The Admiralty Version\n\nThe remaining human authorities blame pirates, dragons, natural disaster, and old sea magic. They bury Cassian Barrow's role because admitting that the Lord-Cartographer of the Admiralty helped cause the apocalypse would destroy what little faith remains in naval law.\n\nOfficially, Jasper Barrow remains a traitor in some Admiralty archives.\n\nUnofficially, many officers know the ink on those records smells like rot.\n\n### The Pirate Version\n\nPirates tell stories of three glories.\n\nThe first is the **Egg Rush**, when dragon eggs were worth more than kingdoms.\n\nThe second is the **Unbinding Tide**, when Atlantis lost its grip and the sea became open to those brave enough to take it.\n\nThe third is the **Age of Free Sails**, when Ebon Flameheart taught pirates to fight monsters, reopen routes, and grow rich on the bones of empires.\n\nMost pirates do not see these as sins.\n\nThey see them as proof that fortune belongs to those bold enough to steal it.\n\n### The Tidewarden Version\n\nThe Tidewardens preserve the hidden truth: the world was wounded by greed, and every age since has been shaped by those who tried to profit from the wound.\n\nThey believe dragon rescue is not charity. It is repair.\n\nEvery egg saved is a promise restored.\n\nEvery sanctuary protected is a stitch in the torn covenant of Land, Sea, and Sky.\n\n### Jasper's Version\n\nJasper remembers the truth, but not cleanly.\n\nHis memory is fractured by death, dragonfire, grief, and centuries of vengeance. When the player first meets him, he speaks in accusations, warnings, and half-remembered sorrow. Only by recovering relics, charts, bells, eggshell fragments, and ship logs can the player help him remember the whole story.\n\nJasper's judgment of Ebon is especially bitter:\n\n> \"My father sold the sky. Ebon taught men how to butcher it.\"\n\n---","body":"Most people do not know the true history of the Shattered Seas. The player should uncover it gradually through quests, wrecks, charts, murals, ghostly encounters, sanctuary lore, and conflicting faction testimony.\n\n### Common Sailor Rumours\n\n- \"The Shattering was a war between sea gods.\"\n- \"The dragons burned the world and fled.\"\n- \"Atlantis tried to save us, but the surface kingdoms betrayed them.\"\n- \"Pirates cracked the world open looking for gold.\"\n- \"Something woke beneath the waves and swallowed the continents.\"\n- \"Jasper Barrow caused it. That's why his ghost still sails.\"\n- \"The Unbinding Tide was when the sea monsters took revenge for being chained.\"\n- \"Ebon Flameheart gave the sea back to men.\"\n\n### The Atlantean Version\n\nAtlantean loyalists blame the surface world. They say humans broke the old treaties, pirates slaughtered dragons carelessly, and Atlantis attempted a desperate ritual to restore order before the world collapsed.\n\nThey describe the Age of the Drowned Crown as a mercy: a necessary order imposed on a broken world.\n\nThey describe the Unbinding Tide as barbarism: beasts and surface scavengers destroying the last true civilisation.\n\nSome Atlanteans know this is a lie.\n\nOthers believe it completely.\n\n### The Admiralty Version\n\nThe remaining human authorities blame pirates, dragons, natural disaster, and old sea magic. They bury Cassian Barrow's role because admitting that the Lord-Cartographer of the Admiralty helped cause the apocalypse would destroy what little faith remains in naval law.\n\nOfficially, Jasper Barrow remains a traitor in some Admiralty archives.\n\nUnofficially, many officers know the ink on those records smells like rot.\n\n### The Pirate Version\n\nPirates tell stories of three glories.\n\nThe first is the **Egg Rush**, when dragon eggs were worth more than kingdoms.\n\nThe second is the **Unbinding Tide**, when Atlantis lost its grip and the sea became open to those brave enough to take it.\n\nThe third is the **Age of Free Sails**, when Ebon Flameheart taught pirates to fight monsters, reopen routes, and grow rich on the bones of empires.\n\nMost pirates do not see these as sins.\n\nThey see them as proof that fortune belongs to those bold enough to steal it.\n\n### The Tidewarden Version\n\nThe Tidewardens preserve the hidden truth: the world was wounded by greed, and every age since has been shaped by those who tried to profit from the wound.\n\nThey believe dragon rescue is not charity. It is repair.\n\nEvery egg saved is a promise restored.\n\nEvery sanctuary protected is a stitch in the torn covenant of Land, Sea, and Sky.\n\n### Jasper's Version\n\nJasper remembers the truth, but not cleanly.\n\nHis memory is fractured by death, dragonfire, grief, and centuries of vengeance. When the player first meets him, he speaks in accusations, warnings, and half-remembered sorrow. Only by recovering relics, charts, bells, eggshell fragments, and ship logs can the player help him remember the whole story.\n\nJasper's judgment of Ebon is especially bitter:\n\n> \"My father sold the sky. Ebon taught men how to butcher it.\"\n\n---","sections":[{"id":"common-sailor-rumours","title":"Common Sailor Rumours","markdown":"- \"The Shattering was a war between sea gods.\"\n- \"The dragons burned the world and fled.\"\n- \"Atlantis tried to save us, but the surface kingdoms betrayed them.\"\n- \"Pirates cracked the world open looking for gold.\"\n- \"Something woke beneath the waves and swallowed the continents.\"\n- \"Jasper Barrow caused it. That's why his ghost still sails.\"\n- \"The Unbinding Tide was when the sea monsters took revenge for being chained.\"\n- \"Ebon Flameheart gave the sea back to men.\"","excerpt":"\"The Shattering was a war between
